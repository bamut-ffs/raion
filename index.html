<title>«Район»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Серые — системные Gray Apple. Они не нейтральные, а чуть синие, поэтому холод
     пришлось увести и на карту: дома и парки рядом с холодными панелями выглядели
     желтоватыми. Текстовые серые остались своими — systemGray на белом даёт 3,5:1,
     для подписей этого мало */
  --ground:#ededf2;
  --surface:#ffffff;
  --surface-2:#f2f2f7;
  --surface-3:#e5e5ea;
  --ink:#161616;
  --ink-2:#5c5c5c;
  --ink-3:#6f6f6f;
  --line:#e5e5ea;
  --line-2:#d1d1d6;
  --road:#ffffff;
  --road-2:#f5f5fa;
  --road-edge:#d1d1d6;
  --build:#dedee4;
  --build-2:#d2d2d9;
  --park:#d0d0d7;
  --park-2:#c4c4cc;
  --park-ink:#6f6f6f;
  --water:#c0c0c8;
  --water-edge:#a6a6af;
  /* Акценты взяты из системной палитры Apple (HIG → Color), но не из колонки Default:
     дефолтный оранжевый #FF8D28 под белым текстом даёт 2:1 и не читается. Заливки берут
     колонку Increased contrast (light) — она для того и существует, и даёт нам 6:1 вместо
     прежних 3:1. Подложки чипов — дефолтные яркие значения, разведённые белым до 14% */
  /* Яркий оранжевый вместо жжёной охры: тёмный вариант читался землистым везде, где цвет
     выходит за карту. Подпись на чипе от этого светлеет — если станет блёклой, текст уйдёт
     в обычный тёмный, а цвет останется точкой рядом, как у станций */
  --act:#ff8d28;
  --act-ink:#ffffff;
  --act-soft:#ffeade;
  --danger-solid:#e9152d;
  --danger-ink:#ffffff;
  --offer:#008932;
  --offer-ink:#ffffff;
  --offer-soft:#e3f7e8;
  /* индиго, а не purple: у Apple фиолетовый уходит в маджентовый и на находках
     читался бы розовым, а индиго почти совпадает с тем, что стояло здесь раньше */
  --find:#564ade;
  --find-ink:#ffffff;
  --find-soft:#e9e7fe;
  --brand:#00aaff;
  --brand-ink:#0d2130;
  --brand-icon:#0088c8;
  --brand-soft:#dff2ff;
  /* Граница поля ввода — systemGray Apple, 3,5:1 на белом. Отдельный токен, а не --line-2:
     разделитель и край поля решают разные задачи, и у поля норма жёстче — WCAG 1.4.11
     требует 3:1. Со старой рамкой было 1,3:1, и поле читалось как выключенное */
  --field-line:#8e8e93;
  /* Плотность кольца выбора разная по темам: тёмный ореол на белом читается при 16%,
     а светлый на почти чёрном при тех же 16% почти не виден — светлое на тёмном требует
     большей плотности */
  --ring:rgba(22,22,22,.16);
  /* Календарик у поля даты и часы у поля времени рисует браузер, а не мы. Их вид задаёт
     color-scheme: без него в тёмной теме они остаются чёрными на чёрном */
  color-scheme:light;
  --focus:#161616;
  --danger:#5c5c5c;
  --shadow-1:0 1px 2px rgba(0,0,0,.08);
  --shadow-2:0 2px 4px rgba(0,0,0,.07),0 10px 28px rgba(0,0,0,.13);
  --shadow-3:0 4px 8px rgba(0,0,0,.09),0 24px 60px rgba(0,0,0,.22);
  --r-s:6px; --r-m:10px; --r-l:16px; --panel-w:380px; --panel-b-w:340px; --home-peek:78px;
  /* высота верхней полосы экрана: одна на шапку с заголовком и на ряд вкладок, иначе
     в двух колонках рядом стоят две шапки разной высоты и списки под ними разъезжаются */
  --head-h:56px;
  /* первая полоса экрана: поле ввода 46 плюс поля по 16. Вторая — --head-h */
  --band-h:78px;
  /* сколько видно у свёрнутой карточки пина: ручка плюс две строки корешка */
  --pin-peek:68px;
  /* Типографика — шкала Авито (avito.design/article/typography). Кегль и интерлиньяж это
     одна пара: менять их можно только вместе, поэтому у каждого стиля две переменные.
     H* — заголовочные стили, M/S/XS — наборные. Правило контраста: над текстом S заголовок
     не мельче H60, над текстом M — не мельче H50. Размеры одинаковы на телефоне и десктопе. */
  --f-h20:26px;  --l-h20:30px;   /* заглавие онбординга */
  --f-h30:21px;  --l-h30:26px;   /* заголовок карточки пина и модальных окон */
  --f-h40:18px;  --l-h40:22px;   /* имя в шапке профиля */
  --f-h50:16px;  --l-h50:20px;   /* заголовки карточек и строк списка */
  --f-h60:14px;  --l-h60:18px;   /* мелкий заголовок над подписью S */
  --f-m10:15px;  --l-m10:22px;   /* наборный текст по умолчанию */
  --f-m20:15px;  --l-m20:20px;   /* списки, плотные блоки, контролы */
  --f-s10:13px;  --l-s10:18px;   /* второстепенный текст */
  --f-s20:13px;  --l-s20:16px;   /* второстепенный текст в плотных блоках */
  --f-xs10:11px; --l-xs10:14px;  /* надзаголовки и служебные подписи */
  /* Отступы: все кратны четырём. Между текстовыми блоками величину задаёт верхний стиль
     (правило Авито): после H20–H50 и M10 — 12, после M20, H60, S10, S20, XS10 — 8.
     Внутри плотных блоков — строк списка, карточек, шапок — отступ минимальный (4) или
     его нет вовсе: там текст разделён контрастом цвета, а не пустотой. Переменных для
     отступов нет намеренно: это правило, а не набор значений — проверяется делением на 4.
     Не подчиняются шкале оптические поправки (сдвиг иконки к базовой линии на 1–2px)
     и опорные величины каркаса: высота таббара 66, --home-peek, потолок шторок 100 */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121214;
    --surface:#1c1c1e;
    --surface-2:#2c2c2e;
    --surface-3:#3a3a3c;
    --ink:#ececec;
    --ink-2:#a1a1a1;
    --ink-3:#8f8f8f;
    /* линии светлее Gray5: разделитель обязан быть виден и на surface, и на surface-2,
       а они у Apple в тёмной теме стоят вплотную */
    --line:#38383a;
    --line-2:#48484a;
    --road:#333336;
    --road-2:#2b2b2e;
    --road-edge:#3d3d40;
    --build:#1e1e21;
    --build-2:#232326;
    --park:#252528;
    --park-2:#2a2a2d;
    --park-ink:#9a9a9a;
    --water:#2e2e31;
    --water-edge:#18181b;
    /* тёмная тема берёт колонку Default (dark): там цвета уже осветлены под тёмный фон,
       а иконки поверх остаются тёмными — на светящейся заливке белое слепит */
    --act:#ff9230;
    --act-ink:#1a0d08;
    --act-soft:#483423;
    --danger-solid:#ff4245;
    --danger-ink:#2a0c0e;
    --offer:#30d158;
    --offer-ink:#07200f;
    --offer-soft:#23432b;
    --find:#6d7cff;
    --find-ink:#0f1330;
    --find-soft:#2f324d;
    --brand:#00aaff;
    --brand-ink:#0d2130;
    --brand-icon:#00aaff;
    --brand-soft:#123244;
    --field-line:#8e8e93;
    --ring:rgba(236,236,236,.32);
    color-scheme:dark;
    --focus:#ececec;
    --danger:#a1a1a1;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
    --shadow-3:0 4px 8px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#121214;
  --surface:#1c1c1e;
  --surface-2:#2c2c2e;
  --surface-3:#3a3a3c;
  --ink:#ececec;
  --ink-2:#a1a1a1;
  --ink-3:#8f8f8f;
  /* линии светлее Gray5: разделитель обязан быть виден и на surface, и на surface-2,

  --line:#38383a;

  --road:#333336;
  --road-2:#2b2b2e;
  --road-edge:#3d3d40;
  --build:#1e1e21;
  --build-2:#232326;
  --park:#252528;
  --park-2:#2a2a2d;
  --park-ink:#9a9a9a;
  --water:#2e2e31;
  --water-edge:#18181b;
  /* тёмная тема берёт колонку Default (dark): там цвета уже осветлены под тёмный фон,
     а иконки поверх остаются тёмными — на светящейся заливке белое слепит */
  --act:#ff9230;
  --act-ink:#1a0d08;
  --act-soft:#483423;
  --danger-solid:#ff4245;
  --danger-ink:#2a0c0e;
  --offer:#30d158;
  --offer-ink:#07200f;
  --offer-soft:#23432b;
  --find:#6d7cff;
  --find-ink:#0f1330;
  --find-soft:#2f324d;
  --brand:#00aaff;
  --brand-ink:#0d2130;

  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:var(--f-m10);line-height:var(--l-m10);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
::selection{background:var(--brand-soft);color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
/* Системные полосы прокрутки скрыты во всём приложении: они забирали ширину у содержимого,
   и поле поиска прыгало, когда список результатов переставал прокручиваться. Вместо них —
   плашка .oscroll__thumb поверх содержимого, её ставит скрипт любому прокрученному элементу */
*{scrollbar-width:none}
*::-webkit-scrollbar{width:0;height:0}
.oscroll__thumb{
  position:absolute;right:3px;top:0;width:6px;border-radius:3px;background:var(--ink-3);
  opacity:0;transition:opacity .25s;z-index:9;
}
.oscroll__thumb.is-on{opacity:.38}
.oscroll__thumb.is-on:hover,.oscroll__thumb.is-drag{opacity:.62}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{display:flex;height:100dvh;overflow:hidden;position:relative}
/* компактный рейл: иконка сверху, подпись снизу — единый стиль для десктопа и мобильного таббара */
/* свой слой выше панели: панель теперь абсолютная и при сворачивании уезжает влево ровно на
   место рейла — без этого она ложилась бы поверх навигации и прятала её.
   На мобильном шторка (z-index 20) по-прежнему перекрывает таббар, как и задумано */
.rail{
  flex:0 0 84px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:16px 8px;background:var(--surface);border-right:1px solid var(--line);
  position:relative;z-index:12;
}
.brand{display:flex;align-items:center;justify-content:center;padding:4px 0 16px;width:100%;border-radius:var(--r-m)}
.brand:hover .brand__mark{opacity:.82}
.brand__mark{
  width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--ground);
  display:grid;place-items:center;flex:none;
}
.brand__mark svg{width:16px;height:16px}
.rail .brand__name{display:none}
.navbtn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:12px 4px;border-radius:var(--r-m);width:100%;
  color:var(--ink-2);font-size:var(--f-xs10);line-height:var(--l-xs10);font-weight:500;text-align:center;
  transition:background .12s,color .12s;
}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.is-on{background:var(--surface-3);color:var(--ink)}
/* от центра кнопки, а не от её правого края: иконка центрирована и на фиксированном рейле,
   и на резиновом таббаре, поэтому значок всегда стоит в одной точке относительно неё */
.navbtn__badge{
  position:absolute;top:4px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 4px;border-radius:10px;
  /* сигналы брендовые: красный оставлен за типом «активность» и за необратимым действием.
     Белый прописан явно — на брендовом фоне всегда белое, а --act-ink в тёмной теме тёмный */
  background:var(--brand);color:#fff;font-size:var(--f-xs10);line-height:var(--l-xs10);font-weight:600;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.rail__spacer{flex:1}
.about__meta{display:flex;flex-direction:column;gap:8px;font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-2)}
.about__meta b{display:inline-block;min-width:78px;color:var(--ink-3);font-weight:500}

/* Вне типографической шкалы и осознанно: инициалы в кружках аватаров, число в кластере,
   счётчик на плашке станции и знак вопроса в прицеле. Это не текст, который читают строкой,
   а графика внутри фигуры фиксированного размера — кегль там подбирается под саму фигуру */
/* внутри лежит сгенерированное лицо: собственного фона и букв аватару больше не нужно */
.avatar{
  width:30px;height:30px;border-radius:50%;flex:none;display:block;overflow:hidden;
  background-repeat:no-repeat;background-color:var(--surface-3);
}
.avatar svg{display:block;width:100%;height:100%}
.avatar--s{width:24px;height:24px;font-size:10px}
.avatar--l{width:42px;height:42px;font-size:15px}

/* ---------- stage ---------- */
.work{flex:1;display:flex;min-width:0;position:relative}
.panel-collapse{
  position:absolute;left:calc(var(--panel-w) + 4px);top:14px;
  width:24px;height:42px;border-radius:6px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);z-index:11;transition:left .22s ease;
}
.panel-collapse:hover{background:var(--surface-2);color:var(--ink)}
.panel-collapse svg{width:14px;height:14px}
.work.is-collapsed .panel-collapse{left:4px}
.work.is-collapsed .panel-collapse svg{transform:scaleX(-1)}
@media (max-width:820px){.panel-collapse{display:none}}
.stage{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--ground)}
.map{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map.is-drag{cursor:grabbing}
/* только сам холст карты: слой меток лежит внутри .map, и раньше это правило растягивало
   и значки в метках — значок метро схлопывался в ноль, а иконки в пинах распирало на всю каплю */
.map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.markers{position:absolute;inset:0;pointer-events:none}
/* Круги зон лежат своим слоем под метками: внутри метки круг более позднего пина
   закрашивал более ранние — их пины и подписи уходили в цвет */
.halos{position:absolute;inset:0;pointer-events:none;z-index:0}
.marker{position:absolute;left:0;top:0;will-change:transform}

.pin{
  pointer-events:auto;position:relative;display:grid;place-items:center;
  width:34px;height:34px;border-radius:50% 50% 50% 6px;transform:translate(-50%,-100%) rotate(-45deg);
  box-shadow:var(--shadow-2);transition:transform .14s cubic-bezier(.2,.7,.3,1.3);
  border:1.5px solid rgba(0,0,0,.10);
}
.pin>svg{width:16px;height:16px;transform:rotate(45deg)}
.pin--act{background:var(--act);color:var(--act-ink)}
.pin--offer{background:var(--offer);color:var(--offer-ink)}
.pin--find{background:var(--find);color:var(--find-ink)}
/* свои пины — брендовым цветом поверх категорийного, чтобы сразу бросались в глаза на карте */
.pin--mine{background:var(--brand);color:#fff}
.marker:hover .pin,.pin:focus-visible{transform:translate(-50%,-100%) rotate(-45deg) scale(1.12)}
.marker.is-sel .pin{transform:translate(-50%,-100%) rotate(-45deg) scale(1.28)}
.marker.is-sel{z-index:5}
/* пины вне выбранной станции приглушены: карта сшита из нескольких станций, а список —
   про одну. Кликабельными остаются, чтобы соседний пин можно было открыть */
.marker.is-dim .pin,.marker.is-dim .halo,.marker.is-dim .pin__label,.marker.is-dim .cluster{opacity:.35}
/* Пока открыта карточка, остальные булавки гаснут — выбранная и так крупнее, но на плотной
   карте одного размера мало. Глубина другая, чем у «вне охвата»: два разных смысла не должны
   выглядеть одинаково */
.map.is-selpin .pin,.map.is-selpin .cluster,.map.is-selpin .pin__label,.map.is-selpin .halo{opacity:.28}
.map.is-selpin .marker.is-sel .pin,.map.is-selpin .marker.is-sel .pin__label,
.map.is-selpin .marker.is-sel .halo{opacity:1}
.pin,.cluster,.pin__label{transition:opacity .18s ease}
.pin__label{
  position:absolute;left:0;top:8px;transform:translate(-50%,0);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);
  padding:3px 7px;font-size:var(--f-xs10);line-height:var(--l-xs10);font-weight:600;white-space:nowrap;max-width:170px;
  overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow-1);pointer-events:none;
}
.halo{
  position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%);
  background:color-mix(in srgb,var(--offer) 16%,transparent);
  border:1px dashed color-mix(in srgb,var(--offer) 55%,transparent);pointer-events:none;
}
/* у пропажи круг означает не сдвиг точки, а заявленную зону поиска — и цвет у него свой */
.halo--find{
  background:color-mix(in srgb,var(--find) 14%,transparent);
  border-color:color-mix(in srgb,var(--find) 55%,transparent);
}
.cluster{
  pointer-events:auto;position:relative;transform:translate(-50%,-50%);display:grid;place-items:center;
  width:40px;height:40px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-2);
  box-shadow:var(--shadow-2);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;
  transition:transform .14s;
}
.cluster:hover,.cluster:focus-visible{transform:translate(-50%,-50%) scale(1.08)}
.cluster__ring{position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--line);opacity:.55}
.cluster__mix{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);display:flex;gap:2px}
.cluster__mix i{width:6px;height:6px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px var(--surface)}
/* метка метро — экранного фиксированного размера (не масштабируется с картой),
   размер подобран под то, как она выглядела бы на масштабе ~130 м, некликабельна */
/* кружок, белая обводка и буква приходят из самого значка, поэтому ни фона, ни тени,
   ни скругления здесь больше не нужно — только размер и цвет линии */
.metrodot{pointer-events:none;display:block;width:24px;height:24px;transform:translate(-50%,-50%)}
/* плашка станции на дальнем зуме: подложка в цвет линии, значок сливается с ней и держится
   белой обводкой, число белое */
.stationbadge{
  pointer-events:auto;display:flex;align-items:center;gap:7px;padding:3px 13px 3px 3px;
  border-radius:999px;color:#fff;box-shadow:var(--shadow-2);transform:translate(-50%,-50%);
  font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;
}
.stationbadge svg{width:26px;height:26px;flex:none}
.stationbadge:hover{opacity:.9}
/* прицел выбора точки: неподвижен, карта ездит под ним. .pin внутри позиционирует себя тем же
   transform, что и обычные маркеры (тычет вниз). По вертикали прицел ставит скрипт — на телефоне
   он смещён вверх, потому что низ экрана занимает шторка */
.pick-center{position:absolute;left:50%;top:50%;width:0;height:0;z-index:6;pointer-events:none}
/* сам прицел брендовый и на пятую часть крупнее обычного пина: тип ещё не выбран, поэтому
   вместо иконки знак вопроса */
.pin--pick{width:41px;height:41px;background:var(--brand);color:#fff}
.pin--pick b{transform:rotate(45deg);font-size:18px;font-weight:700;line-height:1}
/* во время постановки точки существующие пины приглушаем: контекст рядом остаётся видно,
   но прицел среди них не теряется */
.map.is-pick .pin,.map.is-pick .cluster,.map.is-pick .halo,.map.is-pick .pin__label{opacity:.22}
.map.is-pick .marker.is-draft .pin,.map.is-pick .marker.is-draft .halo{opacity:1}

/* ---------- toolbar ---------- */
.toolbar{
  position:absolute;left:16px;right:16px;top:14px;display:flex;gap:12px;align-items:flex-start;
  justify-content:flex-end;
  pointer-events:none;flex-wrap:wrap;z-index:6;
}
.toolbar>*{pointer-events:auto}
/* Кнопка охвата уходит не только под развёрнутой шторкой: на экране фильтра она дублирует
   то, что вы там и меняете, а во время создания нажатие на неё уводит на фильтр — и уход
   с шага создания обнуляет черновик, то есть кнопка молча выбрасывала недоделанное */
.app.is-noscope .scopetop{opacity:0;pointer-events:none;transform:translateY(-160%) scale(.92)}
.card-float{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-2)}
/* два кружка внахлёст — индикатор выбранных категорий. Обводка цветом подложки отделяет их
   друг от друга; выключенная категория остаётся на месте, но становится контурной */
.catdots{display:flex;align-items:center;flex:none;--btn-bg:var(--surface)}
.catdots i{width:15px;height:15px;border-radius:50%;display:block;border:2px solid transparent;background:var(--btn-bg);box-shadow:0 0 0 2px var(--btn-bg)}
.catdots i+i{margin-left:-6px}


.zoomctl{transition:opacity .18s;position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:4}
.zoomctl__group{display:flex;flex-direction:column;border-radius:var(--r-m);overflow:hidden}
.zoomctl button{width:42px;height:42px;display:grid;place-items:center;color:var(--ink-2)}
.zoomctl__group button+button{border-top:1px solid var(--line)}
.zoomctl button:hover{background:var(--surface-2);color:var(--ink)}
.zoomctl svg{width:16px;height:16px}
.scalebar{
  position:absolute;right:16px;bottom:16px;font-size:var(--f-xs10);line-height:var(--l-xs10);color:var(--ink-2);z-index:4;
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:6px 8px;border-radius:var(--r-s);
  background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);
}
.scalebar__line{height:5px;border:1px solid var(--ink-3);border-top:none}


/* ---------- panel ---------- */
/* Панель лежит поверх карты, а не занимает место в строке: пока она была колонкой,
   сворачивание меняло ширину карты, и вся карта с пинами переезжала. Теперь карта всегда
   во всю ширину, а сворачивание — просто сдвиг слоя за левый край */
.panel{
  position:absolute;left:0;top:0;bottom:0;width:var(--panel-w);z-index:10;
  display:flex;flex-direction:column;min-height:0;min-width:0;order:-1;
  background:var(--surface);border-right:1px solid var(--line);
  transition:transform .22s ease;
}
.work.is-collapsed .panel{transform:translateX(-100%)}
/* Вторая колонка для вложенного: карточка пина, переписка, фильтр. Список остаётся слева,
   поэтому можно щёлкать пины подряд, не теряя места. Включается только с 1440 пикселей —
   ниже две панели заняли бы больше половины экрана */
.panel-b{
  position:absolute;left:var(--panel-w);top:0;bottom:0;width:var(--panel-b-w);z-index:9;
  display:flex;flex-direction:column;min-height:0;min-width:0;
  background:var(--surface);border-right:1px solid var(--line);transition:none;
}
@media (max-width:1439px){.panel-b{display:none}}
.work.is-collapsed .panel-b{display:none}
.work.has-detail .panel-collapse{left:calc(var(--panel-w) + var(--panel-b-w) + 4px)}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}
/* отклонение заявки — иконка без подписи, но по высоте вровень с «Принять» рядом */
.iconbtn--34{width:34px;height:34px}
/* шестерня в шапке профиля равняется на иконки таббара, а не на стрелки в шапках */
.iconbtn--20 svg{width:20px;height:20px}
/* та же первая полоса, что зона поиска: высота одна на все экраны, содержимое по центру.
   Раньше высота набиралась содержимым — 16 плюс аватар 42 плюс 16, — и профиль был
   на четыре пикселя ниже соседних экранов */
.profhead{display:flex;gap:13px;align-items:center;min-height:var(--band-h);border-bottom:1px solid var(--line)}
/* Кнопки у правого борта стоят группой. Общий зазор 13px плюс собственные поля значков
   давал между ними 25px против 22px до края — пара читалась как два отдельных контрола */
.headacts{display:flex;align-items:center;gap:4px;flex:none}
/* счётчик на колоколе, а не на строке: он говорит про то, что внутри, и должен быть виден
   там же, где вход */
.bellbtn{position:relative}
.bellbtn__n{
  position:absolute;top:-2px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--brand);color:#fff;font-size:var(--f-xs10);line-height:16px;font-weight:600;
  text-align:center;font-variant-numeric:tabular-nums;
}
/* незакреплённая зона между шапкой и телом: то, что не должно уезжать при прокрутке —
   сейчас это строка поиска */
/* Первая полоса экрана: её высоту диктует поле ввода (46 плюс поля по 16), и на неё же
   равняется шапка профиля. Раньше 16 стояло только у мобильной домашней шторки, а на
   десктопе оставалось 12 — зона поиска на карте и в сообщениях расходились на девять
   пикселей ровно там, где их сравнивают при переключении экранов */
.panel__top{flex:none;padding:16px;border-bottom:1px solid var(--line)}
/* Вкладки приносят свои отступы и свою линию. Внутри общей зоны они получали вторые
   и те, и другие: по бокам отступ удваивался, снизу появлялась вторая граница */
.panel__top--flush{padding:0;border-bottom:none}
/* поле поиска и полоса шагов приносят свои поля сами: в сообщениях зона поиска такая же,
   как на карте, а у шагов поле своё, заданное .stepbar */
.searchzone{padding:16px;border-bottom:1px solid var(--line)}
/* закреплённая зона заодно ловит жест перетаскивания шторки, поэтому кнопкам шагов
   нужно отдать их собственные нажатия — иначе тап по пройденному шагу уходит в жест */
.panel__top .stepbar{touch-action:auto}
.panel__body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.panel__foot{flex:none;padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pad{padding:16px}
/* Лестница отступов: 4 внутри пары, 8 внутри группы, 16 между группами, 24 внешнее поле.
   Раньше блок стоял в поле 16, а группы внутри него разъезжались на 24 — внешнее было
   меньше внутреннего, и группы читались как отдельные блоки. По горизонтали поле остаётся
   16: оно держит вертикаль текста заодно со строками списка, у которых столько же */
.pad.stack{padding:24px 16px}

/* ---------- generic bits ---------- */
.eyebrow{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--f-xs10);line-height:var(--l-xs10);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:20px 20px 0 20px;
  font-size:var(--f-s20);line-height:var(--l-s20);font-weight:500;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;
}
.chip svg{width:13px;height:13px}
.chip--act{background:var(--act-soft);color:var(--act)}
.chip--offer{background:var(--offer-soft);color:var(--offer)}
.chip--find{background:var(--find-soft);color:var(--find)}
/* «Ваш пин» — бледная брендовая заливка с тёмным брендовым текстом. Правило «на брендовом
   фоне только белое» здесь не работает: фон не сам --brand, а его светлый оттенок */
.chip--brand{background:var(--brand-soft);color:var(--brand-icon)}
/* Не прозрачный, а белый: когда строка под курсором или выбрана, она заливается серым,
   и прозрачный тег темнел вместе с ней. Белая плашка остаётся плашкой в любом состоянии */
.chip--muted{background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
/* Тег — не чип. Чип со срезанным углом называет, что это за объект: тип события, станция,
   «Ваш пин». Тег говорит о состоянии или числе, он мельче и без фирменного угла, иначе
   в строке списка два чипа спорят за внимание */
/* Отступы 3/1 вместо 2/2: сумма по вертикали та же, высота не двинулась, а текст сел выше.
   Фон белый с рамкой, а не заливка: строка списка под курсором красится в surface-2,
   и залитый тег на ней растворялся бы — как было с дорожкой прогресса */
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:0 7px 1px;border-radius:6px;
  font-size:var(--f-xs10);line-height:var(--l-xs10);font-weight:500;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-3);white-space:nowrap;
}
.tag svg{width:11px;height:11px}
.tag--line{background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
/* Счётчик в шапке залит: белый с рамкой там терялся на сером. Пара переворачивается сама —
   в светлой теме тёмная заливка со светлыми цифрами, в тёмной наоборот, как у категорийных
   цветов, где значок на светящейся заливке тоже тёмный */
.tag--solid{background:var(--ink-2);border-color:transparent;color:var(--surface)}
/* Обращения сервиса к вам: один блок ниже тела карточки. Белое с рамкой — вокруг серые
   строки содержимого, и залитая плашка сливалась с ними в ещё одну такую же строку */
.cardnotes{display:flex;flex-direction:column;gap:8px;margin-top:4px}
/* Обращение сервиса и карточка уведомления — один объект в двух местах, поэтому метрика
   и типографика у них общие: поле 16, зазор 8, заголовок 16/20, текст 13/18, пара 8.
   Разным остаётся только фон, и это осознанно: в карточке вокруг серые строки содержимого,
   поэтому обращение белое с рамкой; в канале вокруг белая панель, поэтому новое — залитое */
.cardnote{
  display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r-m);
  border:1px solid var(--field-line);background:var(--surface);
  font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-2);
}
.cardnote b{display:block;font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;color:var(--ink)}
/* 4 при интерлиньяже 18. Слипалось раньше не из-за четвёрки, а из-за тесных 13/16:
   просвет между строками абзаца был меньше, чем нужно, и отступ сверху на его фоне
   читался как ничто. Интерлиньяж вылечил причину — восьмёрка лечила бы уже здоровое */
.cardnote p{margin:4px 0 0;color:var(--ink-3);font-size:var(--f-s10);line-height:var(--l-s10)}
.cardnote .row{display:flex;gap:8px}
.cardnote .row .btn{flex:1}
/* итог в уведомлении — плашка без обводки: это не действие и не тип, а результат */
.chip--plate{background:var(--surface);border:none;color:var(--ink-2)}
/* Сегментед-контрол: одна дорожка, сегменты внутри. Отдельно стоящие чипы не показывали,
   что варианты составляют один выбор, а общая подложка это говорит без слов — включённые
   подряд сегменты сливаются в сплошную полосу, и «показано всё» видно с одного взгляда.
   Поэтому же кнопка «Все» не нужна: сплошная полоса и есть это состояние */
/* В форме контрол стоит среди полей ввода и обязан быть с ними одного роста: 44 в высоту
   и кегль 15, иначе рядом с полем он выглядит недомерком */
.segctl{display:flex;gap:3px;padding:3px;border-radius:var(--r-m);background:var(--surface-2)}
.segctl button{
  flex:1;min-width:0;padding:9px 6px;border-radius:7px;text-align:center;
  font-size:var(--f-m20);line-height:var(--l-m20);font-weight:500;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.segctl button:hover{color:var(--ink)}
.segctl button.is-on{background:var(--surface);color:var(--ink);font-weight:600}
/* Фильтр категорий — другой случай: не поле формы, а вторичный выбор над списком, поэтому
   кегль служебный. Состояние говорит кружок — залит, когда категория показывается, — а
   заливка сегмента убрана: она сказала бы то же самое второй раз */
/* Строки в столбик, кружок и подпись в строку. Выбранная — белая плашка с тенью на серой
   дорожке: так сразу видно, что выбрано, и контрол читается как один предмет, а не как
   продолжение списка станций под ним. Кегль тот же, что у названия станции */
.segctl--cat{flex-direction:column}
.segctl--cat button{
  flex:none;flex-direction:row;gap:6px;padding:10px 12px;white-space:normal;text-align:left;
  font-size:var(--f-h50);line-height:var(--l-h50);display:flex;align-items:center;justify-content:flex-start;
}
.segctl--cat button.is-on{background:var(--surface);box-shadow:var(--shadow-1);font-weight:600}
.segctl--cat i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid transparent;display:block}
/* значок метро в чипе крупнее прочих иконок: на 13px белая обводка тоньше пикселя и мажется */
.chip-metro{width:15px;height:15px;flex:none}
.chip .chip-metro{width:15px;height:15px}
/* точка в цвет линии — для мелких мест, где значок метро превращался в грязь */
.linedot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;vertical-align:1px}
/* Точка и название — один блок: кружок читается как часть названия, а не как значок
   между двумя величинами. Внутри зазор маленький, снаружи обычный */
.stn{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip .stn{margin-left:4px}
.scopebtn__more{margin:0;color:var(--ink-3)}
.scopebtn__st{gap:4px}
/* счётчик-кнопка, открывающая список станций: выглядит как дропдаун, а не как заголовок */
/* кнопка станции занимает строку целиком: рядом с сортировкой она делила ширину и текст
   ломался на две строки */
/* та же высота, что у ряда вкладок: переменная заведена ровно для этого — «одна на шапку
   с заголовком и на ряд вкладок», — а счётчик набирал свою высоту отступами и промахивался
   на два пикселя. На карте и в сообщениях первые две полосы теперь совпадают до пикселя */
.scoperow{padding:0 16px;min-height:var(--head-h);display:flex;align-items:center;border-bottom:1px solid var(--line)}
.scopebtn{display:flex;width:100%;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-m);font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-2)}
.scopebtn b{white-space:nowrap}
/* станция прижата к шеврону, счётчик остаётся слева: это две разные сущности, и между
   ними должно быть пусто, а не одинаковые зазоры */
.scopebtn__st{margin-left:auto;display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scopebtn:hover{background:var(--surface-2)}
.scopebtn b{font-weight:600;color:var(--ink)}
.scopebtn>svg:last-child{width:14px;height:14px;color:var(--ink-3);flex:none}
/* кнопка фильтра над картой — только на мобильном: там панель по умолчанию свёрнута,
   и иначе фильтр со станцией прятались бы за свайп. Правило стоит после общего,
   иначе оно проигрывает ему по порядку */
.scopetop{display:none}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:var(--r-m);
  font-size:var(--f-m20);line-height:var(--l-m20);font-weight:600;transition:opacity .12s,background .12s;width:100%;
}
.btn svg{width:16px;height:16px}
/* Основная кнопка везде одна и брендовая. Раньше их было три — чёрная в мастере создания,
   красная в активностях, синяя в вещах, — и цвет сообщал только раздел, а не важность.
   Красное осталось за необратимым: удалить, сбросить, пожаловаться */
.btn--primary,.btn--brand{background:var(--brand);color:#fff}
/* необратимое действие — единственное место, где остался красный */
/* белый на красном в обеих темах: заливка цветная, значит подпись задаётся жёстко */
.btn--danger-solid{background:var(--danger-solid);color:#fff}
.btn--primary:hover,.btn--brand:hover,.btn--danger-solid:hover{opacity:.9}
.btn--ghost{background:var(--surface-2);color:var(--ink)}
.btn--ghost:hover{background:var(--surface-3)}
.btn--line{border:1px solid var(--line-2);color:var(--ink-2)}
.btn--line:hover{background:var(--surface-2);color:var(--ink)}
.btn--danger{color:var(--danger);background:transparent}
.btn--danger:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn--sm{padding:8px 12px;font-size:var(--f-s10);line-height:var(--l-s10);width:auto}
.row{display:flex;gap:8px}
.row>.btn{flex:1}
.empty{padding:44px 24px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:12px}
/* только прямой потомок: селектор потомков раздувал и значки внутри кнопок под ним */
.empty>svg{width:26px;height:26px;opacity:.5}
.empty b{color:var(--ink-2);font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600}
.empty p{margin:0;font-size:var(--f-s10);line-height:var(--l-s10);max-width:34ch}
.divider{height:1px;background:var(--line);margin:0}
/* крупный разделитель между группами: там, где волосок не отделяет, а только царапает */
.divider--lg{height:8px;background:var(--surface-2)}
/* выбранные станции чипами: их видно все разом, и снять любую можно одним нажатием */
.stchips{display:flex;flex-wrap:wrap;gap:8px;padding:16px}
.stchip{width:auto;border:1px solid var(--line);gap:6px}
.stchip svg{width:12px;height:12px;color:var(--ink-3)}
.stchip:hover{background:var(--surface-2)}
.stclear{padding:0 16px 16px}
/* текстовая кнопка: читается как действие, а не как ещё одна выбранная станция */
.linkbtn{font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-3);text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--ink)}


/* ---------- switch ---------- */
/* тумблер вернулся вместе с оповещениями о пропажах: это единственная механика, где сервис
   пишет тому, кто ни на что не подписывался, и выключатель к ней обязателен */
/* тумблер прижат к верху: против двух-трёх строк пояснения по центру он смотрелся криво */
.switchrow{display:flex;align-items:flex-start;gap:16px;padding:4px}
.switchrow .switch{margin-top:-2px}
.switchrow__txt{flex:1;min-width:0}
.switchrow b{display:block;font-size:var(--f-h60);line-height:var(--l-h60);font-weight:600}
.switchrow span{display:block;font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3);margin-top:4px}
.switch{
  flex:none;width:42px;height:25px;padding:2px;border-radius:999px;
  background:var(--surface-3);border:1px solid var(--line-2);position:relative;
  transition:background .15s,border-color .15s;
}
.switch i{
  /* дорожка задана серым или брендовым одинаково в обеих темах — значит и кружок жёстко */
  display:block;width:19px;height:19px;border-radius:50%;background:#fff;
  box-shadow:var(--shadow-2);transition:transform .15s;
}
.switch.is-on{background:var(--brand);border-color:var(--brand)}
.switch.is-on i{transform:translateX(17px)}

/* ---------- pin card ---------- */
/* Высота обложки — пропорция, а не число: раньше стояло 132px без всякого правила, и на
   широком экране обложка выглядела полоской. Фотография показывается целиком и по центру
   (contain, а не cover): кадрировать чужой снимок мы не вправе, а по краям и так лежит
   подложка в цвет категории. Отступ нужен, чтобы снимок не доходил до краёв — шапка
   карточки лежит поверх обложки, и без него кнопки оказывались на фотографии */
.cover{
  aspect-ratio:16/9;max-height:340px;position:relative;display:grid;place-items:center;
  overflow:hidden;flex:none;padding:10px;
}
.cover img{width:100%;height:100%;object-fit:contain;object-position:center}
/* затемнение под шапкой: кнопки обязаны читаться на любом снимке */
.cover::before{
  content:'';position:absolute;left:0;right:0;top:0;height:76px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.16),transparent);
}
.cover--act{background:var(--act-soft)}
.cover--offer{background:var(--offer-soft)}
.cover--find{background:var(--find-soft)}
.cover__glyph{width:44px;height:44px;opacity:.42}
.cover--act .cover__glyph{color:var(--act)}
.cover--offer .cover__glyph{color:var(--offer)}
.cover--find .cover__glyph{color:var(--find)}
/* статус переехал вниз: сверху теперь стоят кнопки, вынесенные на саму обложку */
.cover__status{position:absolute;right:16px;bottom:12px}
/* Шапка карточки лежит поверх обложки, а не отдельной полосой над ней: кнопки стоят прямо
   на фотографии, на тех же отступах, что и раньше. Пока карточка не прокручена, шапка
   прозрачная; на фотографии под кнопки подкладывается градиент — тёмная иконка на светлом
   снимке иначе теряется. Стоит прокрутить — шапка становится обычной, градиент уходит,
   проявляется название пина */
.panelhead--over{position:absolute;top:0;left:0;right:0;z-index:3;pointer-events:none;transition:background .18s,border-color .18s;border-bottom:1px solid transparent}
.panelhead--over>*{pointer-events:auto}
.panelhead--over .chathead{background:transparent;border-bottom:none}
/* Кнопки на обложке стоят на светлой полупрозрачной плашке всегда, а не проявляются под
   курсором: тёмная иконка на такой плашке читается и на светлой фотографии, и на тёмной.
   Прежний градиент поверх снимка больше не нужен — он затемнял верх каждой фотографии
   ради белых иконок, которых теперь нет */
/* Плашка задана белой в обеих темах, значит и значок на ней задаётся жёстко. Токен
   здесь ловушка: --ink переворачивается, и в тёмной теме светлый значок оказывался
   на светлой плашке */
.panelhead--over .iconbtn{background:rgba(255,255,255,.74);color:#161616;backdrop-filter:blur(6px)}
.panelhead--over .iconbtn:hover{background:rgba(255,255,255,.92);color:#161616}
.panelhead--over.is-photo .sheet-grip::before{background:rgba(255,255,255,.75)}
/* прокрутили — шапка стала обычной полосой, и плашка под кнопками больше не нужна */
.is-scrolled .panelhead--over{background:var(--surface);border-bottom-color:var(--line)}
.is-scrolled .panelhead--over .iconbtn{background:none;color:var(--ink-2);backdrop-filter:none}
.is-scrolled .panelhead--over .iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.is-scrolled .panelhead--over.is-photo .sheet-grip::before{background:var(--line-2)}
/* снизу больше остальных сторон: под карточкой сразу кнопки действий, и им нужен воздух */
.pincard{padding:16px;display:flex;flex-direction:column;gap:12px}
.pincard h2{font-size:var(--f-h30);line-height:var(--l-h30);font-weight:600;margin:0;text-wrap:balance}
.pincard p{margin:0;color:var(--ink-2);font-size:var(--f-m10);line-height:var(--l-m10);white-space:pre-wrap}
.metaline{display:flex;flex-wrap:wrap;gap:8px}
.factrow{display:flex;gap:12px;align-items:flex-start;font-size:var(--f-h60);line-height:var(--l-h60)}
.factrow svg{width:16px;height:16px;color:var(--ink-3);flex:none;margin-top:2px}
.factrow b{font-weight:600}
.factrow span{color:var(--ink-3);font-size:var(--f-s20);line-height:var(--l-s20);display:block;margin-top:4px}
/* Обе кнопки — автор и участники — одного роста: содержимое внутри держится в 36, поэтому
   при центрировании верхняя строка встаёт на те же 12 сверху, а полоса заполнения остаётся
   там же, где была, просто снизу добавляется воздух */
.author{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-m);background:var(--surface-2);width:100%;text-align:left;min-height:60px}
/* без подписи содержимое встаёт по центру: минимальная высота 36 — это место под две
   строки, и одинокая строка висела в верхней трети. Высота самой строки не меняется */
.author__body{flex:1;min-width:0;min-height:36px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.author:hover{background:var(--surface-3)}
.author--flat,.author--flat:hover{background:var(--surface-2);cursor:default}
.author>svg:last-child{width:16px;height:16px;color:var(--ink-3);flex:none;margin-left:auto}
.person{width:100%;text-align:left;border-radius:var(--r-s)}
button.person:hover{background:var(--surface-2)}
/* В заявке строка не кнопка: справа стоят «Принять» и крестик, поэтому подсветка всей
   строки обещала бы переход, которого нет. Ведут в профиль имя с аватаром, а подсказка —
   шеврон, проявляющийся под курсором. Он стоит сразу за именем: у правого края уже
   два действия, и третий значок там читался бы как ещё одно */
.person__who{display:flex;align-items:center;gap:8px;min-width:0;border-radius:var(--r-s)}
.person__who svg{width:14px;height:14px;color:var(--ink-3);flex:none;opacity:0;transition:opacity .12s}
.person__who:hover svg{opacity:1}
.author__n{font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600}
.author__s{font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3)}

.people{display:flex;flex-direction:column;gap:4px}
/* Экран участников: строка кликабельна целиком, поэтому и подсветка должна быть строкой,
   а не полосой ровно по тексту. Боковое поле переезжает со списка на саму строку — текст
   остаётся на прежнем отступе, а подсветка уходит под него. В карточке пина тот же .people
   стоит в блоке «Заявки», где строки не нажимаются, — туда правило не достаёт */
.peoplelist{padding:8px 8px 16px}
.peoplelist .person{padding:8px}
.person{display:flex;align-items:center;gap:8px;padding:8px 0}
/* Блок заявок внутри карточки: у крайних строк внешние поля снимаем, иначе снизу
   к зазору карточки прибавлялись собственные 8 строки и выходило 20 против 12 сверху.
   Строки здесь не кнопки — справа «Принять» и крестик, — запас под палец им не нужен;
   на экране участников строка кликабельна целиком, там поля остаются */
.cardpend{margin:4px 0}
.cardpend .person:first-child{padding-top:0}
.cardpend .person:last-child{padding-bottom:0}
.person__n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--f-m20);line-height:var(--l-m20)}
/* метки прижаты к правому краю: слева читается столбец имён, справа — столбец меток,
   и глазу не приходится искать их на разном отступе у каждой строки */
.person__tags{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px}
.person__s{margin-left:auto;font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3)}
/* дорожка белая, а не surface-3: строка участников под курсором красится ровно
   в surface-3, и дорожка сливалась с ней — полоса теряла второй конец */
.progress{height:5px;border-radius:3px;background:var(--surface);overflow:hidden}
.progress i{display:block;height:100%;background:var(--act);border-radius:3px}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.photos img{width:82px;height:82px;object-fit:cover;border-radius:var(--r-s);flex:none;border:1px solid var(--line)}

/* ---------- feed ---------- */
.feedlist{display:flex;flex-direction:column}
.feed__sort{display:flex;align-items:center;gap:8px;padding:0 4px 4px;color:var(--ink-3);font-size:var(--f-s10);line-height:var(--l-s10);border-bottom:1px solid var(--line)}
/* Шапка списка приклеена сверху и выезжает поверх содержимого, а не сжимается в потоке.
   Сжимаясь, она укорачивала список, браузер подтягивал прокрутку, и получалась борьба:
   шапка то уезжала, то возвращалась сама. Приклеенная ничего не двигает */
.feedhead{position:sticky;top:0;z-index:3;background:var(--surface);transition:transform .2s ease;will-change:transform}
.feedhead.is-away{pointer-events:none}
/* активное состояние серой заливкой, как у вкладок профиля и переключателя над картой:
   белая таблетка рисовалась для ленты на сером фоне и в панели сливалась с белым */
.feed__sort button{padding:4px 12px;border-radius:7px;font-size:var(--f-s10);line-height:var(--l-s10);font-weight:500;color:var(--ink-3)}
.feed__sort button:hover{color:var(--ink)}
.feed__sort button.is-on{background:var(--surface-3);color:var(--ink);font-weight:600}
/* Список пинов — не карточки, а строки во всю доступную ширину. Карточка с собственной
   рамкой была единственным таким элементом во всём приложении: чаты, станции и профиль
   давно живут на строках с разделителем. Цветного корешка типа тоже больше нет — он
   дублировал чип категории, который стоит первой строкой в самой карточке */
/* Разделители не доходят до краёв: линия принадлежит содержимому строки, а не панели.
   Псевдоэлементом, а не рамкой, — рамку внутрь не подвинуть */
.fcard{position:relative;display:block;background:var(--surface);width:100%;transition:background .14s}
.fcard::after,.listrow::after,.districtrow::after{
  content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--line);
  transition:left .14s,right .14s;
}
/* Последняя строка своей линии не рисует: ниже почти всегда чужая граница — таббар,
   подвал с кнопками, край панели, — и две линии встают в пиксель друг от друга */
.feedlist .fcard:last-child::after,
.listrow:last-child::after,
.districtrow:last-child::after{display:none}
/* Под курсором и у открытой строки линии расходятся до краёв — своя нижняя и нижняя
   предыдущей строки, то есть та, что видна сверху. Предыдущую обычным селектором не
   выбрать, поэтому :has(); где его нет, растянется одна нижняя и ничего не сломается */
.fcard:hover::after,.fcard.is-sel::after,.listrow:hover::after,.listrow.is-sel::after,
.districtrow:hover::after,.districtrow.is-on::after{left:0;right:0}
.fcard:has(+ .fcard:hover)::after,.fcard:has(+ .fcard.is-sel)::after,
.listrow:has(+ .listrow:hover)::after,.listrow:has(+ .listrow.is-sel)::after,
.districtrow:has(+ .districtrow:hover)::after,.districtrow:has(+ .districtrow.is-on)::after{left:0;right:0}
/* строка над крупным разделителем свою линию не рисует: границу и так задаёт полоса,
   а вместе они давали некрасивый стык короткой линии с длинной */
.fcard:has(+ .divider--lg)::after,.listrow:has(+ .divider--lg)::after,
.districtrow:has(+ .divider--lg)::after{display:none}
/* открытая во второй колонке строка помечается той же заливкой, что и карточка списка */
.listrow.is-sel{background:var(--surface-2)}
/* тип пина в строке чата: место под линию занято всегда, цвет появляется только там,
   где он что-то сообщает */
.listrow__rule{position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 999px 999px 0;background:transparent}
.listrow__rule--act{background:var(--act)}
.listrow__rule--offer{background:var(--offer)}
.listrow__rule--find{background:var(--find)}
.fcard:hover{background:var(--surface-2)}

/* Выбранная строка — только в двухколоночном режиме, где список виден рядом с карточкой.
   Корешок справа и обводка внутрь рисуются поверх содержимого и потому ничего не сдвигают
   при клике; фон не трогаем — он уже занят наведением.
   Цвет тот же, которым в рейле отмечен выбранный пункт, — --surface-3. Наведение остаётся
   на --surface-2, то есть выбор и наведение разведены той же парой оттенков, что и в меню */
/* Выбранная строка заливается тем же цветом, что и строка под курсором. Обводка и корешок
   справа убраны: три способа сказать «эта» вместо одного. Выбранная от наведённой отличается
   тем, что остаётся на месте, а наведённая едет за курсором */
.fcard.is-sel{background:var(--surface-2)}
/* Вертикальная линия слева вместо цветного тега категории: тип теперь виден цветом, а не
   ещё одним чипом в и без того плотной строке. Это не корешок прежних версий — тот стоял
   встык у края; здесь слева обычное поле карточки, а справа зазор чуть меньше, поэтому
   линия читается как часть содержимого, а не как метка на кромке строки */
.fcard__main{padding:16px;min-width:0;display:flex;gap:12px}
/* цвет основной, а не светлый оттенок: полоской в 4px оттенок почти не читался,
   а под курсором на сером фоне растворялся совсем */
.fcard__rule{width:4px;border-radius:999px;flex:none;background:var(--ink-3)}
.fcard__rule--act{background:var(--act)}
.fcard__rule--offer{background:var(--offer)}
.fcard__rule--find{background:var(--find)}
.fcard__col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
/* заголовок максимум в две строки, дальше многоточие: карточки держат общую высоту */
.fcard__t{font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard__d{font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fcard__m{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
/* дата слева, повтор справа: они относятся к разному — одна к ближайшему разу,
   другой ко всему ряду встреч, — и разведённые по краям не читаются одной фразой */
.fcard__when{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3)}
.fcard__rep{flex:none}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:8px}
.field>label{font-size:var(--f-s10);line-height:var(--l-s10);font-weight:600;color:var(--ink-2)}
.field .hint{font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3)}
/* обязательные поля: их ровно три — заголовок, дата и время. Остальные имеют значения
   по умолчанию, и звёздочка на них обесценила бы саму пометку */
.req{color:var(--danger-solid);font-weight:700;margin-left:2px}
/* Поле стоит на белом и обведено настоящей рамкой. Раньше было наоборот: серая заливка
   темнее панели и почти невидимый край — то же отношение, что у выключенного контрола,
   и тестировщики читали поля как недоступные. Серую заливку забрал себе дизейбл */
.input,.textarea,.select{
  width:100%;padding:12px;border-radius:var(--r-m);border:1px solid var(--field-line);
  background:var(--surface);color:var(--ink);caret-color:var(--ink);
  font-size:var(--f-m20);line-height:var(--l-m20);transition:border-color .12s,box-shadow .12s;
}
.input::placeholder,.textarea::placeholder{color:var(--ink-3);opacity:1}
.input:focus,.textarea:focus,.select:focus{
  outline:none;border-color:var(--focus);
  box-shadow:0 0 0 3px var(--ring);
}
.input[disabled],.textarea[disabled],.select[disabled]{
  background:var(--surface-2);color:var(--ink-3);border-color:var(--line-2);cursor:not-allowed;
}
.textarea{resize:vertical;min-height:92px;font-family:inherit}
/* ползунок радиуса: своя дорожка и бегунок — системные в разных браузерах разного роста
   и ломают ритм формы */
input[type=range].input{padding:0;height:36px;background:transparent;border:none;appearance:none}
input[type=range].input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--surface-3)}
input[type=range].input::-webkit-slider-thumb{appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-2)}
input[type=range].input::-moz-range-track{height:4px;border-radius:2px;background:var(--surface-3)}
input[type=range].input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2)}
.select{appearance:none;cursor:pointer}
/* системную стрелку у селекта мы убрали, поэтому рисуем свою — без неё он неотличим
   от поля ввода. Насквозь кликабельна, чтобы попадание шло в сам список */
.selectwrap{position:relative}
.selectwrap .select{padding-right:36px}
.selectwrap__chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ручка для перетаскивания домашней шторки — она же подсказка, что шторку можно тянуть */
/* Ручка стоит первой в шторке и всегда одинаково: раньше у домашней она жила внутри
   верхней зоны с отступом снизу, у остальных — перед шапкой с отступом сверху, и посадка
   не совпадала. Полоса тянется во всю ширину, чтобы попадать по ней было легко, а видна
   только сама плашка */
/* Ручка вынесена над шторкой, на затемнение: так она заодно расширяет зону перетаскивания
   вверх, за пределы самой шторки, и не отнимает строку у содержимого */
.sheet-grip{
  position:absolute;left:0;right:0;top:-22px;height:22px;display:flex;align-items:center;
  cursor:grab;touch-action:none;z-index:4;
}
.sheet-grip::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.85);margin:0 auto;box-shadow:0 1px 2px rgba(0,0,0,.18)}
/* во весь экран затемнения над шторкой нет — ручке там не на чем лежать */
.panel.is-full .sheet-grip{display:none}
@media (min-width:821px){.sheet-grip{display:none}}
.searchfield{position:relative}
.searchfield .input{padding-left:38px;padding-right:40px}
/* лупа остаётся на месте и при фокусе; насквозь кликабельна, чтобы попадание ставило курсор */
.searchfield__ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);pointer-events:none}
/* кружок линии на месте лупы, пока строка не в работе: она показывает станцию, а не ищет */
.searchfield__dot{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;pointer-events:none}
.searchfield__clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.searchfield__clear:hover{background:var(--surface-3);color:var(--ink)}
.searchfield__clear svg{width:13px;height:13px}
/* между группами втрое больше, чем внутри группы: при двукратном отрыве граница групп
   не читалась, и подписи следующей спорили с содержимым предыдущей */
.stack{display:flex;flex-direction:column;gap:16px}
/* строка прогресса: сама полоса плюс название шага справа (на мобильном название
   стоит в шапке шторки, поэтому здесь скрыто) */
/* Полоса шагов: у каждого отрезка своя подпись сверху, текущий шаг тёмный и жирный.
   Пройденные отрезки — кнопки, возвращают к своему шагу; будущие отключены */
/* полоса шагов — вторая полоса экрана (первая у создания это шапка с названием), поэтому
   высота у неё общая с рядом вкладок и счётчиком станции, а снизу разделитель, как у них */
.stepbar{display:flex;gap:12px;padding:0 16px;min-height:var(--head-h);align-items:center;border-bottom:1px solid var(--line)}
.stepseg{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.stepseg__t{font-size:var(--f-s20);line-height:var(--l-s20);font-weight:500;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepseg.is-now .stepseg__t{color:var(--ink);font-weight:700}
.stepseg i{display:block;height:3px;border-radius:2px;background:var(--brand-soft);position:relative;overflow:hidden}
/* заливка растёт от левого края — поэтому при возврате назад она с правого края и сходит */
.stepseg i::after{content:'';position:absolute;inset:0;border-radius:2px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .34s ease}
.stepseg.is-on i::after{transform:scaleX(1)}
.stepseg:disabled{cursor:default}
/* Контролы выбора говорят одним языком: белый фон, видимая рамка, выбор показывает кольцо.
   Раньше было наоборот — невыбранная карточка серая, выбранная белая, — и заливка стояла
   на состоянии «не тронуто», где она читается как «выключено» */
.typecard{
  display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-m);
  border:1px solid var(--field-line);background:var(--surface);width:100%;
  transition:border-color .12s,box-shadow .12s;
}
.typecard:hover{border-color:var(--ink-2)}
/* Знак типа говорит заливкой, а не силой цвета: невыбранный — мягкая подложка с цветным
   значком, выбранный — сплошная заливка и светлый значок, ровно как булавка того же типа
   на карте. Цвет значка берётся тем же токеном, поэтому тёмная тема достаётся даром */
.typecard.is-on .typecard__ic{background:var(--tc-solid);color:var(--tc-ink)}
.typecard--act{--tc-solid:var(--act);--tc-ink:var(--act-ink)}
.typecard--offer{--tc-solid:var(--offer);--tc-ink:var(--offer-ink)}
.typecard--find{--tc-solid:var(--find);--tc-ink:var(--find-ink)}
/* Рамка при выборе остаётся обычной: тёмная обводка вместе с кольцом давала двойной
   сигнал, и громче звучал самый тяжёлый. Второй признак — ведущий элемент в полную силу,
   у невыбранных он приглушён. Одного кольца мало в тёмной теме */
.typecard.is-on{box-shadow:0 0 0 3px var(--ring)}
.typecard .typecard__ic{transition:background .14s,color .14s}
.typecard__ic{width:38px;height:38px;border-radius:var(--r-m);display:grid;place-items:center;flex:none}
.typecard__ic svg{width:19px;height:19px}
.typecard--act .typecard__ic{background:var(--act-soft);color:var(--act)}
.typecard--offer .typecard__ic{background:var(--offer-soft);color:var(--offer)}
.typecard--find .typecard__ic{background:var(--find-soft);color:var(--find)}
/* Третий признак выбора: заголовок невыбранного отступает в --ink-2. Один приём на все
   части контрола — заголовок, ведущий элемент, кольцо */
.typecard b{display:block;font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;margin-bottom:4px;color:var(--ink-2)}
.typecard.is-on b{color:var(--ink)}
.typecard span{font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3)}
/* Варианты одного выбора — одна группа: 8 внутри неё, а не зазор между группами. Раньше
   карточки типа лежали прямыми детьми .stack и брали его расстояние, хотя рисуют то же
   самое, что радио под ними */
.opts{display:flex;flex-direction:column;gap:8px}
/* Тот же узор, что у карточки типа, и собран так же: отступы 16, заголовок 16/20
   полужирный, подпись 13/16, между ними 4px. Раньше эти два контрола отличались всем —
   отступами, кеглями, зазором — хотя рисуют одно и то же */
.radio{
  display:flex;align-items:flex-start;gap:12px;padding:16px;border-radius:var(--r-m);
  border:1px solid var(--field-line);background:var(--surface);color:var(--ink-2);
  font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;width:100%;text-align:left;
  transition:border-color .12s,box-shadow .12s,color .12s;
}
.radio.is-on{color:var(--ink)}
.radio__dot{margin-top:2px}
.radio.is-on{box-shadow:0 0 0 3px var(--ring)}
.radio .radio__dot{opacity:.45;transition:opacity .14s}
.radio.is-on .radio__dot{opacity:1}
/* кружок виден у всех вариантов, а не только у выбранного: на --line-2 он терялся */
.radio__dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--field-line);flex:none;display:grid;place-items:center}
.radio.is-on .radio__dot{border-color:var(--ink)}
.radio.is-on .radio__dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.radio small{display:block;font-weight:400;color:var(--ink-3);font-size:var(--f-s20);line-height:var(--l-s20);margin-top:4px}
/* Пустая зона крупная и зовущая — это главное действие на экране находки. Как появилась
   первая фотография, сжимается в строку: миниатюры над ней уже занимают это место */
.uploader{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:140px;padding:16px;border-radius:var(--r-m);
  border:1px dashed var(--field-line);color:var(--ink-2);font-size:var(--f-s10);line-height:var(--l-s10);font-weight:500;width:100%;
}
/* Одно правило на размер значка: их было два — 26 и 17, — и побеждало второе, поэтому
   прежние попытки увеличить значок молча ничего не меняли. Приглушён только он: подпись
   несёт смысл, а значок его повторяет, и гасить его можно без потерь для читаемости */
.uploader svg{width:32px;height:32px;opacity:.5}
.uploader--compact{flex-direction:row;min-height:0;padding:12px}
.uploader--compact svg{width:16px;height:16px;opacity:1}
.uploader:hover{border-color:var(--ink-3);background:var(--surface-2)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:74px;height:74px;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{
  position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;
}
.thumb button svg{width:11px;height:11px}

/* ---------- lists / tabs ---------- */
/* четыре вкладки в панель шириной 380 не помещаются в строку: даём прокрутку вбок,
   а не перенос — перенос ломает высоту шапки и сдвигает список */
.tabs{display:flex;align-items:center;gap:4px;padding:0 16px;min-height:var(--head-h);overflow-x:auto;border-bottom:1px solid var(--line)}
/* Разделы отмечены подчёркиванием, а не плашкой: тонкая линия под рядом служит и границей
   шапки, и дорожкой для указателя, то есть один элемент делает две работы */
.tabs button{flex:none;white-space:nowrap;position:relative}
.tabs button{padding:0 2px;font-size:var(--f-m20);line-height:var(--l-m20);font-weight:500;color:var(--ink-3);align-self:stretch;display:flex;align-items:center}
.tabs{gap:12px}
/* ряд вкладок шире экрана на телефоне, а полосы прокрутки в приложении скрыты — без
   растворения у правого края четвёртая вкладка превращалась в тайник */
.tabswrap{position:relative;min-width:0}
/* Растворение у каждого края живёт по своему условию: слева — пока начало ряда уехало,
   справа — пока за краем остался хвост. Прежде оно включалось один раз по факту «ряд шире
   экрана» и висело даже когда листать уже некуда */
.tabswrap::before,.tabswrap::after{
  content:'';position:absolute;top:0;bottom:1px;width:28px;pointer-events:none;
  opacity:0;transition:opacity .15s;
}
.tabswrap::before{left:0;background:linear-gradient(to left,color-mix(in srgb,var(--surface) 0%,transparent),var(--surface))}
.tabswrap::after{right:0;background:linear-gradient(to right,color-mix(in srgb,var(--surface) 0%,transparent),var(--surface))}
.tabswrap.is-start::before{opacity:1}
.tabswrap.is-end::after{opacity:1}
.tabs button:hover{color:var(--ink)}
.tabs button.is-on{color:var(--ink);font-weight:600}
/* Число на вкладке появляется только когда есть непрочитанное — значит само его наличие
   и есть сигнал внимания, а цвет свободен и может нести тип. Кружок стал лишним */
.tabs .tag{margin-left:4px;position:relative;top:1px;border-color:transparent;color:var(--ink)}
.tabs .tag--act{background:var(--act-soft)}
.tabs .tag--offer{background:var(--offer-soft)}
.tabs .tag--find{background:var(--find-soft)}
/* «Все» не про один тип, и серое здесь значит именно это — а не отсутствие решения */
.tabs .tag{background:var(--surface-3)}
/* Полоса состава: доли в цвета типов. Рисовать нечем, кроме флекса, — и не нужно */
.statbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-3)}
/* ненулевая доля всегда видна: одна встреча против двадцати вещей иначе пропадает */
.statbar i{display:block;min-width:6px}
.chronicle{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;text-align:center}
.statlegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-2)}
.statlegend span{display:inline-flex;align-items:center;gap:6px}
.statlegend i{width:8px;height:8px;border-radius:50%;flex:none}
/* Плавающая кнопка внизу фильтра: нависает над списком станций, а прокрутив до конца,
   зависает над пустотой. Подложка растворяется кверху, чтобы список под ней не обрывался */
.stdone{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:16px;pointer-events:none;
  background:linear-gradient(to top,var(--surface) 58%,transparent)}
.stdone .btn{pointer-events:auto}
/* место под кнопкой, чтобы последняя станция не пряталась под ней */
.stdone__gap{height:84px}
/* снимок уходящего раздела: лежит слоем поверх, ничего не занимает в потоке
   и не ловит нажатия — он уже не интерактивен, он уезжает */
.panel__ghost{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;
  background:var(--surface);overflow:hidden;pointer-events:none}
/* обёртка вокруг переключаемого списка: в ней живёт снимок уходящей вкладки */
.swrap{position:relative;overflow:hidden}
.swghost{position:absolute;left:0;right:0;top:0;background:var(--surface);pointer-events:none}
/* подчёркивание в цвет типа — счётчик рядом красится им же, линия просто догоняет.
   У «Все» типа нет, там остаётся тёмная */
.tabs button.is-on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:2px 2px 0 0;background:var(--tab-line,var(--ink))}
.tabs button.tab--act{--tab-line:var(--act)}
.tabs button.tab--offer{--tab-line:var(--offer)}
.tabs button.tab--find{--tab-line:var(--find)}
.listrow{position:relative;display:flex;gap:12px;padding:16px;width:100%;align-items:center;text-align:left;transition:background .14s}
.listrow__cover{width:50px;height:50px;border-radius:var(--r-s);flex:none;object-fit:cover;display:grid;place-items:center}
/* Личную переписку от общего чата по обложке не отличить: событие одно, фотография одна
   и та же. Поэтому поверх обложки встаёт лицо собеседника — у общего чата его нет, и это
   отсутствие и есть признак. Кольцо цветом строки, иначе тёмное лицо слипается с фото */
.listrow__pic{position:relative;flex:none}
/* лицо в верхнем углу — вровень с именем написавшего: у нижнего края оно стояло
   у превью сообщения, к которому отношения не имеет */
.listrow__face{position:absolute;right:-3px;top:-3px;box-shadow:0 0 0 2px var(--surface)}
/* обложка во всю высоту трёх строк: 20 имя + 2 + 18 событие + 4 + 16 превью = 60.
   Высоту ряда задаёт текст, поэтому крупнее обложка ничего не двигает — только текст
   отходит вправо. Модификатором, а не правилом на класс: строки профиля и канала
   короче на строку, и там 60 разъехалось бы */
.listrow__cover--lg,.listrow__cover--lg.listrow__cover{width:60px;height:60px}
.listrow:hover .listrow__face,.listrow.is-sel .listrow__face{box-shadow:0 0 0 2px var(--surface-2)}
.listrow__cover--act{background:var(--act-soft);color:var(--act)}
.listrow__cover--offer{background:var(--offer-soft);color:var(--offer)}
.listrow__cover--find{background:var(--find-soft);color:var(--find)}
.listrow__cover--muted{background:var(--surface-3);color:var(--ink-3)}
.listrow__cover svg{width:19px;height:19px}
.listrow__cover--s{width:40px;height:40px}
.listrow__cover--s svg{width:16px;height:16px}
.listrow__pin{font-size:var(--f-s10);line-height:var(--l-s10);font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow__msg{font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.listrow:hover{background:var(--surface-2)}
/* Самая тесная ступень — 2: имя и название события отвечают на один вопрос «кто и по какому
   поводу» и должны читаться парой. Тем, кому нужно 4 и 6, добавка выдаётся явно */
.listrow__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.listrow__t{font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600}
.listrow--chat .listrow__t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Строка факта переносится, а не обрезается: многоточие съедало именно повтор — самое
   редкое в ней, — а дату оставляло. Потолок в две строки, высота ряда растёт только
   у повторяющихся событий */
.listrow__s{font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-3);overflow:hidden;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.listrow__r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
/* время в строке чата держится верхнего края: в профиле тот же блок носит шеврон,
   и его поднимать наверх не надо — поэтому модификатор, а не общее правило */
.listrow__r--top{align-self:flex-start}
/* имя, время и точка в одной строке; название пина и текст ниже идут во всю ширину */
.listrow__top{display:flex;align-items:baseline;gap:8px;min-width:0}
.listrow__top .listrow__t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow__top .listrow__time{flex:none}
.listrow__top .unread{flex:none;align-self:center}
.listrow__r svg{width:16px;height:16px;color:var(--ink-3)}
.listrow__time{font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3);white-space:nowrap}
.unread{width:8px;height:8px;border-radius:50%;background:var(--brand)}
/* Системный канал даёт точку, а не число: цифра на разделе должна значить ровно одно —
   «вам написал живой человек», иначе ей перестают верить, как «99+» в маркетплейсах */
.navbtn__badge--dot{min-width:9px;width:9px;height:9px;padding:0;border-radius:50%;font-size:0}
.tabs button .tabn{margin-left:6px;font-variant-numeric:tabular-nums;opacity:.75}
/* системное сообщение — не пузырь разговора, а карточка с одним действием */
/* Уведомление собрано как карточка пина в списке: чип типа, жирное название, пояснение.
   Раньше всё это лежало одним абзацем через двоеточие и читалось тяжело */
/* Четыре яруса в одной карточке — чип, название, пояснение, время — при отступе в 8
   слипались в один ком. Между заголовком и текстом по правилу 12, остальное 8 */
.sysmsg{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
.sysmsg__t{font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;margin-bottom:4px}
/* чип типа и шеврон — одной строкой: слева что это, справа что карточка ведёт дальше.
   В подвале шеврон стоял у времени, к которому отношения не имеет */
.sysmsg__head{display:flex;align-items:center;gap:8px}
.sysmsg__x{font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-3)}
/* уведомление, у которого есть объект, ведёт в него целиком: название события в заголовке
   и есть вход, а кнопка «Открыть» говорила бы то же самое второй раз */
.sysmsg--go{cursor:pointer}
.sysmsg--go:hover{border-color:var(--line-2)}
.sysmsg__go{margin-left:auto;width:16px;height:16px;color:var(--ink-3);flex:none;align-self:flex-start}
.sysmsg__d{font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3)}
.sysmsg__foot{display:flex;align-items:center;gap:8px}
.sysmsg__foot .chip{margin-left:auto}
.sysmsg .btn{width:auto;align-self:flex-start}
.sysmsg .chip{align-self:flex-start}
/* Непрочитанное отмечено заливкой: прежде залитыми были все карточки, и заливка ничего
   не сообщала — приходилось метить новое тёмной обводкой. Теперь прочитанное белое с рамкой,
   и залитая среди них ровно настолько заметна, насколько нужно. Рамка остаётся у всех,
   у новых она прозрачная: иначе карточки прыгали бы на два пикселя, когда канал прочитан */
.sysmsg.is-new{background:var(--surface-2);border-color:transparent}
/* Разделитель дня между сообщениями и метка «Новые» — один элемент: обе отвечают на вопрос
   «где я остановился». Раз день назван здесь, в самом сообщении остаётся только время */
.daysep{text-align:center;font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3);padding:4px 0}
.districtrow{position:relative;display:flex;align-items:center;gap:8px;padding:16px;width:100%;transition:background .14s}
/* у первой строки списка есть и верхняя линия: без неё заливка под курсором открыта сверху.
   Псевдоэлементом самой строки, а не отдельным разделителем, — иначе линия не узнает
   про наведение и останется узкой, когда заливка уже разошлась до краёв */
.districtrow:first-of-type::before{
  content:'';position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line);
  transition:left .14s,right .14s;
}
.districtrow:first-of-type:hover::before,.districtrow:first-of-type.is-on::before{left:0;right:0}
.districtrow:hover{background:var(--surface-2)}
.districtrow.is-on{background:var(--surface-2)}
.metro{width:26px;height:26px;flex:none;display:block}
.districtrow b{font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;display:block}
.districtrow span{font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3)}
/* у станции теперь две подписи — линия и итог месяца; без блочности они шли одной строкой */
.districtrow>span>span{display:block;margin-top:4px}
.districtrow .cnt{margin-left:auto;font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* поиск слева, выбор ветки справа — одна строка между «Весь город» и списком станций */
/* линии под строкой поиска нет: ниже в том же блоке лежат выбранные станции и «весь город»,
   и она резала один блок пополам */
.stools{display:flex;align-items:center;gap:8px;padding:12px 16px}
.stools__line{margin-left:auto;min-width:0}
.stools__line .select{padding:8px 32px 8px 12px;font-size:var(--f-s10);line-height:var(--l-s10)}
.stools .searchfield .input{padding:8px 36px 8px 38px}
.stools .searchfield__clear{width:24px;height:24px;right:6px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;padding:16px}
/* строки текста держатся теснее, чем текст держится за имя и время: раньше было наоборот,
   и абзац не читался как одно целое */
.msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:var(--f-m20);line-height:var(--l-m20);white-space:pre-wrap;word-break:break-word}
/* светлее пузырьков, а не темнее: фон переписки белый, и всё, что светлее surface-2, —
   это белое. Отделяем рамкой, иначе плашка растворится */
.chatnote{align-self:center;max-width:80%;text-align:center;background:var(--surface);
  border:1px solid var(--line);color:var(--ink-3);
  font-size:var(--f-s20);line-height:var(--l-s20);padding:4px 12px;border-radius:999px;margin:2px 0}
.msg--in{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.msg--out{align-self:flex-end;background:var(--ink);color:var(--ground);border-bottom-right-radius:5px}
/* время под сообщением: .6 давало на тёмном пузыре около 3:1, что для текста мало */
.msg__t{display:block;font-size:var(--f-xs10);line-height:var(--l-xs10);opacity:.78;margin-top:6px}
/* в общем чате имя обязательно: без него непонятно, кто из восьми человек это написал */
.msg__a{display:block;font-size:var(--f-s20);line-height:var(--l-s20);font-weight:600;color:var(--ink-3);margin-bottom:4px;text-align:left}
.msg__a:hover{color:var(--brand-icon);text-decoration:underline}
/* шапка переписки — тот же язык, что строка в списке чатов: фото пина, имя соседа, название пина.
   Кликабельна целиком и ведёт на карточку пина, поэтому отдельная строка-контекст под ней не нужна */
/* единая шапка всех экранов: одна высота, содержимое слева, выход стрелкой назад */
.chathead{display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;min-height:var(--head-h)}
.chathead__main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:4px 8px;border-radius:var(--r-m)}
.chathead__main:hover{background:var(--surface-2)}
/* в шапке кегль крупнее, и той же паре нужно меньше воздуха, чем в строке списка */
.chathead__txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.chathead__n{font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chathead__p{font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Название в шапке проявляется только когда карточка прокручена и собственный заголовок
   уехал вверх. В покое там пусто: подпись «Услуга или вещь · Сокольники» дословно повторяла
   два чипа, стоящих строкой ниже */
.chathead__n--fade{opacity:0;transition:opacity .18s}
.is-scrolled .chathead__n--fade{opacity:1}
.chathead__act{margin-left:auto}
/* Шапка раздела на телефоне устроена тремя частями: слева кнопка, по центру название,
   справа действие. Боковые слоты равной доли, поэтому название стоит по оптическому
   центру и не съезжает от того, есть справа иконка или нет */
.chathead--center .chathead__side{flex:1 1 0;min-width:36px;display:flex;align-items:center;gap:4px}
.chathead--center .chathead__side--r{justify-content:flex-end}
.chathead--center .chathead__txt{flex:0 1 auto;align-items:center;text-align:center;min-width:0}
.chathead--center .chathead__act{margin-left:0}
/* меню «ещё»: поделиться и пожаловаться. Всплывает под кнопкой, закрывается тапом мимо */
/* Меню не забирает экран, поэтому фон под ним не гасится: плашку выделяет только тень.
   Вес селектора из двух классов обязателен — общее правило .scrim лежит ниже по файлу
   и с одним классом перебивало бы прозрачность обратно в затемнение */
.scrim.scrim--clear{background:transparent}
.menu{position:fixed;min-width:212px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-2);display:flex;flex-direction:column}
.menu__i{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-s);width:100%;font-size:var(--f-m20);line-height:var(--l-m20);color:var(--ink)}
.menu__i:hover{background:var(--surface-2)}
.menu__i svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer .textarea{min-height:44px;max-height:120px;padding:12px}
.composer .iconbtn{width:44px;height:44px;background:var(--brand);color:#fff;border-radius:var(--r-m)}
.composer .iconbtn:hover{opacity:.9;background:var(--brand);color:#fff}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 16px;background:var(--surface-2);border-radius:14px;border-bottom-left-radius:5px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:.9}}
.demo-note{
  display:flex;gap:8px;align-items:flex-start;margin:0 16px;padding:8px 12px;border-radius:var(--r-s);
  background:var(--surface-2);color:var(--ink-3);font-size:var(--f-s20);line-height:var(--l-s20);
}
.demo-note svg{width:14px;height:14px;flex:none;margin-top:1px}
/* Просьба подтвердить — не заметка, а действие, поэтому у неё своя вёрстка: заголовок,
   отступ, текст, кнопки в один рост. Подложка нейтральная — на красной и текст, и кнопка
