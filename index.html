   теряли контраст, а тревожный цвет здесь ничего не сообщал */
.ask{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-m);background:var(--surface-2)}
.ask b{font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;display:block;margin-bottom:4px}
.ask p{margin:0;font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-2)}
.ask .row>.btn{flex:1}

/* ---------- modal / onboarding ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;padding:20px;z-index:40;overflow-y:auto}
/* затемнение под мобильной шторкой: показывает, что фон неактивен и что тап по нему закрывает */
.sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:19;display:none}
/* под домашней шторкой затемняем только карту: дом — состояние просмотра, и уходить
   из него в чаты одним касанием человек вправе, поэтому таббар остаётся живым */
.sheet-scrim--home{bottom:66px}
/* плашка с расстоянием на шаге выбора места — тёмная, как всплывающие сообщения */
/* Плашка занимает тот же слот, что кнопка охвата, и уходит тем же движением. Видна она
   только пока шторка внизу и вы целитесь: как только шторка поднялась, станция
   и расстояние уже стоят в поле внутри неё, и плашка становится дублем */
.pickinfo.is-away{opacity:0;transform:translateX(-50%) translateY(-160%) scale(.92)}
.pickinfo{
  position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:7;
  transition:transform .22s ease,opacity .22s ease;
  background:var(--ink);color:var(--ground);padding:8px 16px;border-radius:var(--r-m);
  font-size:var(--f-s10);line-height:var(--l-s10);font-weight:500;white-space:nowrap;box-shadow:var(--shadow-2);pointer-events:none;
}
.modal{
  margin:auto;width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow-3);overflow:hidden;
}
.modal__body{padding:24px}
.modal h1{font-family:'Unbounded',system-ui,sans-serif;font-size:var(--f-h20);line-height:var(--l-h20);font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.modal h2{font-size:var(--f-h30);line-height:var(--l-h30);font-weight:600;margin:0 0 8px}
.modal p{margin:0 0 20px;color:var(--ink-2);font-size:var(--f-m10);line-height:var(--l-m10)}
.modal__foot{padding:0 24px 24px;display:flex;flex-direction:column;gap:8px}
.brandbig{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brandbig .brand__mark{width:38px;height:38px;border-radius:10px}
.brandbig .brand__mark svg{width:21px;height:21px}
.codeline{display:flex;gap:8px}
.codeline .input{text-align:center;font-family:'JetBrains Mono',monospace;font-size:var(--f-h30);line-height:var(--l-h30);letter-spacing:.3em;padding-left:16px}
/* Тот же слот и то же движение, что у плашки расстояния и кнопки охвата. Снизу тост
   наезжал на плавающую кнопку в фильтрах, сверху ему никто не мешает */
.toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-160%) scale(.92);
  opacity:0;pointer-events:none;
  background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:var(--r-m);
  font-size:var(--f-m20);line-height:var(--l-m20);font-weight:500;box-shadow:var(--shadow-2);z-index:60;
  transition:opacity .22s ease,transform .22s ease;
  max-width:min(440px,88vw);
  display:flex;align-items:center;gap:12px;
}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.toast__a{color:var(--brand);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.toast__a svg{width:15px;height:15px}
/* тост без сообщения: остаётся одно действие, и поля ему нужны кнопочные, а не абзацные */
.toast--bare{padding:8px 14px}

/* ---------- responsive ---------- */
/* меняем саму переменную, а не ширину панели: от неё же отсчитывается кнопка сворачивания */
@media (max-width:1080px){
  :root{--panel-w:352px}
}
@media (max-width:820px){
  .app{flex-direction:column-reverse}
  /* таббар лежит поверх карты отдельным слоем, а не занимает место в колонке: пока он был
     в потоке, карта до него не доходила, и когда он уезжал на время жеста, снизу
     оставалась белая полоса. Он непрозрачный, поэтому в обычном виде ничего не изменилось */
  .rail{
    position:absolute;left:0;right:0;bottom:0;width:auto;height:66px;
    flex:none;flex-direction:row;justify-content:space-around;align-items:center;
    border-right:none;border-top:1px solid var(--line);padding:8px;
  }
  .rail .navbtn{width:auto;flex:1;padding:4px}
  .rail .brand,.rail__spacer{display:none}
  /* .work снимаем с position:relative, чтобы абсолютная .panel считалась от .app: тогда шторка
     доезжает до самого низа экрана и ложится поверх таббара, как в мобильных картах */
  .work{flex:1;min-height:0;position:static}
  /* шторка: высота по содержимому с потолком в 72% экрана — короткие шторки вроде категорий
     больше не растягиваются на пустоту. Теней у шторок нет вообще (правило проекта) */
  .panel{
    position:absolute;left:0;right:0;width:auto;bottom:0;top:auto;flex-basis:auto;height:auto;max-height:calc(100dvh - 76px);z-index:20;order:0;
    border-right:none;border-top:1px solid var(--line);border-radius:var(--r-l) var(--r-l) 0 0;
  }
  /* «разделы» (чаты, профиль, поиск, переписка) — во весь экран над таббаром: он их навигация,
     поэтому таббар остаётся виден и затемнения под ними нет */
  .panel.is-section{top:0;bottom:66px;height:auto;max-height:none;border-radius:0;border-top:none}
  /* Переписка не раздел, а экран внутри него: выход даёт стрелка в шапке, а не таббар.
     И нижний край там принадлежит содержимому — внизу поле ввода, а с открытой клавиатурой
     полос становится три */
  .panel.is-chat{bottom:0}
  .panel.is-chat .panel__foot,.panel.is-chat .composer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .app.is-chat .rail{transform:translateY(100%);pointer-events:none}
  .rail{transition:transform .22s ease}
  .sheet-scrim.is-on{display:block}
  /* после подтверждения места высота жёсткая, а не потолок: иначе второй и третий шаг
     были бы разной высоты и прыгали друг относительно друга */
  .panel.is-tall{height:calc(100dvh - 100px);max-height:none}
  .panel.is-tall .panel__body{flex:1 1 auto}
  /* палец на карте при выборе места — шторка уезжает вниз почти целиком и открывает карту */
  .panel{transition:transform .22s ease}
  /* на мобильном сдвиг вниз, а не вбок: правило сворачивания сюда не достаёт */
  .work.is-collapsed .panel{transform:none}
  .panel.is-peek{transform:translateY(calc(100% - 12px))}

  /* Домашняя шторка: развёрнутая — обычный полноэкранный раздел над таббаром; свёрнутая —
     уезжает вниз так, что над таббаром остаётся только строка поиска. Тянется пальцем,
     прилипает к двум положениям. Карта под ней всё это время живая */
  /* Двигается только верхний край: нижний прибит к верху таббара, поэтому шторка физически
     не может его накрыть. Свёрнутая показывает ровно строку поиска, остальное обрезается.
     Развёрнутая встаёт по тому же правилу, что шторка создания — сто пикселей карты сверху */
  .panel.is-home,.panel.is-screen{
    top:100px;bottom:66px;height:auto;max-height:none;
    border-radius:var(--r-l) var(--r-l) 0 0;border-top:1px solid var(--line);
    transition:top .24s ease;
  }
  /* У шторки два края, и сводить их к общему знаменателю надо порознь. Верхний — про то,
     сколько видно карты, он общий. Нижний — про то, работает ли под шторкой навигация:
     у домашней таббар живой, у фильтра нет, и шторка накрывает его собой. Пока она
     кончалась над ним, таббар оставался виден, но лежал под затемнением — и нажатие
     попадало в затемнение, а не в него */
  .panel.is-screen{bottom:0}
  /* при жёсткой высоте тело обязано растянуться, иначе короткий список схлопнется
     и под ним останется пустая плита: общее правило ниже держит обратное для шторок,
     высота которых считается по содержимому */
  .panel.is-home .panel__body,.panel.is-screen .panel__body{flex:1 1 auto;min-height:0}
  /* жест перетаскивания шторки ловится с этой зоны, поэтому полю поиска внутри неё
     возвращаем собственные касания — иначе тап уходит в жест */
  .panel.is-home .panel__top{touch-action:none}
  .panel.is-home .panel__top .searchfield{touch-action:auto}
  .panel.is-home.is-shut{top:calc(100dvh - 66px - var(--home-peek))}
  /* в свёрнутом виде своя линия под строкой поиска не нужна: она встала бы в пиксель
     от границы таббара и читалась как вторая полоса */
  .panel.is-home.is-shut .panel__top{border-bottom:none}
  /* Карточка пина живёт в трёх положениях, как в картах: раскрыта, свёрнута до корешка,
     закрыта. В свёрнутом стоит над таббаром — это состояние просмотра карты, и уходить
     из него одним касанием человек вправе, ровно как из домашней шторки */
  /* У карточки есть пол: без него короткий пин оставлял полэкрана пустой карты. Лишняя
     высота уходит в тело, содержимое остаётся вверху, кнопки прибиты к низу — и между
     последним блоком и кнопками сам собой появляется воздух */
  /* Третье положение: почти во весь экран, но не во весь. Прежде карточка вставала в самый
     верх, выпрямляла углы и меняла шапку на сплошную полосу — и уменьшить её было нечем:
     жест ловится с ручки, а ручку в этом положении прятали, потому что ей «не на чем лежать».
     Полоса в 24 пикселя возвращает и ручку, и затемнение под ней, а обложка остаётся
     обложкой: кнопки лежат поверх фотографии на своих плашках, как и в других положениях */
  .panel.is-pin.is-full{top:24px;bottom:66px;height:auto;max-height:none;min-height:0}
  .panel.is-pin.is-full .sheet-grip{display:flex}
  /* Пол карточки: сверху остаётся полоска карты с булавкой и её окружением — карта здесь
     часть ответа, а не фон, — но не половина экрана пустоты, как было при 60dvh */
  .panel.is-pin:not(.is-shut):not(.is-full){min-height:calc(100dvh - 160px)}
  /* Обложка идёт от самого верха и повторяет скругление шторки. Обрезкой по панели этого
     не сделать: ручка лежит выше её края, на затемнении, и обрезка съела бы её */
  .panel.is-pin .cover{border-radius:var(--r-l) var(--r-l) 0 0}
  .panel.is-pin:not(.is-shut) .panel__body{flex:1 1 auto}
  /* Подвал с кнопками не отрезан линией, а растворяется: тот же приём, что у плавающей
     кнопки в фильтрах. Тень не нужна — контраста заливки хватает */
  .panel:not(.is-section) .panel__foot{
    border-top:none;
    background:linear-gradient(to top,var(--surface) 64%,color-mix(in srgb,var(--surface) 0%,transparent));
    padding-top:12px;
    /* внизу поле блока по лестнице плюс безопасная зона телефона: на растворяющемся
       подвале двенадцати пикселей не хватало, кнопки стояли у самого края */
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  /* Ручка вынесена из потока и больше не держит верхний отступ собой — возвращаем его
     панели там, где ручка есть */
  /* У карточки события верхнего отступа нет: первым элементом идёт обложка, и восемь
     пикселей подложки ложились над ней белой полосой — казалось, что фотография положена
     поверх шторки. У остальных сверху поле поиска или шапка, им отступ нужен */
  .panel.is-swipe{padding-top:8px}
  .panel.is-pin{transition:top .24s ease,transform .22s ease}
  .panel.is-pin.is-shut{
    top:calc(100dvh - 66px - var(--pin-peek));bottom:66px;height:auto;max-height:none;
  }
  .panel.is-pin.is-shut .panel__body,.panel.is-pin.is-shut .panel__foot{display:none}
  .panel.is-pin.is-shut .panelhead--over{display:none}
  .pinpeek{display:none}
  .panel.is-pin.is-shut .pinpeek{display:block}
  /* поля равные: полоса корешка задана числом (--pin-peek), содержимое — названием 20
     и станцией 16, и при полях 0 сверху и 12 снизу двадцать восемь пикселей падали вниз
     пустотой под станцией, а название прижималось к верху */
  .pinpeek__b{display:flex;align-items:center;gap:12px;padding:16px;width:100%;min-width:0}
  .pinpeek__b>svg{width:16px;height:16px;color:var(--ink-3);flex:none}
  .pinpeek__t{flex:1;min-width:0}
  .pinpeek__n{font-size:var(--f-h50);line-height:var(--l-h50);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pinpeek__s{display:flex;align-items:center;gap:4px;font-size:var(--f-s20);line-height:var(--l-s20);color:var(--ink-3);white-space:nowrap}
  /* обложка стала первым, что видно в шторке, поэтому её верхние углы скругляем сами:
     раньше их прикрывала непрозрачная шапка */
  .panel:not(.is-section) .panel__body>.cover:first-child{border-radius:var(--r-l) var(--r-l) 0 0}
  /* пока палец на карте — район, категории и таббар уезжают вместе с зумом: экран отдан карте */
  .app.is-peek .rail{opacity:0;pointer-events:none}
  .stage.is-peek .toolbar{opacity:0}
  .stage.is-peek .toolbar>*{pointer-events:none}
  .rail,.toolbar{transition:opacity .18s}
  .stage.is-peek .zoomctl{opacity:0;pointer-events:none}
  /* у шторки по содержимому телу нельзя оставлять flex-basis:0 — оно схлопнулось бы в ноль.
     У шторки с жёсткой высотой (.is-tall) наоборот: тело обязано растянуться на остаток,
     иначе под коротким шагом осталась бы пустая полоса */
  .panel:not(.is-section):not(.is-tall) .panel__body{flex:0 1 auto}
  .toolbar{left:16px;right:16px;top:16px;gap:8px}
  /* уезжает вверх с уменьшением, а не выключается: display не анимируется, поэтому
     кнопка остаётся в потоке и просто перестаёт ловить нажатия. Длительность та же,
     что у самой шторки, — они двигаются одним движением */
  .scopetop{display:flex;flex:1;height:42px;padding:0 12px;transform-origin:50% 0;transition:transform .22s ease,opacity .22s ease}
  .app.is-homeopen .scopetop{transform:translateY(-160%) scale(.92);opacity:0;pointer-events:none}
  /* центр не по экрану, а по свободной полосе между низом «Категорий» (10+42) и верхом
     свёрнутой шторки (76 над таббаром в 66): (52 + 100dvh - 142) / 2 */
  .zoomctl{top:calc(50dvh - 45px)}
  .scalebar{display:none}
}
</style>

<script>
(function(){
'use strict';

/* ============ 0. утилиты ============ */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function H(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function now(){return Date.now()}
var MIN=60000, HOUR=3600000, DAY=86400000;
var MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var METERS_PER_UNIT=1.6;

function plural(n,a,b,c){
  n=Math.abs(n)%100; var n1=n%10;
  if(n>10&&n<20)return c; if(n1>1&&n1<5)return b; if(n1===1)return a; return c;
}
function pad2(n){return n<10?'0'+n:''+n}
function hhmm(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes())}
function sameDay(a,b){a=new Date(a);b=new Date(b);
  return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()}
function dateShort(ts){var d=new Date(ts);return d.getDate()+' '+MONTHS[d.getMonth()]}
/* В карточке пина время стояло дважды: сверху «завтра в 19:00», снизу «8 сен, 19:00».
   Теперь сверху точная дата, снизу словами — «завтра», «каждую среду». Если сказать
   словами нечего, второй строки нет вовсе */
function dateFull(ts){var d=new Date(ts);return d.getDate()+' '+MONTHS_GEN[d.getMonth()]}
function whenAbs(ts){return dateFull(ts)+', '+hhmm(ts)}
/* Событие, которое началось и ещё не закрылось, идёт сейчас — «уже прошло» про него
   неправда: люди на нём стоят прямо в эту минуту. Прошедшим оно становится в летописи */
function isNow(p){
  if(!p||p.type!=='activity'||p.status!=='active')return false;
  var t=now();
  return p.starts_at<=t&&(p.expires_at||p.starts_at+3*HOUR)>t;
}
function whenRel(ts){
  var t=now();
  if(ts<t)return 'уже прошло';
  if(sameDay(ts,t))return 'сегодня';
  if(sameDay(ts,t+DAY))return 'завтра';
  return '';
}
var WDAY=['в воскресенье','в понедельник','во вторник','в среду','в четверг','в пятницу','в субботу'];
/* Слева ближайший раз, справа как часто, и каждый факт назван ровно один раз. У еженедельной
   встречи день недели уходил в повтор («по понедельникам»), а слева оставалось голое «20:30» —
   и читалось как «сегодня», хотя до ближайшего раза могло быть шесть дней. День недели
   отвечает на «когда», а не на «как часто», поэтому он вернулся в левую часть, а справа
   встал повтор словом. У разовой в пределах недели вместо числа день недели — «16 сентября»
   для послезавтра никто не считает */
function whenText(ts,repeat){
  var t=now();
  if(ts<t)return 'уже прошло';
  if(sameDay(ts,t))return 'сегодня, '+hhmm(ts);
  if(sameDay(ts,t+DAY))return 'завтра, '+hhmm(ts);
  if(ts-t<7*DAY)return WDAY[new Date(ts).getDay()]+', '+hhmm(ts);
  return dateShort(ts)+', '+hhmm(ts);
}
function agoText(ts){
  var ms=now()-ts;
  if(ms<MIN)return 'только что';
  if(ms<HOUR){var m=Math.floor(ms/MIN);return m+' '+plural(m,'минуту','минуты','минут')+' назад'}
  if(ms<DAY){var h=Math.floor(ms/HOUR);return h+' '+plural(h,'час','часа','часов')+' назад'}
  var d=Math.floor(ms/DAY);
  if(d===1)return 'вчера';
  if(d<7)return d+' '+plural(d,'день','дня','дней')+' назад';
  /* Дальше семи дней раньше шла дата — и она вызывала вопрос «восемнадцатое это чего?»,
     которого у относительного времени не бывает. К вещи и услуге вопрос всегда один:
     это ещё живо? Отвечает на него свежесть, а не календарь */
  if(d<31){var w=Math.floor(d/7);return w+' '+plural(w,'неделю','недели','недель')+' назад'}

var db=null;

var storageOK=true, storageWarned=false;
function noStorage(){
  storageOK=false;
  if(storageWarned)return;
  storageWarned=true;
  setTimeout(function(){toast('Браузер не разрешает сохранение — всё, что вы сделаете, будет жить до перезагрузки страницы')},900);
}
function save(){
  if(!storageOK)return;
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){
    if(e&&(e.name==='QuotaExceededError'||e.code===22))
      toast('Не удалось сохранить: в браузере кончилось место. Удалите фотографии из своих событий');
    else noStorage();
  }
}
function loadDB(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return null;
    var p=JSON.parse(raw);
    if(p&&p.v===1&&p.users&&p.pins)return p;
  }catch(e){noStorage()}
  return null;
}
