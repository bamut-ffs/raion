/* ============ 9.8 летопись района ============ */
/* Публичный архив прошедшего был открытым вопросом ещё в первом ТЗ. Он же оказался самым
   дешёвым ответом на пустую карту: в районе с двумя пинами пустое состояние перестаёт
   быть пустым, а при выборе станции появляется основание для выбора */
/* Сводка считается по текущему охвату: выбрана станция — по её пинам, выбран город — по всем.
   В строке станции она стояла третьим этажом мелкого текста и пересказывала содержимое
   района раньше, чем в него зашли */
function chronicleOfScope(days){
  var from=now()-(days||30)*DAY, st={met:0,given:0,returned:0};
  db.pins.forEach(function(p){
    if(!inScope(p))return;
    if(p.close_reason!=='done'||!p.closed_at||p.closed_at<from)return;
    if(isAct(p))st.met++;
    else if(p.type==='need_offer')st.given++;
    else if(p.type==='lost_found')st.returned++;
  });
  return st;
}
function chronicleText(){
  var st=chronicleOfScope(30), out=[];
  if(st.met)out.push(st.met+' '+plural(st.met,'встреча','встречи','встреч'));
  if(st.given)out.push(st.given+' '+plural(st.given,'вещь','вещи','вещей'));
  if(st.returned)out.push(st.returned+' '+plural(st.returned,'находка','находки','находок'));
  return out.length?('за месяц закрыто: '+out.join(' · ')):'';
}

/* ============ 9.9 причины закрытия ============ */
/* Исходов три, а не два. «Нашлась сама» — не провал сервиса и не его заслуга, а отмена,
   и по жизни это самый частый случай: ключи находятся в другой куртке, кот возвращается.
   В общей куче с неудачами он вдвое ухудшил бы статистику, ничего о себе не сказав */
/* Подлежащее — событие или безличное, но не человек: «Отменил» и «Передумал» предлагали
   женщине мужской род. Вещью подлежащее тоже не сделать — название склоняется как угодно,
   и «Нашла нового владельца» хромало на «горшках для цветов» */
var CLOSE_REASONS={
  activity:[['done','Состоялась'],['noone','Никто не пришёл'],['cancel','Отменена']],
  need_offer:[['done','Отдано'],['noone','Никто не откликнулся'],['cancel','Оставляю себе']],
  found:[['done','Вернули хозяину'],['noone','Хозяина не нашли'],['cancel','Отдано иначе']],
  lost:[['done','Нашлась через сервис'],['noone','Не нашлась'],['cancel','Нашлась сама']]
};
function closeReasons(p){
  if(!p)return CLOSE_REASONS.activity;
  if(p.type==='lost_found')return CLOSE_REASONS[p.subtype==='lost'?'lost':'found'];
  return CLOSE_REASONS[p.type]||CLOSE_REASONS.activity;
}
function reasonLabel(p){
  if(!p||!p.close_reason)return '';
  if(p.close_reason==='expired')return 'истёк срок';
  var rs=closeReasons(p);
  for(var i=0;i<rs.length;i++)if(rs[i][0]===p.close_reason)return rs[i][1].toLowerCase();
  return '';
}
/* Экран выбора показывается сразу при закрытии, а не отдельным шагом «хотите указать
   причину?»: отдельный шаг никто не проходит. Внизу мелким — «Просто закрыть»:
   обязательный опрос даёт случайно ткнутый первый пункт, то есть ложные данные
   вместо отсутствующих */
/* Выбор причины больше не совершает поступок: раньше тап по радио закрывал событие на месте,
   то есть человек, выбиравший вариант, уже всё сделал. Теперь радио выбирают, закрывает
   кнопка, а над ней сказано последствие — его в окне не было вовсе. «Просто закрыть» ушло:
   не выбрать причину и нажать «Завершить» — это оно и есть */
var closeReason=null;
function closeDialog(p){
  if(!p)return;
  pendingOk=null;
  closeReason=null;
  var rs=closeReasons(p);
  setOverlay('<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal__body"><h2>Чем закончилось?</h2>'+
    '<p>Ответ никому не показывается лично: из него складывается статистика района и архив.</p>'+
    '<div class="opts">'+rs.map(function(r){
      return '<button class="radio" data-act="pick-reason" data-val="'+r[0]+'">'+
        '<span class="radio__dot"></span><span>'+H(r[1])+'</span></button>';
    }).join('')+'</div>'+
    '<p>Событие уйдёт с карты, новых откликов не будет. Начатые переписки останутся, '+
      'а вернуть событие можно из архива.</p></div>'+
    '<div class="modal__foot"><div class="row">'+
      '<button class="btn btn--line" data-act="modal-close">Отмена</button>'+
      '<button class="btn btn--primary" data-act="close-reason" data-id="'+p.id+'">Завершить</button>'+
    '</div></div>'+
  '</div></div>');
}
/* Закрытие уведомляет откликнувшихся: у пропажи есть люди, которые написали «видел вашу
   собаку» — если автор закрыл пин, а они не узнали, они продолжают искать */
function notifyResponders(p){
  if(!p)return;
  var ok=(p.close_reason==='done');
  var ttl=ok?'Всё получилось':'Событие закрыто';
  var txt=ok?'спасибо, что откликнулись'
            :('автор закрыл его'+(p.close_reason==='cancel'?' — вопрос решился без сервиса':''));
  responsesOf(p.id).forEach(function(r){
    if(r.user_id===db.currentUserId)sysNotify(ttl,txt,'open-pin',p.id,'Открыть');
  });
}

/* ============ 10. диалоги ============ */
var pendingOk=null;
/* Меню «ещё» в шапке карточки. Всплывает под кнопкой, закрывается тапом мимо — затемнения
   под ним нет, потому что оно не забирает экран целиком, как модальное окно.
   Сюда же уехала жалоба: в теле карточки она стояла отдельной кнопкой между автором и
   действием, хотя это редкое действие, а не часть сценария */
function menuDialog(anchor,items){
  pendingOk=null;
  var r=anchor?anchor.getBoundingClientRect():null;
  var pos=r
    ? 'top:'+Math.round(r.bottom+6)+'px;right:'+Math.round(Math.max(8,window.innerWidth-r.right))+'px'
    : 'top:64px;right:12px';
  setOverlay('<div class="scrim scrim--clear" data-act="scrim"><div class="menu" style="'+pos+'" role="menu">'+
    items.map(function(it){
      return '<button class="menu__i" data-act="'+it.act+'" data-id="'+H(it.id||'')+'" role="menuitem">'+icon(it.icon)+H(it.label)+'</button>';
    }).join('')+
  '</div></div>');
}
/* Все окна пишут в оверлей, и обработку висячих предлогов надо ставить в одно место:
   раньше каждое писало разметку само, и правило до них не доходило вовсе */
function setOverlay(html){
  var o=$('#overlay'); o.innerHTML=html; fixHang(o);
}
function closeModal(){$('#overlay').innerHTML='';pendingOk=null}
function confirmDialog(title,text,ok,danger,cb){
  pendingOk=cb;
  setOverlay('<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal__body"><h2>'+H(title)+'</h2><p>'+H(text)+'</p></div>'+
    '<div class="modal__foot"><div class="row">'+
      '<button class="btn btn--ghost" data-act="modal-no">Отмена</button>'+
      '<button class="btn '+(danger?'btn--danger-solid':'btn--primary')+'" data-act="modal-yes">'+H(ok)+'</button>'+
    '</div></div></div></div>');
}
function promptDialog(title,text,value,ok,cb){
  pendingOk=cb;
  setOverlay('<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal__body"><h2>'+H(title)+'</h2><p>'+H(text)+'</p>'+
    '<input class="input" id="promptInput" maxlength="40" value="'+H(value)+'"></div>'+
    '<div class="modal__foot"><div class="row">'+
      '<button class="btn btn--ghost" data-act="modal-no">Отмена</button>'+
      '<button class="btn btn--primary" data-act="modal-yes">'+H(ok)+'</button>'+
    '</div></div></div></div>');
  var i=$('#promptInput'); if(i){i.focus();i.select()}
}

/* ============ 11. действия ============ */
var REPLIES={
  activity:['Отлично, ждём! Собираемся у входа за десять минут до начала.','Договорились. Если что-то поменяется, напишу здесь.'],
  give_away:['Да, ещё не забрали. Могу отдать сегодня после семи — подойдёт?','Хорошо, тогда напишите, как будете у подъезда.'],
  need_help:['Спасибо, что откликнулись! Удобно завтра около полудня?','Отлично, тогда до встречи. Домофон работает, поднимайтесь.'],
  offer_service:['Привет! На выходных свободен. Расскажите, что нужно сделать.','Понял, сделаю. О времени договоримся ближе к выходным.']
};
function autoReply(threadId){
  var t=null,i;
  for(i=0;i<db.threads.length;i++)if(db.threads[i].id===threadId)t=db.threads[i];
  if(!t)return;
  var u=otherUser(t); if(!u||!u.demo)return;
  var p=pin(t.pin_id); if(!p)return;
  var msgs=messagesOf(threadId);
  var theirs=msgs.filter(function(m){return m.author_id===u.id}).length;
  if(theirs>=2)return;
  var pool=REPLIES[p.type==='activity'?'activity':p.subtype]||REPLIES.activity;
  var text=pool[Math.min(theirs,pool.length-1)];
  ui.typing=threadId; renderPanel();
  scrollChatToEnd();
  setTimeout(function(){
    ui.typing=false;
    db.messages.push({id:uid('msg'),thread_id:threadId,author_id:u.id,text:text,created_at:now()});
    if(ui.panel&&ui.panel.type==='thread'&&ui.panel.id===threadId)t.seen_at=now();
    save(); render();
    /* «ответил вам» требует знать род соседа — имя его не выдаёт, и угадывать мы не станем */
    if(!(ui.panel&&ui.panel.type==='thread'&&ui.panel.id===threadId))toast(u.name+': новое сообщение');
  },1800+Math.random()*900);
}
function sendMessage(){
  var inp=$('#msgInput'); if(!inp)return;
  var text=inp.value.trim(); if(!text)return;
  var tid=ui.panel.id;
  db.messages.push({id:uid('msg'),thread_id:tid,author_id:db.currentUserId,text:text,created_at:now()});
  save(); inp.value=''; render(); autoReply(tid);
}
/* откуда открыли пин — чтобы «назад» вернуло ровно туда. Маркер на карте отличаем по слою:
   иначе пин, ткнутый на карте при открытом поиске, считался бы открытым из поиска */
function pinOrigin(el){
  if(el&&el.closest('#markers'))return null;
  if(!ui.panel)return {type:'list'};
  if(ui.panel.type==='pin')return ui.panel.origin||null;  /* цепочку пин -> пин не копим */
  /* любой другой экран запоминаем целиком: перечень источников приходилось дополнять руками,
     и профиль в него, например, не попал — возврата из него не было */
  return ui.panel;
}
function openPin(id,origin){
  var p=pin(id); if(!p)return;
  ui.pinShut=false; ui.pinFull=false;
  /* Точку отсчёта района карточка не трогает: она принадлежит охвату и задаётся выбором
     станции. Раньше открытие события с другой станции молча переписывало её, от неё зависят
     подпись над картой и счётчики — и фон под шторкой менялся, хотя фильтр оставался прежним */
  openPanel({type:'pin',id:id,origin:origin||null});
  if(p.x==null)return;
  var s=toScreen(p.x,p.y);
  if(s[0]<mapInsetLeft()+60||s[1]<60||s[0]>view.W-60||s[1]>view.Ht-60)centerOnSmooth(p.x,p.y);
}
function pickPhoto(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=880, w=img.width, h=img.height;
        var s=Math.min(1,max/Math.max(w,h));
        var cv=document.createElement('canvas');
        cv.width=Math.round(w*s); cv.height=Math.round(h*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var data=cv.toDataURL('image/jpeg',0.72);
        if(data.length>900000)data=cv.toDataURL('image/jpeg',0.55);
        if(ui.draft){ui.draft.photos.push(data);render()}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}
function publish(){
  var d=ui.draft; if(!d||!draftValid())return;
  if(d.type==='lost_found'&&lfThisWeek(db.currentUserId)>=LF_WEEK_LIMIT){
    toast('За неделю можно опубликовать не больше '+LF_WEEK_LIMIT+' находок и пропаж');
    return;
  }
  var noPlace=(d.type==='lost_found'&&!!d.noPlace);
  var pdid=noPlace?ui.districtId:(d.district_id||ui.districtId);
  var p={id:uid('pin'),type:d.type,author_id:db.currentUserId,district_id:pdid,
    title:d.title.trim(),description:d.description.trim(),photos:d.photos.slice(),
    status:'active',created_at:now(),
    x:noPlace?null:Math.round(d.x),y:noPlace?null:Math.round(d.y)};
  if(d.type==='activity'){
    p.starts_at=draftStart(); p.expires_at=p.starts_at+3*HOUR;
    p.repeat=d.repeat||'none';
    p.participant_limit=Math.max(0,parseInt(d.limit,10)||0);
  }else if(d.type==='lost_found'){
    p.subtype=d.lfsub;
    p.expires_at=now()+LF_DAYS*DAY;
    /* у пропажи вместо точки область: круг рисуется у пина и служит зоной оповещения */
    if(d.lfsub==='lost')p.area_radius=Math.max(100,parseInt(d.radius,10)||400);
  }else{
    p.subtype=d.subtype; p.category=SUBTYPES[d.subtype].cat; p.expires_at=now()+30*DAY;
    p.term=d.term||'30d';
    p.exact_x=Math.round(d.x); p.exact_y=Math.round(d.y);
    p.x=Math.round(d.x+(Math.random()-0.5)*56); p.y=Math.round(d.y+(Math.random()-0.5)*56);
  }
  p.world=true;
  db.pins.push(p); save();
  ui.draft=null; ui.pickPaused=false;
  openPanel({type:'pin',id:p.id});
  if(p.x!=null){
    view.k=Math.min(maxZoom(),Math.max(view.k,view.kFit*2));
    centerOnSmooth(p.x,p.y);
  }
  toast(p.type==='activity'?'Встреча опубликована — соседи её уже видят'
    :p.type==='lost_found'?(p.subtype==='lost'?'Пропажа опубликована — соседи получат оповещение':'Находка опубликована — она в сообщениях у соседей')
    :'Событие опубликовано в районе «'+district(pdid).name+'»');
}
function syncPicking(){
  ui.picking=!!(ui.draft&&ui.draft.step===1&&ui.panel&&ui.panel.type==='create'&&!ui.pickPaused);
}
/* на телефоне точку пина выбирают, двигая карту под неподвижным прицелом в центре экрана,
   а не тапом (тач-точность ниже, палец закрывает место тапа) */
/* Прицел стоит в середине той полосы карты, которая осталась видимой над шторкой, а не в
   середине экрана: иначе на телефоне целиться пришлось бы в точку под шторкой */
/* На телефоне прицел стоит на фиксированной трети экрана и не двигается, когда шторка уезжает
   под палец, — так же, как в приложениях такси. Если бы он держался центра видимой полосы
   карты, точка под ним уезжала бы сама при каждом касании. На десктопе панель сбоку,
   поэтому центр карты. */
function pickCenterY(){
  var st=$('.stage'); if(!st)return view.Ht/2;
  var h=st.clientHeight;
  return isDesktopPanel()?h/2:Math.round(h*0.34);
}
/* пока палец на карте и выбирается место: шторка уезжает вниз почти целиком, плавающие
   кнопки прячутся — экран отдан карте */
function peekSheet(on){
  if(!ui.picking||isDesktopPanel())on=false;
  var pn=$('#panel'), st=$('.stage'), ap=$('#app');
  var pi=$('#pickInfo');
  if(pi&&!isDesktopPanel())pi.classList.toggle('is-away',!on);
  if(pn)pn.classList.toggle('is-peek',!!on);
  if(st)st.classList.toggle('is-peek',!!on);
  if(ap)ap.classList.toggle('is-peek',!!on);
}
/* поставить камеру так, чтобы точка оказалась ровно под прицелом, а не в центре экрана */
function centerOnPick(x,y){
  view.tx=viewCX()-x*view.k; view.ty=pickCenterY()-y*view.k;
  applyView();
}
function updateDraftFromCenter(){
  if(!(ui.picking&&ui.draft))return;
  var c=toWorld(viewCX(),pickCenterY());
  /* район берём из самой точки, а не из подписи над картой: подпись следит за камерой,
     а человек после подтверждения места ещё двигает карту, заполняя поля */
  ui.draft.x=Math.max(20,Math.min(WORLD_W-20,c[0]));
  ui.draft.y=Math.max(20,Math.min(WORLD_H-20,c[1]));
  ui.draft.district_id=districtOf(ui.draft.x,ui.draft.y);
  updatePickReadout();
  syncPlaceField();
}
/* Поле станции обновляется точечно, как и плашка с расстоянием: перерисовывать панель
   на каждом кадре перетаскивания нельзя. Пока строка в работе — список открыт и человек
   набирает — значение не трогаем, иначе карта затрёт набранное под пальцами */
function syncPlaceField(){
  var d=ui.draft; if(!d||d.stOpen)return;
  var inp=$('#placeStInput'); if(!inp)return;
  var did=d.district_id||ui.districtId, nm=district(did).name;
  if(inp.value!==nm)inp.value=nm;
  var dot=inp.parentNode&&inp.parentNode.querySelector('.searchfield__dot');
  if(dot)dot.style.background=district(did).lineColor;
}
/* точечное обновление строки с расстоянием — полный render() на каждом кадре перетаскивания
   карты был бы расточителен */
/* Плашка с местом: на телефоне сверху экрана (референс такси), на десктопе — над самим
   прицелом, там вокруг него достаточно места и понятнее, к чему относится надпись */
function placePickInfo(){
  var pi=$('#pickInfo'); if(!pi)return;
  pi.innerHTML=draftMetroHTML()||'Двигайте карту';
  if(isDesktopPanel()){
    pi.style.left=viewCX()+'px';
    pi.style.top=(pickCenterY()-68)+'px';
    pi.style.transform='translate(-50%,-100%)';
  }else{
    /* на телефоне положение задаёт стиль: трансформ нужен свободным под анимацию ухода */
    pi.style.left=''; pi.style.top=''; pi.style.transform='';
  }
}
function updatePickReadout(){placePickInfo()}

/* ============ 12. события ============ */
function onAction(act,el,e){
  var id=el.getAttribute('data-id');
  switch(act){
    case 'close-detail': ui.panel=oneUp(ui.panel); render(); break;
    /* «Показать N событий» делает то же, что стрелка назад: фильтры уже применены,
       кнопка называет результат и закрывает экран */
    /* Пустой черновик закрываем молча — спрашивать не о чем. Заполненный требует
       подтверждения: крестик теперь доступен на любом шаге, и одно промахнувшееся
       нажатие иначе выбросит всю форму */
    case 'create-close':
      var dd=ui.draft;
      var filled=!!(dd&&(dd.type||(dd.title||'').trim()||(dd.description||'').trim()||(dd.photos&&dd.photos.length)));
      if(!filled){ui.draft=null;ui.pickPaused=false;closePanel();break}
      confirmDialog('Бросить черновик?','Заполненное не сохранится, событие не опубликуется','Бросить',true,function(){
        ui.draft=null; ui.pickPaused=false; closePanel();
      });
      break;
    case 'settle':
      var stp=el.getAttribute('data-pin'), stu=id;
      var sres=responseOf(stp,stu);
      if(!sres){sres={id:uid('rsp'),pin_id:stp,user_id:stu,status:'interested',created_at:now()};db.responses.push(sres)}
      sres.settled_at=now();
      save(); render();
      /* Закрыть событие предлагаем, а не спрашиваем: раздача уходит партиями, и вопрос
         «всё отдали?» навязывал бы решение тому, кто только начал. Кто отдал последнее —
         нажмёт, остальные не заметят */
      toast('Отмечено — у соседа событие ушло в архив','Закрыть событие',function(){
        var sp=pin(stp); if(sp)closeDialog(sp);
      });
      break;
    case 'scope-done': onAction('back',el,e); break;
    case 'toast-act':
      var ta=toastAct; toastAct=null;
      $('#toast').classList.remove('is-on');
      if(ta)ta();
      break;
    case 'filters-reset': resetFilters(); render(); toast('Фильтры сброшены'); break;

    case 'cats-all':
      for(var ck in PIN_TYPES)ui.filters[ck]=true;
      render(); break;
    case 'back':
      if(ui.panel&&ui.panel.type==='create'){ui.draft=null;ui.pickPaused=false;closePanel();break}
      /* уходя с правки, черновик выбрасываем — несохранённое не должно всплыть потом */
      if(ui.panel&&ui.panel.type==='edit'){
        var ep=ui.panel.prev; ui.draft=null;
        ui.panel=ep||null; expandPanel(); render(); break;
      }
      /* выбор станции и категории открываются поверх чего угодно — возвращаем туда, откуда пришли */
      if(ui.panel&&(ui.panel.type==='scope'||ui.panel.type==='user'||ui.panel.type==='people'||ui.panel.type==='archive')){
        /* камера возвращается туда, где вы были до нажатия на значок станции */
        var pc=ui.panel.cam;
        ui.panel=ui.panel.prev||null; expandPanel(); render();
        if(pc){view.k=pc.k; view.tx=pc.tx; view.ty=pc.ty; applyView()}
        break;
      }
      if(ui.panel&&ui.panel.type==='settings'){openPanel({type:'profile'});break}
      if(ui.panel&&ui.panel.type==='pin'&&ui.panel.origin){
        var or=ui.panel.origin;
        if(or.type==='list'){ui.panel=null;expandPanel();render()}
        else openPanel(or);
        break;
      }
      /* «Назад» и крестик второй колонки идут одной дорогой: канал из профиля вернёт
         в профиль, разговор из карточки — к пину, остальное в «Сообщения» */
      if(ui.panel&&ui.panel.type==='thread'){
        var up=oneUp(ui.panel);
        if(up&&up.type==='pin'){openPin(up.id);break}
        openPanel(up||{type:'chats'});
        break;
      }
      openPanel({type:'chats'});
      break;
    case 'scrim': if(e.target===el)closeModal(); break;
    case 'modal-no': closeModal(); break;
    case 'modal-yes': var cb=pendingOk; var val=$('#promptInput')?$('#promptInput').value:null; closeModal(); if(cb)cb(val); break;
    case 'step':
      var s=parseInt(el.getAttribute('data-step'),10);
      /* возврат к месту: сначала перерисовываем панель (от её высоты зависит, где стоит
         прицел), потом возвращаем сохранённую точку и подводим под неё карту */
      var kx=ui.draft.x, ky=ui.draft.y, kd=ui.draft.district_id;
      var px=view.tx, py=view.ty;
      ui.draft.step=s; ui.pickPaused=false; render();
      /* выходя из выбора места, камера возвращается в обычные границы — доводим её плавно,
         иначе после подтверждения карта дёргалась бы обратно рывком */
      if(s!==1&&(Math.abs(view.tx-px)>1||Math.abs(view.ty-py)>1)){
        var nx=view.tx, ny=view.ty; view.tx=px; view.ty=py; panTo(nx,ny);
      }
      if(s===1&&kx!=null){
        ui.draft.x=kx; ui.draft.y=ky; ui.draft.district_id=kd;
        centerOnPick(kx,ky);
      }
      break;
    case 'publish': publish(); break;
    case 'addphoto': pickPhoto(); break;
    case 'rmphoto': ui.draft.photos.splice(parseInt(el.getAttribute('data-i'),10),1); render(); break;
    case 'join':
      var p=pin(id);
      if(p.participant_limit&&joinedOf(id).length>=p.participant_limit){toast('Мест больше нет');break}
      /* вход свободный: намерение подтверждается не на входе, а перед самой встречей.
         Заявки — исключение, которое автор включает сам */
      if(p.approval){
        db.responses.push({id:uid('rsp'),pin_id:id,user_id:db.currentUserId,status:'interested',created_at:now()});
        save(); render(); toast('Заявка отправлена — автор решит');
      }else{
        db.responses.push({id:uid('rsp'),pin_id:id,user_id:db.currentUserId,status:'joined',created_at:now()});
        joinNote(groupAdd(p,db.currentUserId),db.currentUserId);
        save(); render(); toast('Вы в списке участников и в чате встречи');
      }
      break;
    case 'leave':
      closeModal();
      var mr=myResponse(id);
      function doLeave(){
        if(mr)db.responses=db.responses.filter(function(r){return r.id!==mr.id});
        save(); render(); toast('Участие отменено');
      }
      /* Отозвать заявку можно молча: вы пока никому ничего не обещали. А выход из
         набранного состава задевает и автора, и разговор, поэтому спрашиваем */
      if(mr&&mr.status==='interested'){doLeave();break}
      confirmDialog('Не пойдёте?','Место освободится для другого соседа, и вы выйдете из чата участников','Не пойду',false,doLeave);
      break;
    case 'respond':
      if(!myResponse(id))db.responses.push({id:uid('rsp'),pin_id:id,user_id:db.currentUserId,status:'interested',created_at:now()});
      var pp=pin(id);
      /* у пропажи отклик ведёт в общий поиск, а не в личную переписку: сведения о том,
         где видели, нужны всем ищущим сразу */
      if(groupKind(pp)&&!isAct(pp)){
        var gth=groupAdd(pp,db.currentUserId);
        save(); openPanel({type:'thread',id:gth.id,from:'pin'});
        toast('Вы в поиске — пишите, где видели');
        break;
      }
      var th=ensureThread(id,pp.author_id);
      save(); openPanel({type:'thread',id:th.id,from:'pin'});
      toast('Открыли переписку с автором');
      break;
    case 'write':
      var p2=pin(id), th2=ensureThread(id,p2.author_id);
      openPanel({type:'thread',id:th2.id,from:'pin'});
      break;
    /* написать соседу из его профиля: разговор заводится по тому событию, из которого
       вы в профиль пришли — своего контекста у переписки в этом проекте не бывает */
    case 'dm':
      var dmp=el.getAttribute('data-pin');
      if(!dmp||id===db.currentUserId)break;
      var dth=ensureThread(dmp,id);
      save(); openPanel({type:'thread',id:dth.id,from:'pin',prev:ui.panel});
      break;
    case 'send': sendMessage(); break;
    case 'close-pin': closeDialog(pin(id)); break;
    /* причина только выбирается: закрывает отдельная кнопка ниже */
    case 'pick-reason':
      closeReason=el.getAttribute('data-val')||null;
      $$('.modal .radio').forEach(function(b){
        b.classList.toggle('is-on',b.getAttribute('data-val')===closeReason);
      });
      break;
    case 'modal-close': closeModal(); break;
    case 'close-reason':
      var p3=pin(id); if(!p3)break;
      p3.status='closed'; p3.closed_at=now();
      p3.close_reason=closeReason||null;
      closeModal(); notifyResponders(p3); save(); render();
      toast(p3.close_reason?'Закрыто: '+reasonLabel(p3):'Событие закрыто');
      break;
    case 'reopen':
      var p4=pin(id);
      p4.status='active';
      if(p4.type==='activity'&&p4.starts_at<now()){p4.starts_at=now()+DAY;p4.expires_at=p4.starts_at+3*HOUR}
      else p4.expires_at=now()+30*DAY;
      save(); render(); toast('Событие снова на карте');
      break;
    case 'delete-pin':
      confirmDialog('Удалить событие?','Событие, отклики и переписка по нему исчезнут. Отменить это будет нельзя','Удалить',true,function(){
        db.pins=db.pins.filter(function(x){return x.id!==id});
        db.responses=db.responses.filter(function(r){return r.pin_id!==id});
        var ths=db.threads.filter(function(t){return t.pin_id===id}).map(function(t){return t.id});
        db.threads=db.threads.filter(function(t){return t.pin_id!==id});
        db.messages=db.messages.filter(function(m){return ths.indexOf(m.thread_id)<0});
        save(); closePanel(); toast('Событие удалено');
      });
      break;
    case 'pin-menu':
      /* жаловаться на себя незачем — у своего пина на этом месте стоит правка */
      var mp=pin(id), own=mp&&mp.author_id===db.currentUserId;
      var mmr=myResponse(id), items=[{act:'share',icon:'share',label:'Поделиться',id:id}];
      if(own)items.push({act:'edit-pin',icon:'pencil',label:'Редактировать',id:id});
      else{
        if(mp&&isAct(mp)&&mp.status==='active'&&mmr&&mmr.status!=='interested')
          items.push({act:'leave',icon:'exit',label:'Не пойду',id:id});
        items.push({act:'report',icon:'flag',label:'Пожаловаться',id:id});
      }
      menuDialog(el,items);
      break;
    case 'edit-pin':
      closeModal();
      var ep2=pin(id); if(!ep2)break;
      ui.draft=draftFromPin(ep2);
      openPanel({type:'edit',id:id,prev:{type:'pin',id:id,origin:ui.panel&&ui.panel.origin}});
      break;
    case 'save-pin': savePin(); break;
    /* В прототипе у пина нет собственного адреса, поэтому делимся ссылкой на страницу плюс
       название — этого хватает, чтобы механика читалась. Системное окно «Поделиться» есть
       не везде, и там, где его нет, копируем в буфер */
    case 'share':
      closeModal();
      var sp=pin(id); if(!sp)break;
      var stxt=sp.title+' — «Район»';
      if(navigator.share){
        navigator.share({title:'Район',text:stxt,url:location.href}).then(null,function(){});
      }else if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(stxt+'\n'+location.href).then(
          function(){toast('Ссылка скопирована')},
          function(){toast('Браузер не дал скопировать ссылку')});
      }else toast('Браузер не поддерживает «Поделиться»');
      break;
    case 'report':
      confirmDialog('Пожаловаться на событие?','Мы скроем его у вас сразу. Если пожалуются трое соседей, пин уходит с карты района до проверки','Пожаловаться',true,function(){
        db.reports.push({id:uid('rep'),pin_id:id,user_id:db.currentUserId,created_at:now()});
        save(); closePanel(); toast('Спасибо, событие скрыто');
      });
      break;
    case 'extend':
      var xp=pin(id); if(xp){xp.expires_at=now()+30*DAY; save(); render(); toast('Продлили на месяц')}
      break;
    case 'toggle-approval':
      if(ui.draft){ui.draft.approval=!ui.draft.approval;render()}
      break;
    case 'open-group':
      var gp=pin(id), gt2=gp?groupThread(gp.id):null;
      if(gt2)openPanel({type:'thread',id:gt2.id,from:'pin'});
      break;
    case 'accept':
      var ar=null;
      for(var ai=0;ai<db.responses.length;ai++)if(db.responses[ai].id===id)ar=db.responses[ai];
      if(ar){ar.status='joined'; var ap=pin(ar.pin_id);
        if(ap)joinNote(groupAdd(ap,ar.user_id),ar.user_id);
        save(); render(); toast('Сосед в списке участников')}
      break;
    case 'decline':
      db.responses=db.responses.filter(function(r){return r.id!==id});
      save(); render(); toast('Заявка отклонена');
      break;
    case 'confirm-go':
      var cr=null;
      for(var ci=0;ci<db.responses.length;ci++)if(db.responses[ci].id===id)cr=db.responses[ci];
      if(cr){cr.confirmed_at=now(); save(); render(); toast('Спасибо, автор видит, что вы идёте')}
      break;
    case 'confirm-no':
      var nr=null;
      for(var ni=0;ni<db.responses.length;ni++)if(db.responses[ni].id===id)nr=db.responses[ni];
      if(nr){
        db.responses=db.responses.filter(function(r){return r.id!==nr.id});
        save(); render(); toast('Место освободилось для другого соседа')}
      break;
    case 'toggle-geo':
      var gm=me(); if(!gm)break;
      if(!gm.geo&&navigator.geolocation){
        /* разрешение спрашиваем по-настоящему: так виден сам сценарий. Ответ на расчёт
           не влияет — координаты настоящего мира к выдуманной карте не приложить */
        try{navigator.geolocation.getCurrentPosition(function(){},function(){},{timeout:4000})}catch(err){}
      }
      gm.geo=!gm.geo; save(); render();
      toast(gm.geo?'Расстояние считается от вас':'Расстояние считается от станции');
      break;
    case 'toggle-alerts':
      var mm=me(); if(mm){mm.lost_alerts=!alertsOn(); save(); render();
        toast(alertsOn()?'Оповещения о пропажах включены':'Оповещения о пропажах выключены')}
      break;
    /* кнопка системного сообщения ведёт на объект, о котором оно говорит */
    /* origin обязателен: без него карточка открывалась поверх всего и уводила из сообщений,
       а с ним список чатов остаётся в первой колонке, пин встаёт во второй, «назад» —
       обратно в канал */
    case 'open-pin': if(pin(id))openPin(id,pinOrigin(el)); break;
    /* блок автора и строки участников ведут в профиль соседа: для сервиса про незнакомцев
       возможность посмотреть, кто это, важнее любого значка подтверждения */
    /* контекст события несём с собой: личная переписка в проекте всегда принадлежит
       событию, и без него кнопке «Написать» в профиле не из чего завести разговор */
    case 'user': openPanel({type:'user',id:id,pinctx:el.getAttribute('data-pinctx')||pinCtxOf(ui.panel),prev:ui.panel}); break;
    case 'open-scope': ui.stQuery=''; ui.stFocus=false; openPanel({type:'scope',prev:ui.panel}); break;
    case 'st-clear': ui.stQuery=''; ui.stFocus=true; render(); break;

    case 'people': openPanel({type:'people',id:id,prev:ui.panel}); break;
    case 'open-archive': openPanel({type:'archive',prev:ui.panel}); break;
    case 'settings': openPanel({type:'settings'}); break;
    case 'pin-expand': ui.pinShut=false; render(); break;
    case 'open-sys':
      var stx=sysThread(true); save();
      openPanel({type:'thread',id:stx.id,from:'profile'});
      break;
    case 'rename':
      promptDialog('Как вас зовут','Имя видят соседи в карточках событий и в переписке',me().name,'Сохранить',function(v){
        if(v&&v.trim()){me().name=v.trim();save();render();toast('Имя обновлено')}
      });
      break;
    case 'reset':
      confirmDialog('Сбросить прототип?','Ваш профиль, события и переписка будут удалены из браузера, а демо-данные вернутся в исходное состояние','Сбросить',true,function(){
        try{localStorage.removeItem(KEY)}catch(e){}
        location.reload();
      });
      break;
  }
}

document.addEventListener('click',function(e){
  var el;
  if((el=e.target.closest('[data-act]'))){onAction(el.getAttribute('data-act'),el,e);return}
  /* очистка поиска: полный render() здесь нельзя — поле потеряет фокус */
  if(e.target.closest('#searchClear')){
    ui.searchQuery='';
    var si=$('#searchInput'); if(si){si.value='';si.focus()}
    syncSearchClear();
    var sr=$('#searchResults'); if(sr)sr.innerHTML=homeResultsHTML();
    return;
  }
  if((el=e.target.closest('[data-station]'))){
    var sid=el.getAttribute('data-station');
    /* Значок станции — пресет фильтра: настроен заранее, применяется нажатием. Никакого
       отдельного экрана: список меняется на месте, а на телефоне вместе с этим
       раскрывается шторка — иначе событий без точки, ради которых всё и затевалось,
       по-прежнему не увидеть.
       Молчаливым изменение при этом не остаётся: тост называет результат и предлагает
       вернуть прежний набор станций вместе с камерой */
    var prevSt=ui.stations.slice(), prevCam={k:view.k,tx:view.tx,ty:view.ty};
    setStations([sid]); ui.homeOpen=true; render(); flyToStation(sid);
    /* Пересказывать нечего: станция стоит в кнопке охвата под тостом, число событий там же,
       и станция в этом сценарии всегда одна. Остаётся действие */
    toast('','Вернуть',function(){
      setStations(prevSt); render();
      view.k=prevCam.k; view.tx=prevCam.tx; view.ty=prevCam.ty; applyView();
    },'undo');
    return;
  }
  /* галка в списке станций добавляет или убирает станцию из набора */
  if((el=e.target.closest('[data-station-toggle]'))){
    var tid=el.getAttribute('data-station-toggle');
    var ls=ui.stations.slice(), ix=ls.indexOf(tid);
    if(ix>=0)ls.splice(ix,1); else ls.push(tid);
    setStations(ls);
    var m2=me(); if(m2&&ls.length){m2.district_id=ls[0];save()}
    render();
    if(ix<0)flyToStation(tid);
    return;
  }
  if((el=e.target.closest('[data-pin]'))){openPin(el.getAttribute('data-pin'),pinOrigin(el));return}
  if((el=e.target.closest('[data-thread]'))){openPanel({type:'thread',id:el.getAttribute('data-thread')});return}

  if((el=e.target.closest('[data-cluster]'))){
    var xy=el.getAttribute('data-cluster').split(',');
    var cx=parseFloat(xy[0]), cy=parseFloat(xy[1]);
    /* запоминаем, откуда разъезжаться и кому: состав кластера после приближения
       уже не собрать — он распался */
    var ids=(el.getAttribute('data-cluster-ids')||'').split(',').filter(Boolean);
    /* Приближаем плавно, а не скачком. Прежде карта телепортировалась, и разлёт булавок
       на её фоне был не виден: глаз читал прыжок целиком */
    if(ids.length&&!reduceMotion())zoomAnim.then=function(){playBurst({ids:ids,x:cx,y:cy})};
    zoomAtSmooth(2.2,cx,cy); return;
  }
  if((el=e.target.closest('[data-type]'))){ui.draft.type=el.getAttribute('data-type');render();return}
  if((el=e.target.closest('[data-draft]'))){ui.draft[el.getAttribute('data-draft')]=el.getAttribute('data-val');render();return}
  if((el=e.target.closest('[data-subtype]'))){ui.draft.subtype=el.getAttribute('data-subtype');render();return}
  if((el=e.target.closest('[data-usertab]'))){
    var uv=el.getAttribute('data-usertab');
    var UT=['active','archive'];
    tabSwitch(function(){ui.userTab=uv},UT.indexOf(uv)>UT.indexOf(ui.userTab)?1:-1);
    return;
  }
  if((el=e.target.closest('[data-tab]'))){
    var pv=el.getAttribute('data-tab');
    var PT=['active','archive'];
    tabSwitch(function(){ui.profileTab=pv},PT.indexOf(pv)>PT.indexOf(ui.profileTab)?1:-1);
    return;
  }
  if((el=e.target.closest('[data-msgtab]'))){
    var mv=el.getAttribute('data-msgtab');
    function mi(k){for(var i=0;i<MSG_TABS.length;i++)if(MSG_TABS[i].k===k)return i; return 0}
    tabSwitch(function(){ui.msgTab=mv},mi(mv)>mi(ui.msgTab)?1:-1);
    return;
  }
  if((el=e.target.closest('[data-sort]'))){ui.feedSort=el.getAttribute('data-sort');render();return}

  /* Прежний обработчик вёл по имени в личную переписку — и в самой переписке не делал
     ничего, потому что открывал ту же. Имя ведёт в профиль, как и было решено; писать
     лично можно оттуда, кнопкой, которая знает, по какому событию заводить разговор */
  if((el=e.target.closest('[data-place-open]'))){
    if(!ui.draft)return;
    if(ui.draft.stOpen){
      /* закрываем с анимацией: сворачиваем до нуля и только потом перерисовываем —
         после перерисовки мерить было бы уже нечего */
      revealClose($('[data-reveal="placelist"]'),function(){
        ui.draft.stOpen=false; ui.draft.stQ=''; ui.pickPaused=false; render();
      });
      return;
    }
    ui.draft.stOpen=true; ui.draft.stQ='';
    /* пока список открыт, прицел на карте не нужен: карту никто не двигает */
    ui.pickPaused=true;
    render();
    var pf=$('#placeStInput'); if(pf){pf.focus(); pf.select()}
    return;
  }
  if((el=e.target.closest('[data-place-st]'))){
    var pst=el.getAttribute('data-place-st');
    if(ui.draft){
      var dr=ui.draft;
      /* зерно одно на выбор станции: пока станция та же, точка не прыгает */
      if(dr.placeSt!==pst)dr.placeSeed=uid('sc');
      dr.placeSt=pst; dr.district_id=pst;
      var xy=scatterNear(pst,dr.placeSeed);
      dr.x=xy.x; dr.y=xy.y;
      if(dr.exact_x!=null){dr.exact_x=xy.x; dr.exact_y=xy.y}
      /* выбрали — список сворачивается, карта подлетает, прицел снова живой */
      dr.stOpen=false; dr.stQ=''; ui.pickPaused=false;
    }
    /* Перерисовка раньше движения карты. ui.picking не хранится, а выводится, и пересчёт
       идёт во время отрисовки: если сперва двинуть карту, renderMarkers увидит старое
       значение «прицел на паузе» и нарисует маркер черновика — а следом появится прицел,
       и на карте окажутся две булавки */
    render();
    if(ui.draft&&ui.draft.x!=null)centerOnPick(ui.draft.x,ui.draft.y);
    return;
  }
  if((el=e.target.closest('[data-theme-set]'))){setTheme(el.getAttribute('data-theme-set'));render();return}
  if((el=e.target.closest('[data-cat]'))){toggleCat(el.getAttribute('data-cat'));render();return}
  if((el=e.target.closest('[data-scope]'))){
    /* «Весь город» — это пустой набор станций */
    if(el.getAttribute('data-scope')==='city')setStations([]);
    render(); return;
  }
  if((el=e.target.closest('[data-nav]'))){
    var n=el.getAttribute('data-nav');
    /* Каждая вкладка помнит, где вы в ней были: уходя, запоминаем, возвращаясь —
       восстанавливаем. Иначе прочитанная переписка откатывалась к списку, стоило
       заглянуть на карту. «Создать» исключение: там уход по-прежнему выбрасывает
       черновик, хранить наполовину заполненную форму между разделами — отдельная механика */
    /* Нажатие на уже открытую вкладку сбрасывает её к началу, переход с другой —
       восстанавливает то, что там было. Так ведут себя таббары в мобильных приложениях,
       и это снимает спор между «Карта сворачивает шторку» и памятью вкладок */
    var cur=tabOf(ui.panel);
    if(ui.panel&&ui.panel.type==='create')cur='create';
    /* сторона движения: уходим правее — новое приходит справа. По той же вкладке
       не едем никуда, там сброс к началу, а не переход */
    if(cur!==n)slideDir=(navIndex(n)>navIndex(cur))?1:-1;
    tabSave();
    if(n==='create'){ui.draft=newDraft();ui.pickPaused=false;openPanel({type:'create'});return}
    ui.draft=null; ui.pickPaused=false;
    var back=(cur===n)?null:tabState[n];
    if(cur===n)tabState[n]=null;
    ui.panel=back?back.panel:(n==='map'?null:{type:n});
    ui.homeOpen=back?!!back.homeOpen:false;
    ui.pinShut=back?!!back.pinShut:false;
    ui.pinFull=back?!!back.pinFull:false;
    expandPanel(); render();
    return;
  }
  if(e.target.closest('#panelCollapse')){
    ui.panelCollapsed=!ui.panelCollapsed;
    $('#work').classList.toggle('is-collapsed',ui.panelCollapsed);
    return;
  }
  if(e.target.closest('#aboutBtn')){aboutDialog();return}

  if(e.target.closest('#zoomIn')){zoomAtSmooth(1.4,viewCX(),view.Ht/2);return}
  if(e.target.closest('#zoomOut')){zoomAtSmooth(1/1.4,viewCX(),view.Ht/2);return}
  if(e.target.closest('#zoomFit')){fitOnStation(primaryStation());return}
  /* тап мимо развёрнутого дома сворачивает его обратно к строке поиска */
  if(!ui.panel&&ui.homeOpen&&window.innerWidth<=820&&!e.target.closest('#panel')){
    ui.homeOpen=false; render(); return;
  }
  /* мобильная шторка: тап вне её области закрывает панель (кроме выбора точки на карте) */
  if(ui.panel&&!ui.picking&&window.innerWidth<=820&&!e.target.closest('#panel')){
    ui.draft=null; ui.pickPaused=false; closePanel();
  }
});

/* у выпадающих списков значение приходит событием change; перерисовываем, потому что от
   повтора зависит подсказка под списком */
document.addEventListener('change',function(e){
  var f=e.target.getAttribute&&e.target.getAttribute('data-field');
  if(!f||!ui.draft||e.target.tagName!=='SELECT')return;
  ui.draft[f]=e.target.value; render();
});
document.addEventListener('input',function(e){
  if(e.target.id==='msgSearch'){
    ui.msgQuery=e.target.value;
    var ma=$('#swArea');
    if(ma){
      var ml=threadsFor(ui.msgTab);
      ma.innerHTML=ml.length?ml.map(threadRow).join('')
        :'<div class="empty">'+icon('search')+'<b>Ничего не нашлось</b><p>Попробуйте другое слово</p></div>';
      fixHang(ma);
    }
    return;
  }
  if(e.target.id==='placeStInput'){
    if(ui.draft){ui.draft.stOpen=true; ui.draft.stQ=e.target.value; ui.pickPaused=true}
    render();
    var pi=$('#placeStInput'); if(pi){pi.focus(); pi.setSelectionRange(pi.value.length,pi.value.length)}
    return;
  }
  if(e.target.id==='stInput'){
    ui.stQuery=e.target.value; ui.stFocus=true;
    /* От себя, а не по имени: в двух колонках #panelBody — это левая, и фильтр,
       открытый справа, переписывал ленту слева своей разметкой. Получался дубль окна,
       и ввод продолжался уже в копии */
    var sc=e.target.closest('.panel__body');
    if(sc){
      var v=viewScope(), tmp=document.createElement('div');
      tmp.innerHTML=v.body; fixHang(tmp);
      sc.innerHTML=tmp.innerHTML;
      var i2=$('#stInput'); if(i2){i2.value=ui.stQuery; i2.focus(); i2.setSelectionRange(i2.value.length,i2.value.length)}
    }
    return;
  }
  if(e.target.id==='searchInput'){
    ui.searchQuery=e.target.value;
    var res=$('#searchResults'); if(res)res.innerHTML=homeResultsHTML();
    syncSearchClear();
    return;
  }
  var f=e.target.getAttribute&&e.target.getAttribute('data-field');
  if(!f||!ui.draft)return;
  ui.draft[f]=e.target.value;
  /* ползунок радиуса: полная перерисовка убила бы перетаскивание, поэтому обновляем
     только подпись под ним и круг на карте */
  if(f==='radius'){
    var rh=$('#radHint');
    if(rh)rh.textContent='Круг радиусом '+niceUp(+e.target.value)+'. Если шли маршрутом, ставьте по самому дальнему месту — круг покажет всю зону поиска';
    renderMarkers();
    return;
  }
  /* строка «чего не хватает» обновляется здесь же: полную перерисовку на каждую букву
     делать нельзя — поле потеряет фокус, — а подсказка обязана поспевать за кнопкой */
  var miss2=draftMissing(), ok=!miss2;
  var dm=$('#draftMiss');
  if(dm){dm.textContent=miss2||''; dm.hidden=!miss2}
  var next=$('.panel__foot [data-act="step"][data-step="3"]')||$('.panel__foot [data-act="publish"]');
  if(next)next.disabled=!ok;
  var sv=$('.panel__foot [data-act="save-pin"]');
  if(sv)sv.disabled=!editValid();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('#overlay').innerHTML&&$('.scrim'))closeModal();
    else if(ui.panel){ui.draft=null;closePanel()}
  }

});

/* ---- карта: мышь и тач ---- */
function bindMap(){
  var drag=null, lastTap=null;
  var pts={}; /* активные указатели: pointerId -> {x,y}, нужно для pinch-to-zoom */
  var pinch=null; /* {a,b,dist0,k0,wx,wy} — два пальца в щипке */
  function ptIds(){return Object.keys(pts)}

  mapEl.addEventListener('pointerdown',function(e){
    if(e.button===1)return;
    peekSheet(true);
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=ptIds();
    if(ids.length===2){
      /* второй палец — переходим из панорамирования в pinch-zoom */
      if(drag){if(drag.cap){try{mapEl.releasePointerCapture(drag.id)}catch(err){}}drag=null;mapEl.classList.remove('is-drag')}
      if(zoomAnim.id!=null){cancelAnimationFrame(zoomAnim.id);zoomAnim.id=null;zoomAnim.target=null}
      var p0=pts[ids[0]], p1=pts[ids[1]];
      var r=mapEl.getBoundingClientRect();
      var mx=(p0.x+p1.x)/2-r.left, my=(p0.y+p1.y)/2-r.top;
      var w=toWorld(mx,my);
      pinch={a:ids[0],b:ids[1],dist0:Math.max(1,Math.hypot(p1.x-p0.x,p1.y-p0.y)),k0:view.k,wx:w[0],wy:w[1]};
    }else if(ids.length===1){
      drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:0,id:e.pointerId,cap:false};
    }
  });
  mapEl.addEventListener('pointermove',function(e){
    if(pts[e.pointerId])pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(pinch&&pts[pinch.a]&&pts[pinch.b]){
      var p0=pts[pinch.a], p1=pts[pinch.b];
      var dist=Math.hypot(p1.x-p0.x,p1.y-p0.y);
      var k=Math.min(maxZoom(),Math.max(view.kFit,pinch.k0*(dist/pinch.dist0)));
      var r=mapEl.getBoundingClientRect();
      var mx=(p0.x+p1.x)/2-r.left, my=(p0.y+p1.y)/2-r.top;
      view.k=k; view.tx=mx-pinch.wx*view.k; view.ty=my-pinch.wy*view.k;
      applyView();
      return;
    }
    if(!drag||e.pointerId!==drag.id)return;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
    if(drag.moved<5)return;
    if(!drag.cap){
      /* захват начинаем только после реального движения, иначе click по пину не сработает */
      drag.cap=true;
      try{mapEl.setPointerCapture(e.pointerId)}catch(err){}
      mapEl.classList.add('is-drag');
    }
    view.tx=drag.tx+dx; view.ty=drag.ty+dy;
    applyView();
  });
  mapEl.addEventListener('pointerup',function(e){
    delete pts[e.pointerId];
    if(!ptIds().length)peekSheet(false);
    if(pinch&&(e.pointerId===+pinch.a||e.pointerId===+pinch.b)){
      var rest=ptIds();
      pinch=null;
      if(rest.length===1){
        var id=rest[0], p=pts[id];
        drag={x:p.x,y:p.y,tx:view.tx,ty:view.ty,moved:0,id:+id,cap:false};
      }
      return;
    }
    if(!drag||e.pointerId!==drag.id)return;
    var moved=drag.moved;
    if(drag.cap){try{mapEl.releasePointerCapture(drag.id)}catch(err){}}
    drag=null;
    mapEl.classList.remove('is-drag');
    /* Мышь после протяжки всегда выдаёт click — браузер шлёт его, раз кнопку нажали
       и отпустили над одним элементом. Карта обрабатывает перетаскивание своими
       pointer-событиями, а этот клик уходил в затемнение поверх карты, и приложение
       честно исполняло «тап мимо карточки»: шторка закрывалась посреди панорамы.
       На пальце такого клика нет, поэтому беда была только мышиной */
    if(moved>5){
      var eat=function(ce){ce.stopPropagation(); ce.preventDefault()};
      window.addEventListener('click',eat,true);
      setTimeout(function(){window.removeEventListener('click',eat,true)},0);
    }
    /* Двойное касание приближает к точке. Своими руками, потому что карта перехватывает все
       касания ради панорамирования и щипка — браузерных жестов на ней нет. Мышь не считаем:
       на десктопе двойной клик уже обрабатывается отдельно, вышло бы двойное приближение */
    if(e.pointerType==='touch'&&moved<8&&!e.target.closest('.pin')&&!e.target.closest('.cluster')){
      var tnow=Date.now();
      if(lastTap&&tnow-lastTap.t<300&&Math.abs(e.clientX-lastTap.x)<30&&Math.abs(e.clientY-lastTap.y)<30){
        var tr=mapEl.getBoundingClientRect();
        zoomAtSmooth(1.6,e.clientX-tr.left,e.clientY-tr.top);
        lastTap=null;
      }else lastTap={t:tnow,x:e.clientX,y:e.clientY};
    }
  });
  mapEl.addEventListener('pointercancel',function(e){
    delete pts[e.pointerId];
    if(!ptIds().length)peekSheet(false);
    if(pinch&&(e.pointerId===+pinch.a||e.pointerId===+pinch.b))pinch=null;
    drag=null;mapEl.classList.remove('is-drag');
  });
  mapEl.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=mapEl.getBoundingClientRect();
    zoomAtSmooth(e.deltaY<0?1.16:1/1.16,e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  mapEl.addEventListener('dblclick',function(e){
    var r=mapEl.getBoundingClientRect();
    zoomAtSmooth(1.6,e.clientX-r.left,e.clientY-r.top);
  });
}

/* ============ 14. запуск ============ */
function cacheDom(){
  svgEl=$('#svg'); mapEl=$('#map'); markersEl=$('#markers'); halosEl=$('#halos');
}
/* Самопроверка данных при запуске. Проверок у прототипа нет никаких, и целый класс
   поломок — осиротевшая переписка, отклик на удалённое событие, повторившийся
   идентификатор — доходит до экрана молча и выглядит как ошибка вёрстки. Здесь он
   называется своим именем в консоли. Ничего не чинит и ничего не показывает
   пользователю: это инструмент для нас, а не сообщение ему */
function selfCheck(){
  if(!db)return;
  var bad=[], seen={};
  function uniq(list,what){
    list.forEach(function(x){
      if(seen[x.id])bad.push('повтор id ('+what+'): '+x.id);
      seen[x.id]=1;
    });
  }
  uniq(db.pins,'события'); uniq(db.threads,'переписки');
  uniq(db.messages,'сообщения'); uniq(db.responses,'отклики'); uniq(db.users,'соседи');
  db.threads.forEach(function(t){
    if(threadKind(t)==='system')return;
    if(!pin(t.pin_id))bad.push('переписка без события: '+t.id);
    if(threadKind(t)==='group'){
      var p=pin(t.pin_id);
      if(p&&!groupKind(p))bad.push('общий чат у события, где его не бывает: '+p.title);
    }
  });
  db.responses.forEach(function(r){
    if(!pin(r.pin_id))bad.push('отклик на удалённое событие: '+r.id);
    if(!user(r.user_id))bad.push('отклик от неизвестного соседа: '+r.id);
  });
  db.messages.forEach(function(m){
    var ok=false;
    for(var i=0;i<db.threads.length;i++)if(db.threads[i].id===m.thread_id){ok=true;break}
    if(!ok)bad.push('сообщение без переписки: '+m.id);
  });
  /* Сторож пересчёта: набор обязан быть свежим на каждом запуске, а не только в тот день,
     когда браузер его записал. Если пересчёт когда-нибудь сломается, это будет видно сразу,
     а не через неделю на чужом экране */
  var t=now(), stale=0, ahead=0;
  db.pins.forEach(function(p){
    if(p.created_at>t)ahead++;
    if(!p.seeded)return;
    if(p.type==='activity'&&p.status==='active'&&p.seed_start>0&&p.starts_at<t)stale++;
  });
  /* сообщения тоже: именно они первыми показали сбой — канал уведомлений поставил
     завтрашние записи выше сегодняшних, а приветствие оказалось в середине */
  db.messages.forEach(function(m){if(m.created_at>t)ahead++});
  db.threads.forEach(function(x){if(x.created_at>t)ahead++});
  if(stale)bad.push('пересчёт набора не сработал: предстоящих событий в прошлом — '+stale);
  if(ahead)bad.push('набор уехал в будущее: записей позже сегодняшнего — '+ahead);
  if(bad.length&&window.console)console.warn('«Район» — самопроверка нашла '+bad.length+':\n'+bad.slice(0,20).join('\n'));
  return bad;
}
function startApp(){
  $('#app').hidden=false;
  selfCheck();
  cacheDom();
  var m=me();
  setStations([(m&&m.district_id)||'d_sokol']);
  drawMap(); bindMap(); render();
  if(window.ResizeObserver){
    new ResizeObserver(function(){
      measure(); clampView(); applyView();
    }).observe($('.stage'));
  }
  window.addEventListener('resize',function(){measure();clampView();applyView();renderPanel()});
  /* обновляем относительное время; не трогаем экраны, где человек что-то печатает */
  setInterval(function(){
    if(ui.panel&&(ui.panel.type==='thread'||ui.panel.type==='create'))return;
    if(!ui.panel&&document.activeElement&&document.activeElement.id==='searchInput')return;
    render();
  },60000);
}

/* patch: renderPanel включает режим прицела. Шторку на телефоне больше не прячем — на первом
   шаге она низкая, и прицел стоит по центру видимой над ней полосы карты */

/* ============ 12.5 смахивание шторки вниз ============ */
/* Как в мобильных картах: тянем за ручку или шапку и отпускаем — шторка уезжает вниз.
   Тело не ловим, иначе жест дерётся с прокруткой содержимого. Закрытие делает то же, что
   сделала бы кнопка выхода этого экрана: у выбора станции и категорий — возврат назад,
   у карточки пина — к тому, откуда её открыли, у остальных — на домашний экран */
var sheetDrag=null;
/* Жест вниз закрывает шторку, а не отступает на шаг: шаг назад делает стрелка в шапке,
   и второй способ вызова ей не нужен, а закрыть целиком иначе было нечем. Исключение одно —
   карточка события: у неё три положения, и там жест меняет высоту, а не уводит с экрана */
function dismissSheet(){
  var p=ui.panel; if(!p)return;
  if(p.type==='pin'&&p.origin){
    var or=p.origin;
    if(or.type==='list'){ui.panel=null;expandPanel();render()} else openPanel(or);
    return;
  }
  ui.draft=null; ui.pickPaused=false; closePanel();
}
document.addEventListener('pointerdown',function(e){
  var pn=$('#panel');
  if(!pn||!pn.classList.contains('is-swipe'))return;
  if(!e.target.closest('.sheet-grip')&&!e.target.closest('.chathead'))return;
  if(e.target.closest('.iconbtn'))return;   /* кнопки в шапке не перехватываем */
  /* Захват указателя обязателен: без него браузер отдаёт жест тому, над чем оказался палец,
     и перетаскивание срывается на первом же пикселе за пределами ручки. preventDefault
     гасит выделение текста, которое иначе начинается вместо жеста */
  sheetDrag={y:e.clientY,t:Date.now(),moved:0,id:e.pointerId,el:e.currentTarget};
  try{e.target.setPointerCapture(e.pointerId); sheetDrag.cap=e.target}catch(err){}
  e.preventDefault();
  pn.style.transition='none';
});
document.addEventListener('pointermove',function(e){
  if(!sheetDrag)return;
  var pn=$('#panel'); if(!pn)return;
  sheetDrag.moved=Math.max(0,e.clientY-sheetDrag.y);
  pn.style.transform='translateY('+sheetDrag.moved+'px)';
});
document.addEventListener('pointerup',function(e){
  if(!sheetDrag)return;
  var d=sheetDrag; sheetDrag=null;
  if(d.cap)try{d.cap.releasePointerCapture(d.id)}catch(err){}
  var pn=$('#panel'); if(pn){pn.style.transition=''; pn.style.transform=''}
  /* быстрый смах засчитываем и без порога */
  if(d.moved>90||((Date.now()-d.t)<300&&d.moved>40))dismissSheet();
});

/* ============ 13. домашняя шторка на телефоне ============ */
/* Тянется за ручку и строку поиска — за карту не тянется, иначе карту нельзя было бы двигать.
   Прилипает к двум положениям: свёрнута (видна только строка поиска над таббаром) и
   развёрнута (обычный полноэкранный список). Короткое касание раскрывает и ставит курсор
   в поле, перетаскивание — просто тянет. */
var homeDrag=null;
function homeSheetEl(){
  var pn=$('#panel');
  return (pn&&(pn.classList.contains('is-home')||pn.classList.contains('is-pin')))?pn:null;
}
/* Карточка пина ходит по трём положениям. Вниз из раскрытой — сворачивается до корешка,
   вниз из свёрнутой — закрывается совсем, вверх или тап по корешку — раскрывается */
function pinSheetEl(){
  var pn=$('#panel');
  return (pn&&pn.classList.contains('is-pin'))?pn:null;
}
document.addEventListener('pointerdown',function(e){
  var pn=homeSheetEl(); if(!pn)return;
  if(!e.target.closest('.panel__top')&&!e.target.closest('.sheet-grip')&&!e.target.closest('.pinpeek'))return;
  /* тянем верхний край, а не всю шторку: нижний остаётся на верху таббара, поэтому
     навигация не уезжает под шторку даже посреди жеста */
  var isPin=!!pinSheetEl();
  var peek=isPin?PIN_PEEK:HOME_PEEK;
  homeDrag={y:e.clientY,moved:0,pin:isPin,open:isPin?!ui.pinShut:ui.homeOpen,
    max:Math.max(HOME_TOP,window.innerHeight-66-peek)};
  /* тянуть начинают за ручку, а палец тут же уходит с неё вниз — без захвата указателя
     события перестают приходить и шторка застревает. В поле ввода жест не перехватываем,
     иначе в нём нельзя выделить текст */
  if(!e.target.closest('input')){
    try{e.target.setPointerCapture(e.pointerId); homeDrag.cap=e.target}catch(err){}
    e.preventDefault();
  }
  pn.style.transition='none';
});
document.addEventListener('pointermove',function(e){
  if(!homeDrag)return;
  var pn=homeSheetEl(); if(!pn)return;
  var dy=e.clientY-homeDrag.y;
  if(Math.abs(dy)>homeDrag.moved)homeDrag.moved=Math.abs(dy);
  var base=homeDrag.open?(homeDrag.pin&&ui.pinFull?PIN_FULL_TOP:HOME_TOP):homeDrag.max;
  /* из свёрнутой карточки тянут дальше вниз — она уезжает за край и закрывается */
  var lo=homeDrag.pin?window.innerHeight:homeDrag.max;
  /* карточке разрешена полоса в 24 пикселя сверху: там её третье положение, и за эту же
     полосу её оттуда вытаскивают */
  var hi=homeDrag.pin?PIN_FULL_TOP:HOME_TOP;
  pn.style.top=Math.max(hi,Math.min(lo,base+dy))+'px';
});
document.addEventListener('pointerup',function(e){
  if(!homeDrag)return;
  var d=homeDrag; homeDrag=null;
  if(d.cap)try{d.cap.releasePointerCapture(e.pointerId)}catch(err){}
  var pn=homeSheetEl();
  if(pn){pn.style.transition=''; pn.style.top=''}
  var dy=e.clientY-d.y;
  if(d.pin){
    /* Три остановки: корешок, раскрыта, во весь экран. Тянут вниз — на ступень ниже,
       из корешка ещё ниже это закрытие. Тянут вверх — на ступень выше */
    if(d.moved<6){ui.pinShut=false; render(); return}
    if(ui.pinShut){
      if(dy>60){ui.pinShut=false; ui.pinFull=false; dismissSheet(); return}
      if(dy<-40)ui.pinShut=false;
    }else if(dy>60){
      if(ui.pinFull)ui.pinFull=false; else ui.pinShut=true;
    }else if(dy<-40){
      ui.pinFull=true;
    }
    render(); return;
  }
  if(d.moved<6){
    /* тап по строке — раскрыть и сразу дать печатать */
    if(!ui.homeOpen){ui.homeOpen=true;render();var inp=$('#searchInput');if(inp)inp.focus()}
    return;
  }
  ui.homeOpen=d.open?(dy<60):(dy<-40);
  render();
});

/* ============ 13. свои полосы прокрутки ============ */
/* Системная полоса скрыта в CSS: она забирала ширину у содержимого, из-за чего поле поиска
   прыгало, когда список результатов переставал прокручиваться. Вместо неё в прокручиваемый
   элемент кладём плашку и держим её на месте, компенсируя scrollTop — плашка абсолютная
   внутри скроллера и поэтому едет вместе с содержимым.
   Ничего заранее не размечаем: обработчик ловит прокрутку любого элемента, так что новые
   прокручиваемые блоки получают полосу сами, без правок здесь. */
var OS_FADE=900, osDrag=null;
function osThumb(el){
  if(!el||el.nodeType!==1||el===document.body||el===document.documentElement)return null;
  var tag=el.tagName;
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return null;   /* внутрь не вложить */
  if(el.scrollHeight-el.clientHeight<4)return null;                 /* прокручивать нечего */
  var t=el.__osThumb;
  if(!t||t.parentNode!==el){                                        /* панель перерисовалась — плашку унесло */
    if(getComputedStyle(el).position==='static')el.style.position='relative';
    t=document.createElement('i'); t.className='oscroll__thumb';
    el.appendChild(t); el.__osThumb=t;
  }
  return t;
}
function osUpdate(el){
  var t=osThumb(el); if(!t)return;
  var ch=el.clientHeight, sh=el.scrollHeight, st=el.scrollTop;
  var h=Math.max(28,Math.round(ch*ch/sh));
  t.style.height=h+'px';
  t.style.transform='translateY('+Math.round(st+(ch-h)*(st/(sh-ch)))+'px)';
}
function osFlash(el){
  var t=osThumb(el); if(!t)return;
  osUpdate(el);
  t.classList.add('is-on');
  clearTimeout(el.__osTimer);
  el.__osTimer=setTimeout(function(){
    if(!osDrag||osDrag.el!==el)t.classList.remove('is-on');
  },OS_FADE);
}
document.addEventListener('scroll',function(e){
  if(e.target&&e.target.nodeType===1)osFlash(e.target);
},true);
/* Шапка списка уходит вместе с содержимым, а не прячется рывком в начале прокрутки:
   пока вы листаете вниз, она поднимается ровно на столько, на сколько уехал список,
   и пропадает за краем — со стороны неотличимо от обычной прокрутки. Возвращается иначе,
   целиком и с анимацией: там нужна скорость, а не точность, и порог в 24 пикселя
   не даёт ей выскакивать от дрожания пальца.
   Смещение хранится на самом узле, а не в переменной: при перерисовке узел новый,
   и состояние обнуляется вместе с ним */
document.addEventListener('scroll',function(e){
  var sc=e.target;
  if(!sc||sc.nodeType!==1||sc.id!=='panelBody')return;
  var fh=sc.querySelector('.feedhead'); if(!fh)return;
  var y=sc.scrollTop, dy=y-(sc._fy||0), h=fh.offsetHeight||0, off=fh._off||0;
  sc._fy=y;
  /* Отсчёт начинается не от нуля, а от собственного места шапки в потоке. На ленте она
     стоит первой и разницы нет, а на экране фильтра над ней лежат чипы категорий: там
     шапка ещё не доехала до верха, а сдвиг уже шёл — приклеенный элемент расходился
     со своим местом в потоке, и между ними открывалась дыра */
  if(fh._top==null)fh._top=fh.offsetTop;
  if(y<=fh._top){off=0; fh._up=0}
  else if(dy>0){fh._up=0; off=Math.min(h,off+dy)}
  else if(dy<0){
    /* Порог считаем накоплением, а не за одно событие. При плавной прокрутке браузер шлёт
       много событий по пять-пятнадцать пикселей: ни одно до порога не дотягивает, хотя
       суммарно вы проехали полсотни — и шапка не возвращалась */
    fh._up=(fh._up||0)-dy;
    if(fh._up<8)return;
    fh._up=0; off=0;
  }
  else return;
  if(off===(fh._off||0))return;
  fh._off=off;
  /* вниз — без перехода, иначе шапка отстаёт от списка и едет отдельно от него */
  fh.style.transition=dy>0?'none':'';
  fh.style.transform=off?'translateY('+(-off)+'px)':'';
  fh.classList.toggle('is-away',h>0&&off>=h);
},true);
document.addEventListener('pointerdown',function(e){
  var t=e.target;
  if(!t||!t.classList||!t.classList.contains('oscroll__thumb'))return;
  var el=t.parentNode, ch=el.clientHeight, sh=el.scrollHeight, th=t.offsetHeight;
  osDrag={el:el,t:t,y:e.clientY,st:el.scrollTop,k:(ch-th)>0?(sh-ch)/(ch-th):0};
  t.classList.add('is-drag');
  if(t.setPointerCapture)t.setPointerCapture(e.pointerId);
  e.preventDefault(); e.stopPropagation();
},true);
document.addEventListener('pointermove',function(e){
  if(osDrag)osDrag.el.scrollTop=osDrag.st+(e.clientY-osDrag.y)*osDrag.k;
});
document.addEventListener('pointerup',function(){
  if(!osDrag)return;
  var d=osDrag; osDrag=null; d.t.classList.remove('is-drag'); osFlash(d.el);
});

db=loadDB();
if(!db){db=seedDB();save()}
else {migrateCoords(); migrateDemo(); reanchorDemo();}
if(db.currentUserId&&user(db.currentUserId))startApp();
else renderOnboard();

})();
</script>
