var SEED_VERSION=hashStr(JSON.stringify([SEED_USERS,SEED_ACT,SEED_OFF,SEED_LF,MY_SEED])+
  String(seedSystem)+String(seedGroup)+String(seedDB));
/* Осмысленный час встречи: утро, день или вечер, ровно или в половину */
function roundMeetTime(ts){
  var d=new Date(ts), h=d.getHours();
  var slot=(h<10)?9:(h<15)?12:(h<19)?18:20;
  d.setHours(slot,(hashStr(String(ts))%2)?30:0,0,0);
  return d.getTime();
}
function seedMyPins(who){
  var t=now(), u=user(who); if(!u)return;
  var d0=u.district_id||'d_sokol';
  var rows=MY_SEED.map(function(r){
    var c={}; for(var k in r)c[k]=r[k];
    if(!c.d)c.d=d0;
    return c;
  });
  rows.forEach(function(r){
    var xy=seedXY(r.d,r.x,r.y);
    var p={id:uid('pin'),type:r.act?'activity':'need_offer',author_id:who,district_id:r.d,
      title:r.title,description:r.desc,photos:[],x:xy.x,y:xy.y,world:true,
      status:r.status||'active',created_at:t-r.made,mine_seed:true};
    if(p.status!=='active'){p.close_reason='done'; p.closed_at=t-r.made+2*DAY}
    if(r.tag)p.seed_tag=r.tag;
    if(r.lf){
      p.type='lost_found'; p.subtype=r.lf;
      p.expires_at=t-r.made+LF_DAYS*DAY;
      if(r.lf==='lost'&&r.radius)p.area_radius=r.radius;
      db.pins.push(p);
      return;
    }
    if(r.act){
      /* смещение храним, как и у чужих событий: при следующем запуске старт считается
         от него заново, а не сдвигается дельтой — иначе время уезжает на 09:31 */
      p.seed_start=r.start/HOUR;
      p.starts_at=seedStart(p.seed_start,t); p.expires_at=p.starts_at+3*HOUR;
      p.participant_limit=r.limit||0; p.repeat=r.repeat||'none';
    }else{
      p.subtype=r.sub; p.category=SUBTYPES[r.sub].cat; p.term=r.term||'30d';
      /* у бессрочной услуги срок подтверждения на исходе — так виден сценарий продления */
      p.expires_at=(r.term==='open')?(t+4*DAY):(t-r.made+30*DAY);
      p.exact_x=xy.x; p.exact_y=xy.y;
    }
    db.pins.push(p);
  });
  /* Отклики от вашего имени. Какое состояние где показать, сказано меткой в самой строке
     набора: раньше это решал порядок в массиве, и любая новая активность сдвигала
     «полный состав» на соседний пин */
  function tagged(tag){
    return db.pins.filter(function(p){return p.seed_tag===tag&&p.status==='active'});
  }
  /* статус «interested» означает поданную заявку, которую кто-то должен рассмотреть,
     а не «мне интересно»: на активности без отбора его не бывает */
  function joinAs(p,st,ago){
    if(!p)return null;
    db.responses.push({id:uid('rsp'),pin_id:p.id,user_id:who,status:st,
      created_at:t-ago*HOUR,mine_seed:true});
    if(st!=='interested')groupAdd(p,who);
    return p;
  }
  tagged('member').forEach(function(p,i){joinAs(p,'joined',(i+1)*9)});
  joinAs(tagged('approved')[0],'joined',30);
  joinAs(tagged('full-in')[0],'joined',16);
  joinAs(tagged('pending')[0],'interested',4);

  /* Своя активность по заявкам: четыре нерассмотренные, чтобы это был список,
     а не пара строк */
  var byReq=db.pins.filter(function(p){return p.author_id===who&&p.seed_tag==='byreq'})[0];
  if(byReq){
    byReq.approval=true;
    ['u_nikita','u_dasha','u_roma','u_tanya'].forEach(function(id_,i){
      db.responses.push({id:uid('rsp'),pin_id:byReq.id,user_id:id_,
        status:'interested',created_at:t-(i+1)*5*HOUR,mine_seed:true});
    });
  }
  /* Своя активность завтра: пятеро подтвердили, трое молчат. Без этого экран
     «Подтвердили · N / Не ответили · N» нечем показать, а он и есть смысл напоминания */
  var soon=db.pins.filter(function(p){return p.author_id===who&&p.seed_tag==='confirm'})[0];
  if(soon){
    ['u_anna','u_mark','u_lena','u_timur','u_olga','u_dima','u_ksu','u_vadim'].forEach(function(id_,i){
      db.responses.push({id:uid('rsp'),pin_id:soon.id,user_id:id_,status:'joined',
        created_at:t-(i+2)*11*HOUR,confirmed_at:i<5?(t-(i+1)*40*MIN):null,mine_seed:true});
      groupAdd(soon,id_);
    });
  }
  /* Одна закрытая вещь помечена как переданная: иначе новую механику архива и счётчиков
     не на чем показать — отмеченный отклик уводит событие в архив обеим сторонам */
  var closedOwn=db.pins.filter(function(p){
    return p.author_id===who&&p.type==='need_offer'&&p.status!=='active'&&p.mine_seed;
  })[0];
  if(closedOwn&&!responseOf(closedOwn.id,'u_lena')){
    db.responses.push({id:uid('rsp'),pin_id:closedOwn.id,user_id:'u_lena',status:'interested',
      created_at:closedOwn.closed_at-2*DAY,settled_at:closedOwn.closed_at,mine_seed:true});
  }
  /* И одна прошедшая встреча, где вы были участником, а не автором: без неё в «Архиве»
     все строки помечены «автор», и вторая роль там не встречается */
  var oldAct=db.pins.filter(function(p){
    return p.author_id!==who&&isAct(p)&&p.status!=='active';
  })[0];
  if(oldAct&&!responseOf(oldAct.id,who)){
    db.responses.push({id:uid('rsp'),pin_id:oldAct.id,user_id:who,status:'joined',
      created_at:(oldAct.closed_at||t)-3*DAY,mine_seed:true});
  }
  /* Переписки: без них вкладка «Чаты» пуста, и счётчик непрочитанных никогда не показывался.
     Непрочитанной считается та, где последнее сообщение чужое и пришло позже вашего захода —
     поэтому у двух из четырёх отметку о прочтении ставим до последнего сообщения */
  var demoUsers=db.users.filter(function(u){return u.demo});
  function mateAt(i){return demoUsers.length?demoUsers[i%demoUsers.length].id:null}
  /* Реплики привязаны к смыслу события, а не к его номеру в массиве. Раньше брался «второй
     по счёту мой пин типа вещь», и разговор про сборку комода висел под напольной лампой —
     та же болезнь, что лечили у состояний встреч в третьей волне */
  function talkable(mine,sub,word){
    var all=db.pins.filter(function(p){
      return p.status==='active'&&p.type==='need_offer'&&((p.author_id===who)===mine)&&
        (!sub||p.subtype===sub);
    });
    var hit=word&&all.filter(function(p){return p.title.toLowerCase().indexOf(word)>=0})[0];
    return hit||all[0];
  }
  var chats=[
    {p:talkable(false,'offer_service','собак'),last:26*HOUR,unread:false,msgs:[[1,'здравствуйте! возьмёте нашего спаниеля по будням?'],[0,'Да, беру. Обычно выхожу в час — вам удобно?'],[1,'удобно, спасибо']]},
    {p:talkable(true,'give_away','лампа'),last:5*HOUR,unread:false,msgs:[[0,'Добрый день! А это ещё у вас?'],[1,'да, забирайте, стоит у подъезда'],[0,'Спасибо, подойду вечером.']]},
    {p:talkable(false,'give_away','кресло'),last:2*HOUR,unread:true,msgs:[[1,'добрый день, кресло ещё свободно?'],[0,'Свободно, стоит на балконе. Забрать можно сегодня до девяти.'],[0,'Домофон капризный — как подойдёте, позвоните, я спущусь.']]},
    {p:talkable(true,'offer_service','мебел'),last:40*MIN,unread:true,msgs:[[0,'Здравствуйте! Нужно собрать комод из икеи — возьмётесь на выходных?']]}
  ];
  chats.forEach(function(c,ci){
    if(!c.p)return;
    var mate=(c.p.author_id===who)?mateAt(ci):c.p.author_id;
    if(!mate)return;
    var th={id:uid('thr'),pin_id:c.p.id,users:[who,mate],created_at:t-c.last-3*HOUR,seen_at:t,mine_seed:true};
    db.threads.push(th);
    c.msgs.forEach(function(m,i){
      db.messages.push({id:uid('msg'),thread_id:th.id,
        author_id:m[0]?who:mate,text:m[1],
        created_at:t-c.last-(c.msgs.length-1-i)*23*MIN,mine_seed:true});
    });
    if(c.unread)th.seen_at=t-c.last-1;
  });
  seedGroup(who);
  seedSystem(who);
  save();
}
/* Общий чат в отладочном наборе: без него механику не увидеть, а заводить его вручную —
   значит сначала откликнуться и только потом что-то заметить */
function seedGroup(who){
  var t=now();
  var mineResp=db.responses.filter(function(x){
    var p=pin(x.pin_id);
    return x.user_id===who&&x.status!=='interested'&&p&&isAct(p)&&p.status==='active'&&p.author_id!==who;
  });
  /* в остальных общих чатах — по одной реплике автора: чат заводится при первом участнике,
     и пустым он в жизни почти не остаётся, автор пишет туда первым */
  var OPEN=['Всех записал, до встречи!','Место то же, что в объявлении. Если опаздываете — напишите сюда.','Погода обещает нормальную, идём.'];
  mineResp.slice(1).forEach(function(x,i){
    var xp=pin(x.pin_id), xt=groupAdd(xp,who);
    if(!xt||xp.seed_tag==='approved')return;
    xt.mine_seed=true;
    db.messages.push({id:uid('msg'),thread_id:xt.id,author_id:xp.author_id,
      text:OPEN[i%OPEN.length],created_at:t-(i+2)*6*HOUR,mine_seed:true});
  });
  /* Разговор набора. Строка «+», id — это пополнение состава: плашка по центру, её никто
     не писал. Так видно, как добавление читается в потоке, а не отдельным примером */
  function talk(th,script,startAgo,step){
    if(!th)return;
    th.mine_seed=true;
    script.forEach(function(l,i){
      var at=t-(script.length-i)*step;
      if(l[0]==='+'){
        if(th.users.indexOf(l[1])<0)th.users.push(l[1]);
        var u=user(l[1]);
        db.messages.push({id:uid('msg'),thread_id:th.id,author_id:null,sys:true,mine_seed:true,
          text:(l[1]===who?'Вы':(u?u.name:'Сосед'))+' в списке участников',created_at:at});
        return;
      }
      if(th.users.indexOf(l[0])<0)th.users.push(l[0]);
      db.messages.push({id:uid('msg'),thread_id:th.id,author_id:l[0],text:l[1],
        created_at:at,mine_seed:true});
    });
  }
  var r=mineResp[0];
  if(!r)return;
  var p=pin(r.pin_id);
  var gt=groupAdd(p,who); if(!gt)return;
  var co=responsesOf(p.id).filter(function(x){return x.user_id!==who}).map(function(x){return x.user_id});
  function nth(i){return co[i%(co.length||1)]||p.author_id}
  talk(gt,[
    [p.author_id,'Всем привет! Собираемся за десять минут до начала у главного входа.'],
    ['+',nth(0)],
    [nth(0),'Буду. Можно с собой соседку позвать, она тоже давно хотела?'],
    [p.author_id,'Конечно, места есть'],
    ['+',nth(1)],
    [nth(1),'всем привет! я первый раз, сильно не судите'],
    [p.author_id,'Да мы тут все не чемпионы, приходите'],
    ['+',who],
    [nth(2),'А если дождь — переносим или всё равно идём?'],
    [p.author_id,'Идём, если не ливень. Напишу здесь утром.'],
    [nth(0),'Отлично, тогда до завтра']
  ],0,37*MIN);
  gt.seen_at=t-2*HOUR;

  /* Второй живой чат — на активности, куда вас приняли по заявке: там разговор другой,
     потому что состав собирался не сам, а по одному */
  var ap=db.pins.filter(function(x){return x.seed_tag==='approved'})[0];
  var at2=ap?groupThread(ap.id):null;
  if(ap&&at2){
    var ac=responsesOf(ap.id).filter(function(x){return x.user_id!==who}).map(function(x){return x.user_id});
    function anth(i){return ac[i%(ac.length||1)]||ap.author_id}
    talk(at2,[
      [ap.author_id,'Добрый вечер! Коврики свои, воду тоже берите — колонки рядом нет.'],
      ['+',anth(0)],
      [anth(0),'а если пойдёт дождь?'],
      [ap.author_id,'Тогда переносим на четверг, напишу сюда с утра'],
      ['+',anth(1)],
      [anth(1),'Спасибо, что взяли! Давно хотела попробовать'],
      ['+',who],
      [anth(2),'Подскажите, а начинающим правда нормально? боюсь не потяну'],
      [ap.author_id,'Нормально. Половина группы пришла с нуля этой весной.'],
      [anth(0),'подтверждаю, я в апреле не могла до пола дотянуться']
    ],0,52*MIN);
    at2.seen_at=t-30*MIN;
  }

  /* ---- поиск и находка: обе роли сразу ---- */
  /* Ваша пропажа. В общем чате складывается настоящий поиск: где видели и когда. Из двух
     таких сообщений получается направление — ровно то, ради чего общий чат и заводится */
  var lp=db.pins.filter(function(x){return x.author_id===who&&x.type==='lost_found'&&x.subtype==='lost'})[0];
  if(lp){
    var lt=ensureGroup(lp);
    if(lt){
      ['u_ira','u_gosha','u_nikita'].forEach(function(uu){
        if(!responseOf(lp.id,uu))db.responses.push({id:uid('rsp'),pin_id:lp.id,user_id:uu,
          status:'interested',created_at:t-5*HOUR,mine_seed:true});
      });
      talk(lt,[
        ['+','u_ira'],
        ['u_ira','видела рыжую собаку у пруда минут сорок назад, бежала в сторону главного входа'],
        [who,'Спасибо! Ошейник синий был?'],
        ['u_ira','не разглядела, честно. но хвоста нет, коротколапая — похоже она'],
        ['+','u_gosha'],
        ['u_gosha','у нас во дворе на Стромынке кто-то рыжий пробегал полчаса назад, но не уверен'],
        [who,'Иду в обе стороны. Если увидите ещё — пишите сюда'],
        ['+','u_nikita'],
        ['u_nikita','поймал! сидит у меня на кухне, ест колбасу. Ошейник синий, на адреснике телефон'],
        [who,'Это она! Напишу вам лично']
      ],0,26*MIN);
      lt.seen_at=t;
      /* и личная переписка: место и время встречи в людном чате не обсуждают */
      var nth={id:uid('thr'),pin_id:lp.id,users:[who,'u_nikita'],created_at:t-30*MIN,seen_at:t,mine_seed:true};
      db.threads.push(nth);
      [[0,'Здравствуйте! Спасибо огромное. Куда и когда удобно подъехать?'],
       [1,'Я на машине, могу сам подвезти. Вы у какого дома?'],
       [0,'Третий подъезд, тот что ближе к аптеке. Буду через десять минут'],
       [1,'Выезжаю']].forEach(function(m,i){
        db.messages.push({id:uid('msg'),thread_id:nth.id,
          author_id:m[0]?'u_nikita':who,text:m[1],created_at:t-24*MIN+i*6*MIN,mine_seed:true});
      });
    }
  }
  /* Ваша находка. Общего чата нет: «это моё» — заявление о собственности, и опознание идёт
     вопросами, ответы на которые знает только хозяин. В общем чате первый же ответ
     прочитали бы все */
  var fp=db.pins.filter(function(x){return x.author_id===who&&x.type==='lost_found'&&x.subtype==='found'})[0];
  if(fp){
    [['u_dasha',t-3*HOUR,[[1,'Здравствуйте! Кажется, это наш. Красный?'],
                          [0,'Красный. А что на руле?'],
                          [1,'наклейка с акулой, сын сам клеил'],
                          [0,'Ваш. Заберёте сегодня? Я дома после семи']]],
     ['u_katya',t-40*MIN,[[1,'а самокат ещё у вас? у нас похожий пропал на прошлой неделе'],
                          [0,'Уже нашёлся хозяин, извините']]]].forEach(function(c){
      var th={id:uid('thr'),pin_id:fp.id,users:[who,c[0]],created_at:c[1]-HOUR,seen_at:t,mine_seed:true};
      db.threads.push(th);
      if(!responseOf(fp.id,c[0]))db.responses.push({id:uid('rsp'),pin_id:fp.id,user_id:c[0],
        status:'interested',created_at:c[1],mine_seed:true});
      c[2].forEach(function(m,i){
        db.messages.push({id:uid('msg'),thread_id:th.id,
          author_id:m[0]?c[0]:who,text:m[1],created_at:c[1]+i*9*MIN,mine_seed:true});
      });
    });
  }
  /* Чужая пропажа, где вы просто сосед: третья роль — не потерявший и не нашедший */
  var op=db.pins.filter(function(x){return x.author_id!==who&&x.type==='lost_found'&&x.subtype==='lost'&&x.x!=null})[0];
  if(op){
    var ot=ensureGroup(op);
    if(ot){
      if(!responseOf(op.id,who))db.responses.push({id:uid('rsp'),pin_id:op.id,user_id:who,
        status:'interested',created_at:t-9*HOUR,mine_seed:true});
      talk(ot,[
        [op.author_id,'Вышел в подъезд и не вернулся. Крупный рыжий, без ошейника, очень пугливый — не ловите, просто напишите'],
        ['+',who],
        [who,'Видел похожего у детской площадки вчера вечером, сидел под лавкой'],
        [op.author_id,'Спасибо! Схожу проверю там с фонарём'],
        ['+','u_olga'],
        ['u_olga','Я живу в том доме, гляну под машинами во дворе']
      ],0,48*MIN);
      ot.seen_at=t-20*MIN;
    }
  }

  /* Свой чат перед завтрашней уборкой: автор пишет в него первым, иначе в списке висит
     «Чат участников — нет сообщений», чего в жизни не бывает */
  var mp=db.pins.filter(function(x){return x.author_id===who&&x.seed_tag==='confirm'})[0];
  var mt=mp?groupThread(mp.id):null;
  if(mt){
    var mc=responsesOf(mp.id).map(function(x){return x.user_id});
    function mnth(i){return mc[i%(mc.length||1)]||who}
    talk(mt,[
      [who,'Соседи, завтра в одиннадцать у третьего подъезда. Грабли и мешки будут, перчатки возьмите свои.'],
      [mnth(0),'Буду!'],
      [mnth(1),'а если дождь?'],
      [who,'Смотрим утром. Небольшой — работаем, ливень — переносим на воскресенье.'],
      [mnth(2),'Ок, тогда до завтра']
    ],0,64*MIN);
    mt.seen_at=t-30*MIN;
  }
}
/* Системный канал в отладочном наборе: приветствие плюс оповещения о пропажах, которые
   в этот момент висят на выбранной станции. В настоящем сервисе их прислал бы сервер
   в момент публикации; здесь соседи «опубликовали» их до вашего прихода */
function seedSystem(who){
  var st=sysThread(true), t=now();
  /* у приветствия нет пина, поэтому нет ни чипа, ни строки объекта — только текст.
     Время ему не назначаем руками: приветствие — начало канала, а руками поставленные
     три часа оказались свежее записей с суточным смещением, и оно вставало в середину.
     Ставим на час раньше самой старой записи, когда остальные уже собраны */
  var hello={id:uid('msg'),thread_id:st.id,author_id:null,mine_seed:true,
    title:'Добро пожаловать в «Район»',
    text:'Сюда придут напоминания о ваших событиях и оповещения о пропажах по соседству — всё, у чего нет собеседника',
    act:null,obj:null,label:null,created_at:t};
  db.messages.push(hello);
  /* Две записи про заявки: без них канал состоит из одних пропаж, и непонятно,
     что он вообще про ваши пины */
  var ap=db.pins.filter(function(p){return p.seed_tag==='approved'})[0];
  if(ap){
    db.messages.push({id:uid('msg'),thread_id:st.id,author_id:null,mine_seed:true,
      title:'Заявку приняли',
      text:'вы в списке участников, '+district(ap.district_id).name,
      act:'open-pin',obj:ap.id,label:'Открыть',created_at:t-26*HOUR});
  }
  var br=db.pins.filter(function(p){return p.author_id===who&&p.seed_tag==='byreq'})[0];
  if(br){
    var np=pendingOf(br.id).length;
    if(np)db.messages.push({id:uid('msg'),thread_id:st.id,author_id:null,mine_seed:true,
      title:'Заявки на вашу встречу',
      text:np+' '+plural(np,'сосед ждёт решения','соседа ждут решения','соседей ждут решения'),
      act:'open-pin',obj:br.id,label:'Посмотреть',created_at:t-4*HOUR});
  }
  var u=user(who);
  if(u&&u.lost_alerts===false)return;
  var mine=(u&&u.district_id)||'d_sokol';
  db.pins.filter(function(p){
    if(p.type!=='lost_found'||p.subtype!=='lost'||p.status!=='active'||p.author_id===who)return false;
    /* задета ли ваша станция зоной поиска, а не совпадает ли она с ближайшей к пину */
    return p.x==null
      ? p.district_id===mine
      : districtsInRadius(p.x,p.y,(p.area_radius||0)/METERS_PER_UNIT).indexOf(mine)>=0;
  }).slice(0,2).forEach(function(p,i){
    var au=user(p.author_id);
    db.messages.push({id:uid('msg'),thread_id:st.id,author_id:null,mine_seed:true,
      title:'Рядом пропажа',
      text:'ищет '+(au?au.name:'сосед')+', '+district(p.district_id).name,
      act:'open-pin',obj:p.id,label:'Посмотреть',created_at:t-(i+1)*40*MIN});
  });
  /* приветствие раньше всех: следующая добавленная запись его уже не обгонит */
  var oldest=t;
  db.messages.forEach(function(m){
    if(m.thread_id===st.id&&m!==hello&&m.created_at<oldest)oldest=m.created_at;
  });
  hello.created_at=oldest-HOUR;
  st.seen_at=t-2*HOUR;
}
/* Пины, созданные до перехода на общий город, хранят координаты внутри прежнего квадрата
   1200×1200 — переносим их к станции своего района той же формулой, что и демо-наборы */
function migrateCoords(){
  var changed=false;
  db.pins.forEach(function(p){
    if(p.world)return;
    var xy=seedXY(p.district_id,p.x,p.y);
    p.x=xy.x; p.y=xy.y;
    if(p.exact_x!=null){var e=seedXY(p.district_id,p.exact_x,p.exact_y); p.exact_x=e.x; p.exact_y=e.y}
    p.world=true; changed=true;
  });
  if(changed)save();
}
function migrateDemo(){
  if(db.seed===SEED_VERSION)return;
  var demo={}; db.users.forEach(function(u){if(u.demo)demo[u.id]=1});
  var gone={};
  db.pins=db.pins.filter(function(p){
    if(!demo[p.author_id]&&!p.mine_seed)return true;   /* созданное вами не трогаем */
    gone[p.id]=1; return false;
  });
  db.responses=db.responses.filter(function(r){return !gone[r.pin_id]&&!r.mine_seed});
  var deadThreads={};
  db.threads=db.threads.filter(function(x){
    if(!gone[x.pin_id]&&!x.mine_seed)return true;
    deadThreads[x.id]=1; return false;
  });
  /* Системный канал переживает смену набора намеренно — в нём лежат и настоящие
     уведомления. Поэтому его демо-сообщения надо снимать поимённо: без этого seedSystem()
     дописывал в живой канал ещё одно приветствие при каждом обновлении набора */
  db.messages=db.messages.filter(function(m){return !deadThreads[m.thread_id]&&!m.mine_seed});
  db.reports=db.reports.filter(function(r){return !gone[r.pin_id]});
  var fresh=seedDB();
  fresh.users.forEach(function(u){if(!user(u.id))db.users.push(u)});
  db.pins=db.pins.concat(fresh.pins);
  db.responses=db.responses.concat(fresh.responses);
  db.seed=SEED_VERSION;
  if(db.currentUserId&&user(db.currentUserId))seedMyPins(db.currentUserId);
  /* Демо-учётку заводит вход «без телефона», и обновление набора её не трогает — это ваш
     профиль. Но имя у неё наше, и когда мы его поменяли, у всех уже вошедших осталось
     старое. Переименовываем только если оно ровно прежнее */
  db.users.forEach(function(u){if(!u.demo&&u.name==='Тестовый Сосед')u.name='Сергей Тесто'});
  /* Уведомление живёт дольше пина, о котором говорит: демо-пины пересобираются с новыми
     идентификаторами, и кнопка в старой карточке начинает вести в пустоту */
  db.messages=db.messages.filter(function(m){return !m.obj||!!pin(m.obj)});
  /* набор только что пересобран — значит он свежий, и точка отсчёта у него сегодняшняя.
     Без этого пересчёт при следующем запуске считал бы дельту от дня первого запуска
     и уводил свежие записи в будущее */
  db.demo_anchor=now();
  save();
}
function seedDB(){
  var t=now(), users=[], pins=[], responses=[];
  /* Лица раздаём по порядку и по одному. Клеток на листах 24, соседей 30, и если брать
     клетку по хешу имени, в одном списке участников встречаются двое с одним лицом —
     это замечаешь мгновенно. Кому клетки не хватило, тот с инициалами: в жизни так и есть */
  var face=0;
  SEED_USERS.forEach(function(u){
    var has=hashStr(u[0]+'ph')%3!==0;
    users.push({id:u[0],name:u[1],phone:null,district_id:null,demo:true,
      face:(has&&face<FACE_N)?face++:null});
  });
  SEED_ACT.forEach(function(r){
    /* Час округляем: встречи назначают на 19:00 и 11:30, а не на 02:03. Старт считается
       смещением от текущего момента, и без округления вся лента выглядела машинной.
       Смещение хранится на самом событии (seed_start): при каждом запуске старт считается
       от него заново, поэтому набор не стареет, сколько бы дней ни лежал в браузере */
    var id=uid('pin'), st=seedStart(r[4],t), status=r[11]||'active', o=r[12]||{};
    var xy=seedXY(r[0],r[6],r[7]);
    pins.push({id:id,type:'activity',author_id:r[1],district_id:r[0],title:r[2],description:r[3],
      photos:[],x:xy.x,y:xy.y,world:true,status:status,created_at:t-r[8]*HOUR,seeded:true,
      seed_start:r[4],
      starts_at:st,expires_at:st+3*HOUR,participant_limit:r[5]||0,repeat:r[10]||'none',
      approval:!!o.approval,seed_tag:o.tag||null,
      close_reason:status==='active'?null:'done',
      closed_at:status==='active'?null:(st+3*HOUR)});
    r[9].forEach(function(u,i){
      responses.push({id:uid('rsp'),pin_id:id,user_id:u,status:'joined',seeded:true,
        created_at:t-(r[8]-1)*HOUR+i*7*MIN});
    });
  });
  SEED_LF.forEach(function(r){
    var lxy=(r[5]==null)?null:seedXY(r[0],r[5],r[6]);
    var lp={id:uid('pin'),type:'lost_found',author_id:r[1],district_id:r[0],title:r[3],description:r[4],
      photos:[],x:lxy?lxy.x:null,y:lxy?lxy.y:null,world:true,status:'active',seeded:true,
      created_at:t-r[7]*HOUR,expires_at:t-r[7]*HOUR+LF_DAYS*DAY,subtype:r[2]};
    if(r[2]==='lost'&&r[8])lp.area_radius=r[8];
    pins.push(lp);
  });
  SEED_OFF.forEach(function(r){
    var oxy=seedXY(r[0],r[5],r[6]);
    pins.push({id:uid('pin'),type:'need_offer',author_id:r[1],district_id:r[0],title:r[3],description:r[4],
      photos:[],x:oxy.x,y:oxy.y,world:true,status:'active',seeded:true,
      created_at:t-r[7]*HOUR,expires_at:t-r[7]*HOUR+30*DAY,
      subtype:r[2],category:SUBTYPES[r[2]].cat,term:r[8]||'30d'});
  });
  /* несколько уже закрытых вещей и одна возвращённая находка: иначе летопись района
     и счётчики в профилях соседей были бы пусты, и обе механики не увидеть */
  pins.filter(function(p){return p.type==='need_offer'}).slice(0,5).forEach(function(p,i){
    p.status='closed'; p.close_reason='done'; p.closed_at=t-(i+2)*2*DAY;
  });
  pins.filter(function(p){return p.type==='lost_found'&&p.subtype==='found'}).slice(0,1).forEach(function(p){
    p.status='closed'; p.close_reason='done'; p.closed_at=t-3*DAY;
  });
  return {v:1,seed:SEED_VERSION,currentUserId:null,users:users,pins:pins,responses:responses,
          threads:[],messages:[],reports:[],created_at:t,demo_anchor:t};
}
/* Смещение старта в наборе: число — часы от текущего момента, строка «сб 08:00» — ближайший
   такой день недели. Событиям, чьё название называет день («Едем на субботний рынок»,
   «Катаемся на лодках в воскресенье»), день назначался часами и совпадал с названием
   случайно — раз в семь запусков */
var WDAY_KEY={вс:0,пн:1,вт:2,ср:3,чт:4,пт:5,сб:6};
function seedStart(spec,t){
  /* Отрицательное смещение — уже начавшееся или прошедшее: округлять его к слотам встреч
     нельзя, иначе «час назад» уезжает на полдня и событие перестаёт идти. Округляем к получасу */
  if(typeof spec==='number'&&spec<0){
    var d0=new Date(t+spec*HOUR);
    d0.setMinutes(d0.getMinutes()<30?0:30,0,0);
    return d0.getTime();
  }
  if(typeof spec!=='string')return roundMeetTime(t+spec*HOUR);
  var pr=spec.split(' '), wd=WDAY_KEY[pr[0]], hm=(pr[1]||'12:00').split(':');
  var d=new Date(t);
  d.setHours(+hm[0]||0,+hm[1]||0,0,0);
  var add=(wd-d.getDay()+7)%7;
  d.setDate(d.getDate()+add);
  if(d.getTime()<=t)d.setDate(d.getDate()+7);
  return d.getTime();
}
/* Набор пересчитывается от момента запуска, а не от момента, когда браузер его записал.
   Иначе через день «через 26 часов» превращается в «уже прошло», «опубликовано 5 часов
   назад» — в «три недели назад», и реплики в чатах стареют вместе с ними. Актуальность
   не нужно просить: она случается сама при каждом открытии.
   У событий старт считается заново от своего смещения — так ошибка округления не копится;
   всему остальному времена сдвигаются одной дельтой. Своё не трогаем: ваши события, отклики
   и переписки остаются на своих датах, а состояние набора переживает пересчёт — записались
   на футбол, вернулись через неделю, всё ещё записаны */
function reanchorDemo(){
  var t=now(), base=db.demo_anchor;
  /* Без метки сдвигать нечего: `created_at` базы — день первого запуска, а набор с тех пор
     мог пересобираться (migrateDemo) и быть свежим. Один раз именно на этом мы и обожглись:
     дельта в девять дней уехала на только что созданные уведомления, и канал показал
     завтрашние даты выше сегодняшних. Поэтому первый запуск просто ставит метку */
  if(!base){db.demo_anchor=t; save(); return}
  var d=t-base;
  if(d<MIN){db.demo_anchor=t; return}
  var demo={}; db.users.forEach(function(u){if(u.demo)demo[u.id]=1});
  var seeded={};
  /* объект, созданный позже метки, уже свежий — его не двигаем. Это второй замок к тому же
     замку: смесь старого набора со свежими кусками больше не разъезжается */
  function fresh(o){return (o.created_at||0)>base}
  function shift(o,keys){
    if(fresh(o))return;
    keys.forEach(function(k){if(o[k])o[k]=o[k]+d});
  }
  db.pins.forEach(function(p){
    if(!(p.seeded||p.mine_seed||demo[p.author_id]))return;
    seeded[p.id]=1;
    var wasFresh=(p.created_at||0)>base;
    shift(p,['created_at','closed_at','expires_at','starts_at']);
    if(p.type==='activity'&&p.seed_start!=null&&!wasFresh){
      p.starts_at=seedStart(p.seed_start,t);
      p.expires_at=p.starts_at+3*HOUR;
      /* событие, которое успело истечь за долгую сессию, пересчёт возвращает на карту:
         оно снова впереди, и место ему не в летописи */
      if(p.status!=='active'&&p.close_reason==='expired'){
        p.status='active'; p.closed_at=null; p.close_reason=null;
      }
      if(p.status!=='active'&&p.closed_at)p.closed_at=p.starts_at+3*HOUR;
    }
  });
  db.responses.forEach(function(r){
    if(!(r.seeded||r.mine_seed||seeded[r.pin_id]))return;
    shift(r,['created_at','settled_at','reminded_at','confirmed_at']);
  });
  var seededThreads={};
  db.threads.forEach(function(x){
    if(!(x.seeded||x.mine_seed||seeded[x.pin_id]))return;
    seededThreads[x.id]=1;
    shift(x,['created_at','seen_at','last_at']);
  });
  db.messages.forEach(function(m){
    if(!(m.mine_seed||seededThreads[m.thread_id]))return;
    shift(m,['created_at']);
  });
  db.demo_anchor=t;
  save();
}
function user(id){for(var i=0;i<db.users.length;i++)if(db.users[i].id===id)return db.users[i];return null}
function me(){return user(db.currentUserId)}
function pin(id){for(var i=0;i<db.pins.length;i++)if(db.pins[i].id===id)return db.pins[i];return null}
function responsesOf(pinId){return db.pins&&db.responses.filter(function(r){return r.pin_id===pinId})}
function myResponse(pinId){
  var m=db.currentUserId;
  for(var i=0;i<db.responses.length;i++)
    if(db.responses[i].pin_id===pinId&&db.responses[i].user_id===m)return db.responses[i];
  return null;
}
function reportedByMe(pinId){
  for(var i=0;i<db.reports.length;i++)
    if(db.reports[i].pin_id===pinId&&db.reports[i].user_id===db.currentUserId)return true;
  return false;
}
/* авто-архивация: событие прошло / объявление старше 30 дней.
   Повторяющаяся активность не архивируется, а сдвигается на следующую дату — и теряет
   отклики прошедшей встречи, потому что они относились именно к ней */
/* За сколько часов до встречи спрашиваем, идёте ли вы. Само напоминание уходит в системный
   канал одной кнопкой «Открыть» — правило «одна кнопка на сообщение» не нарушаем, а две
   кнопки ответа живут в самой карточке, где рядом видно место и время */
/* Спрашиваем за сутки, снимаем за шесть часов до начала. Разнесены они намеренно: между
   вопросом и отменой должно остаться время, чтобы ответить, и время автору — понять,
   сколько людей придёт, пока ещё можно позвать других. Напоминание уходит только в окно
   между 24 и 6 часами: кто записался позже, спрашивать поздно, и снимать его не за что */
var REMIND_H=24, CONFIRM_H=6;
function sweepConfirm(){
  var t=now(), changed=false;
  db.pins.forEach(function(p){
    if(!isAct(p)||p.status!=='active')return;
    var left=p.starts_at-t;
    var r=myResponse(p.id);
    if(!r||r.status==='interested')return;
    if(left>CONFIRM_H*HOUR&&left<REMIND_H*HOUR&&!r.confirmed_at&&!r.reminded_at){
      r.reminded_at=t; changed=true;
      sysNotify('Подтвердите участие',
        whenText(p.starts_at)+'. Подтвердите за '+CONFIRM_H+' '+
        plural(CONFIRM_H,'час','часа','часов')+' до начала',
        'open-pin',p.id,'Открыть','confirm');
    }
    /* спросили и не дождались — тихо выпадаем из списка, место достаётся другому */
    if(left<=CONFIRM_H*HOUR&&r.reminded_at&&!r.confirmed_at){
      db.responses=db.responses.filter(function(x){return x.id!==r.id});
      changed=true;
    }
  });
  if(changed)save();
}
function sweep(){
  var t=now(), changed=false;
  sweepConfirm();
  db.pins.forEach(function(p){
    if(p.status!=='active')return;
    if(!p.expires_at||p.expires_at>=t)return;
    /* Прежде демо-события не умирали: прошедшее переносилось на такой же слот через неделю.
       Костыль уехал вместе с временем суток и днём недели, а нужен он был ровно для того,
       что теперь делает пересчёт при запуске (reanchorDemo) — честно и от смещения */
    if(p.type==='activity'&&p.repeat&&p.repeat!=='none'){
      p.starts_at=nextOccurrence(p.starts_at,p.repeat);
      p.expires_at=p.starts_at+3*HOUR;
      db.responses=db.responses.filter(function(r){return r.pin_id!==p.id});
    }else{
      /* автозакрытие по сроку пишет в то же поле: иначе в архиве оказались бы две породы
         пинов, и было бы непонятно, почему у одних причина есть, а у других нет */
      p.status='archived'; p.closed_at=now(); p.close_reason=p.close_reason||'expired';
    }
    changed=true;
  });
  if(changed)save();
}


/* ============ 3. карта: генерация схемы района ============ */
/* ============ 3. карта: один общий город ============ */
/* Раньше каждая станция была отдельным квадратом 1200×1200, четыре сшивались в сетку волнистым
   швом, а пятая жила отдельным «телепортом». Теперь город один: улицы, река и парки идут
   насквозь, а район определяется как «ближайшая станция» — это даёт неровные границы даром
   и совпадает с тем, как зона у метро устроена в жизни. */
var WORLD_W=3400, WORLD_H=3400, WORLD_SEED=9107, worldCache=null;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296}}

/* Координаты в демо-наборах заданы относительно прежнего квадрата 1200×1200 — переводим их
   в общий мир как смещение от станции своего района. Той же формулой переносятся и пины,
   созданные до переделки */
function seedXY(districtId,x,y){
  var d=district(districtId);
  return {x:Math.round(d.sx+(x-600)*0.8), y:Math.round(d.sy+(y-600)*0.8)};
}
/* Район = ближайшая станция. Слагаемое-волна сдвигает рубеж туда-сюда: без него границы
   между станциями были бы идеально прямыми, а в жизни они такими не бывают */
function districtOf(x,y){
  var best=DISTRICTS[0].id, bd=Infinity;
  for(var i=0;i<DISTRICTS.length;i++){
    var d=DISTRICTS[i], dx=x-d.sx, dy=y-d.sy;
    var wob=Math.sin((x+d.seed)*0.0033)*54+Math.cos((y-d.seed)*0.0029)*54;
    var dist=Math.sqrt(dx*dx+dy*dy)+wob;
    if(dist<bd){bd=dist;best=d.id}
  }
  return best;
}
function districtAtWorldPoint(wx,wy){return districtOf(wx,wy)}
/* Зона поиска у пропажи — круг, и он спокойно накрывает несколько станций. Оповещение
   должно уходить всем, кого он задел, а не одной ближайшей: станция считается от точки
   пина, а не от того, кто ищет */
function districtsInRadius(x,y,r){
  var out=[];
  DISTRICTS.forEach(function(d){
    var dx=d.sx-x, dy=d.sy-y;
    if(Math.sqrt(dx*dx+dy*dy)<=(r||0)+1)out.push(d.id);
  });
  if(!out.length)out.push(districtOf(x,y));
  return out;
}
function metroRef(districtId){
  var d=district(districtId);
  return {x:d.sx,y:d.sy,name:d.name,metro:true};
}
var STREET_NAMES=['Стромынка','Русаковская ул.','Сокольнический Вал','ул. Матросская Тишина',
  'Покровка','Чистопрудный б-р','ул. Макаренко','Профсоюзная ул.','ул. Вавилова',
  'Комсомольский пр-т','Фрунзенская наб.','Зубовский б-р','Дмитровское ш.','ул. Прянишникова',
  'Садовое кольцо','Пятницкая ул.','Кутузовский пр-т','Большая Никитская'];
var PARK_NAMES=['Сокольнический парк','Чистопрудный бульвар','Усадьба Трубецких',
  'Тимирязевский лес','Нескучный сад','Парк у прудов','Сквер на Вавилова'];

function buildWorld(){
  if(worldCache)return worldCache;
  var r=mulberry32(WORLD_SEED), i, j;
  var xs=[-90], ys=[-90];
  while(xs[xs.length-1]<WORLD_W+90)xs.push(xs[xs.length-1]+Math.round(118+r()*92));
  while(ys[ys.length-1]<WORLD_H+90)ys.push(ys[ys.length-1]+Math.round(108+r()*84));
  var nx=xs.length-1, ny=ys.length-1;
  var mainX={}, mainY={};
  for(i=0;i<xs.length;i++)mainX[i]=(i%3===1);
  for(j=0;j<ys.length;j++)mainY[j]=(j%3===2);

  /* Река через весь город — ради таких сквозных черт и затевался общий холст: раньше вода
     была отдельной лужей внутри каждого квадрата и обрывалась на его границе */
  var riverW=70, river=[];
  for(i=0;i<=12;i++){
    var t=i/12;
    river.push([Math.round(-140+(WORLD_W+280)*t),
                Math.round(WORLD_H*0.70-Math.sin(t*3.0)*380-t*300+(r()-0.5)*80)]);
  }
  function nearRiver(x,y,pad){
    for(var q=1;q<river.length;q++){
      var a=river[q-1], b=river[q];
      var vx=b[0]-a[0], vy=b[1]-a[1], wx=x-a[0], wy=y-a[1];
      var den=vx*vx+vy*vy || 1;
      var tt=Math.max(0,Math.min(1,(wx*vx+wy*vy)/den));
      var px=a[0]+vx*tt, py=a[1]+vy*tt;
      if(Math.sqrt((x-px)*(x-px)+(y-py)*(y-py))<riverW/2+pad)return true;
    }
    return false;
  }

  /* Парки привязаны к клеткам уличной сетки и раскиданы по всему городу, а не по одному
     на район — так они попадают и на границы, что и делает границы живыми */
  var parks=[], tries=0;
  while(parks.length<PARK_NAMES.length&&tries<400){
    tries++;
    var pi=1+Math.floor(r()*(nx-3)), pj=1+Math.floor(r()*(ny-3));
    var pw=1+(r()<.55?1:0), ph=1+(r()<.45?1:0);
    var px0=xs[pi]+16, py0=ys[pj]+16, px1=xs[pi+pw]-16, py1=ys[pj+ph]-16;
    var far=true;
    for(i=0;i<parks.length;i++){
      var o=parks[i];
      if(Math.abs(o.x-px0)<520&&Math.abs(o.y-py0)<520){far=false;break}
    }
    if(!far)continue;
    parks.push({i0:pi,j0:pj,i1:pi+pw,j1:pj+ph,x:px0,y:py0,w:px1-px0,h:py1-py0,name:PARK_NAMES[parks.length]});
  }
  function inPark(i,j){
    for(var q=0;q<parks.length;q++){
      var p=parks[q];
      if(i>=p.i0&&i<p.i1&&j>=p.j0&&j<p.j1)return true;
    }
    return false;
  }

  var edges=[], fills=[], blocks=[], deco=[], labels=[];
  /* кварталы: во дворах по одному-два дома, у реки и в парках не ставим */
  for(i=0;i<nx;i++)for(j=0;j<ny;j++){
    if(inPark(i,j))continue;
    var rw=(mainX[i]||mainX[i+1])?13:9, rh=(mainY[j]||mainY[j+1])?13:9;
    var x0=xs[i]+rw+7, y0=ys[j]+rh+7, x1=xs[i+1]-rw-7, y1=ys[j+1]-rh-7;
    if(x1-x0<26||y1-y0<26)continue;
    var cols=r()<.55?2:1, rows=r()<.5?2:1, gap=9;
    var bw=(x1-x0-gap*(cols-1))/cols, bh=(y1-y0-gap*(rows-1))/rows;
    for(var c=0;c<cols;c++)for(var rr=0;rr<rows;rr++){
      if(r()<.16)continue;
      var bx=x0+c*(bw+gap), by=y0+rr*(bh+gap);
      var sw=bw*(0.72+r()*0.28), sh=bh*(0.72+r()*0.28);
      if(nearRiver(bx+sw/2,by+sh/2,26))continue;
      blocks.push({x:Math.round(bx),y:Math.round(by),w:Math.round(sw),h:Math.round(sh),alt:r()<.4});
    }
  }

  /* деревья и подписи парков */
  parks.forEach(function(p){
    var n=Math.round(10+(p.w*p.h)/9000);
    for(var q=0;q<n;q++)deco.push({x:p.x+18+r()*(p.w-36),y:p.y+18+r()*(p.h-36),rr:6+r()*7});
    labels.push({x:p.x+p.w/2,y:p.y+26,text:p.name,cls:'park',rot:0,anchor:'middle'});
  });

  /* улицы через весь город */
  for(i=1;i<xs.length-1;i++){
    var w=mainX[i]?26:18;
    edges.push({d:'M'+xs[i]+' -60V'+(WORLD_H+60),w:w+4});
    fills.push({d:'M'+xs[i]+' -60V'+(WORLD_H+60),w:w,main:mainX[i]});
  }
  for(j=1;j<ys.length-1;j++){
    var wy=mainY[j]?26:18;
    edges.push({d:'M-60 '+ys[j]+'H'+(WORLD_W+60),w:wy+4});
    fills.push({d:'M-60 '+ys[j]+'H'+(WORLD_W+60),w:wy,main:mainY[j]});
  }
  /* два бульвара по диагонали, чтобы сетка не выглядела машинной */
  [[0.22,0.36],[0.64,0.18]].forEach(function(b,q){
    var y0=Math.round(WORLD_H*b[0]), y1=Math.round(WORLD_H*(b[0]+b[1]));
    var d='M-60 '+y0+' Q '+Math.round(WORLD_W*0.5)+' '+Math.round((y0+y1)/2-180*(q?-1:1))+' '+(WORLD_W+60)+' '+y1;
    edges.push({d:d,w:30}); fills.push({d:d,w:26,main:true});
  });

  /* подписи улиц — вдоль части вертикальных и горизонтальных */
  var used=0;
  for(i=2;i<xs.length-2&&used<STREET_NAMES.length;i+=5){
    labels.push({x:xs[i]-6,y:220+r()*(WORLD_H-500),text:STREET_NAMES[used++],cls:'street',rot:-90,anchor:'start'});
  }
  for(j=3;j<ys.length-2&&used<STREET_NAMES.length;j+=5){
    labels.push({x:220+r()*(WORLD_W-620),y:ys[j]-8,text:STREET_NAMES[used++],cls:'street',rot:0,anchor:'start'});
  }

  worldCache={blocks:blocks,edges:edges,fills:fills,parks:parks,deco:deco,
              river:river,riverW:riverW,labels:labels};
  return worldCache;
}

function mapSVG(){
  var g=buildWorld(), s=[];
  s.push('<rect x="-300" y="-300" width="'+(WORLD_W+600)+'" height="'+(WORLD_H+600)+'" fill="var(--ground)"/>');
  /* Порядок: сначала улицы и дома, поверх них парки и река. Прежний порядок достался от старой
     карты, где вода была лужей внутри квартала; для реки через весь город улицы поверх неё
     выглядят как сетка, перечёркивающая русло */
  g.edges.forEach(function(e){s.push('<path d="'+e.d+'" stroke="var(--road-edge)" stroke-width="'+e.w+'" fill="none" stroke-linecap="round"/>')});
  g.fills.forEach(function(e){s.push('<path d="'+e.d+'" stroke="'+(e.main?'var(--road)':'var(--road-2)')+'" stroke-width="'+e.w+'" fill="none" stroke-linecap="round"/>')});
  g.blocks.forEach(function(b){s.push('<rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="3" fill="'+(b.alt?'var(--build-2)':'var(--build)')+'"/>')});
  g.parks.forEach(function(p){
    s.push('<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="26" fill="var(--park)"/>');
  });
  g.deco.forEach(function(t){s.push('<circle cx="'+t.x.toFixed(0)+'" cy="'+t.y.toFixed(0)+'" r="'+t.rr.toFixed(0)+'" fill="var(--park-2)"/>')});
  var rp='M'+g.river[0][0]+' '+g.river[0][1];
  for(var i=1;i<g.river.length;i++)rp+=' L'+g.river[i][0]+' '+g.river[i][1];
  s.push('<path d="'+rp+'" stroke="var(--water-edge)" stroke-width="'+(g.riverW+6)+'" fill="none" stroke-linecap="round" stroke-linejoin="round"/>');
  s.push('<path d="'+rp+'" stroke="var(--water)" stroke-width="'+g.riverW+'" fill="none" stroke-linecap="round" stroke-linejoin="round"/>');
  g.labels.forEach(function(l){
    var tr=l.rot?' transform="rotate('+l.rot+' '+l.x.toFixed(0)+' '+l.y.toFixed(0)+')"':'';
    var fill=l.cls==='park'?'var(--park-ink)':'var(--ink-3)';
    var size=l.cls==='park'?15:11;
    s.push('<text x="'+l.x.toFixed(0)+'" y="'+l.y.toFixed(0)+'"'+tr+' fill="'+fill+'" font-size="'+size+'" font-family="JetBrains Mono, monospace" letter-spacing="0.5" text-anchor="'+(l.anchor||'start')+'">'+H(l.text)+'</text>');
  });
  return '<g id="world">'+s.join('')+'</g>';
}

/* ============ 4. вид карты (пан/зум) ============ */
/* мир теперь один на весь город, worldW/worldH больше не меняются */
var view={k:1,tx:0,ty:0,kFit:1,W:0,Ht:0,worldW:WORLD_W,worldH:WORLD_H};
var svgEl, worldEl, mapEl, markersEl, halosEl;
/* какой пин был выбран в прошлой отрисовке — чтобы было из чего анимировать */
var selPrev=null;

function measure(){
  var st=$('.stage').getBoundingClientRect();
  view.W=Math.max(1,st.width); view.Ht=Math.max(1,st.height);
  svgEl.setAttribute('viewBox','0 0 '+view.W+' '+view.Ht);
  svgEl.setAttribute('width',view.W); svgEl.setAttribute('height',view.Ht);
  view.kFit=Math.max(view.W/view.worldW,view.Ht/view.worldH);
}
/* Потолок приближения задан абсолютным числом, а не кратностью «сколько раз влезает город»:
   кратность зависит от размера окна, и на большом мониторе потолок уезжал бы. 10.5 — это
   примерно 10 метров в шкале при 1.6 м на единицу мира */
var MAX_K=10.5;
function maxZoom(){return Math.max(view.kFit*4,MAX_K)}
function clampView(){
  if(view.k<view.kFit)view.k=view.kFit;
  var mz=maxZoom(); if(view.k>mz)view.k=mz;
  /* Обычно камере нельзя показывать пустоту за краем карты. Но прицел стоит на фиксированной
     точке экрана, и без этого послабления до точек у самого края он не дотянется — вокруг
     района получается мёртвая полоса шириной в пол-экрана. Поэтому на время выбора места
     границы раздвигаются ровно настолько, чтобы прицел доставал до любой точки */
  var mx=0, my=0;
  if(ui.picking){
    mx=Math.max(viewCX(),view.W-viewCX());
    my=Math.max(pickCenterY(),view.Ht-pickCenterY());
  }
  var minTx=view.W-view.worldW*view.k-mx, minTy=view.Ht-view.worldH*view.k-my;
  view.tx=Math.min(mx,Math.max(minTx,view.tx));
  view.ty=Math.min(my,Math.max(minTy,view.ty));
}
function fitView(){
  view.worldW=WORLD_W; view.worldH=WORLD_H;
  measure(); view.k=view.kFit;
  var fl=mapInsetLeft();
  view.tx=fl+((view.W-fl)-view.worldW*view.k)/2; view.ty=(view.Ht-view.worldH*view.k)/2;
  clampView(); applyView();
}
/* открыть город, встав на нужную станцию с разумным приближением */
function fitOnStation(districtId){
  view.worldW=WORLD_W; view.worldH=WORLD_H;
  measure();
  var d=district(districtId);
  view.k=Math.min(maxZoom(),Math.max(view.kFit,view.kFit*2.2));
  view.tx=viewCX()-d.sx*view.k;
  view.ty=view.Ht/2-d.sy*view.k;
  clampView(); applyView();
}
function applyView(){
  clampView();
  if(worldEl)worldEl.setAttribute('transform','translate('+view.tx.toFixed(2)+','+view.ty.toFixed(2)+') scale('+view.k.toFixed(4)+')');
  var pcEl=$('#pickCenter');
  if(pcEl&&!pcEl.hidden){pcEl.style.top=pickCenterY()+'px'; pcEl.style.left=viewCX()+'px'}
  updateDraftFromCenter();
  renderMarkers(); updateScalebar();
  /* Карта больше не переназначает охват при панораме. С набором станций это бессмысленно —
     непонятно, что делать с остальными выбранными, — а с одной станцией механика дважды
     давала сбои: «центр карты» считается от видимой полосы, и открытие второй колонки
     само перебрасывало список на соседнюю станцию. Охват задают в фильтре, карта — вид */
}
function updateDistrictLabel(){
  var d=district(ui.districtId);
  var dn=$('#districtName'), ds=$('#districtSub');
  if(dn)dn.textContent=d.name;
  if(ds)ds.textContent=d.sub;
  var all=pinsOfDistrict(ui.districtId,{});
  var ca=$('#cntAct'), co=$('#cntOffer');
  if(ca)ca.textContent=all.filter(function(p){return p.type==='activity'}).length;
  if(co)co.textContent=all.filter(function(p){return p.type==='need_offer'}).length;
}
function toScreen(x,y){return [view.tx+x*view.k,view.ty+y*view.k]}
function toWorld(sx,sy){return [(sx-view.tx)/view.k,(sy-view.ty)/view.k]}
function zoomAt(factor,cx,cy){
  var w=toWorld(cx,cy), k0=view.k;
  view.k=Math.min(maxZoom(),Math.max(view.kFit,view.k*factor));
  if(view.k===k0)return;
  view.tx=cx-w[0]*view.k; view.ty=cy-w[1]*view.k;
  applyView();
}
/* плавный зум: колесо/кнопки двигают view.k к цели каждый кадр, а не скачком */
var zoomAnim={id:null,target:null,ax:0,ay:0,wx:0,wy:0};

function reduceMotion(){
  try{return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}
  catch(e){return false}
}
function zoomAtSmooth(factor,cx,cy){
  var w=toWorld(cx,cy);
  zoomAnim.ax=cx; zoomAnim.ay=cy; zoomAnim.wx=w[0]; zoomAnim.wy=w[1];
  var base=zoomAnim.target!=null?zoomAnim.target:view.k;
  zoomAnim.target=Math.min(maxZoom(),Math.max(view.kFit,base*factor));
  if(zoomAnim.id==null)zoomAnim.id=requestAnimationFrame(stepZoomAnim);
}
function stepZoomAnim(){
  var diff=zoomAnim.target-view.k, done=Math.abs(diff)<Math.max(0.0006,zoomAnim.target*0.0015);
  view.k=done?zoomAnim.target:view.k+diff*0.3;
  view.tx=zoomAnim.ax-zoomAnim.wx*view.k; view.ty=zoomAnim.ay-zoomAnim.wy*view.k;
  applyView();
  if(done){
    zoomAnim.id=null; zoomAnim.target=null;
    /* Разлёт булавок можно играть только в тишине — пока приближение идёт, слой меток
       перерисовывается каждый кадр и любой начатый переход умирает вместе с узлом.
       Тишина наступает здесь */
    if(zoomAnim.then){var f=zoomAnim.then; zoomAnim.then=null; f()}
  }
  else zoomAnim.id=requestAnimationFrame(stepZoomAnim);
}
/* разлёт: булавки выезжают из точки, где стоял кластер, на свои места */
function playBurst(b){
  if(!b||!b.ids.length)return;
  var mv=$('#markers'); if(!mv)return;
  var got=[];
  b.ids.forEach(function(pid){
    var btn=mv.querySelector('[data-pin="'+pid+'"]');
    var mk=btn&&btn.parentNode;
    if(!mk||!mk.classList||!mk.classList.contains('marker'))return;
    mk._fin=mk.style.transform;
    mk.style.transition='none';
    mk.style.transform='translate('+b.x+'px,'+b.y+'px)';
    got.push(mk);
  });
  if(!got.length)return;
  void mv.offsetWidth;
  got.forEach(function(mk){
    mk.style.transition='transform .3s cubic-bezier(.2,.75,.3,1)';
    mk.style.transform=mk._fin;
  });
}
/* Панель лежит поверх карты, поэтому «центр карты» — это середина той полосы, что из-под неё
   видна. Считать по всей ширине нельзя: наведённый пин встал бы ровно под панелью */
function mapInsetLeft(){
  if(!isDesktopPanel())return 0;
  var w=$('#work'); if(w&&w.classList.contains('is-collapsed'))return 0;
  var l=0, pn=$('#panel'), pb=$('#panelB');
  if(pn&&!pn.hidden)l+=pn.offsetWidth;
  if(pb&&!pb.hidden)l+=pb.offsetWidth;
  return l;
}
function viewCX(){var l=mapInsetLeft();return l+(view.W-l)/2}
/* Плавное движение к точке: раньше карта переставлялась мгновенно и это читалось как рывок.
   Долгий пролёт тоже плох — держим треть секунды, а совсем дальние переходы (другая станция
   вне сшитой карты) оставляем мгновенными: смазанный пролёт через полкарты ничего не покажет */
var panAnim={id:null};
function panTo(tx,ty){
  if(panAnim.id){cancelAnimationFrame(panAnim.id);panAnim.id=null}
  var sx=view.tx, sy=view.ty, t0=0, dur=320;
  if(Math.abs(tx-sx)+Math.abs(ty-sy)>(view.W+view.Ht)*2.5){view.tx=tx;view.ty=ty;applyView();return}
  function frame(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
    view.tx=sx+(tx-sx)*e; view.ty=sy+(ty-sy)*e;
    applyView();
    panAnim.id=(p<1)?requestAnimationFrame(frame):null;
  }
  panAnim.id=requestAnimationFrame(frame);
}
function centerOnSmooth(x,y){panTo(viewCX()-x*view.k, view.Ht/2-y*view.k)}
/* подвести карту к станции выбранного района */
function flyToStation(id){
  var r=metroRef(id);
  view.k=Math.min(maxZoom(),Math.max(view.kFit,view.kFit*2.2));
  centerOnSmooth(r.x,r.y);
}
function centerOn(x,y,k){
  if(k)view.k=Math.min(maxZoom(),Math.max(view.kFit,k));
  view.tx=viewCX()-x*view.k; view.ty=view.Ht/2-y*view.k;
  applyView();
}
var SCALE_PX=64;
function updateScalebar(){
  var mpp=METERS_PER_UNIT/view.k, meters=SCALE_PX*mpp;
  $('#scaleTxt').textContent=formatScale(meters);
  $('#scaleLine').style.width=SCALE_PX+'px';
}
function formatScale(m){
  if(m>=1000)return (m/1000).toFixed(m<10000?1:0).replace('.',',')+' км';
  if(m>=100)return (Math.round(m/10)*10)+' м';
  if(m>=20)return (Math.round(m/5)*5)+' м';
  return Math.max(1,Math.round(m))+' м';
}
function drawMap(){
  svgEl.innerHTML=mapSVG();
  worldEl=svgEl.querySelector('#world');
  fitOnStation(primaryStation());
}

/* ============ 5. маркеры и кластеры ============ */
function hiddenForMe(p){
  if(reportedByMe(p.id))return true;
  var n=0;
  for(var i=0;i<db.reports.length;i++)if(db.reports[i].pin_id===p.id)n++;
  return n>=3;
}
/* Весь город — это пустой набор. Отдельного признака «город» больше нет: он выводится */
function isCity(){return !ui.stations.length}
/* Пин попадает в охват по расстоянию, а не по принадлежности одной станции. Иначе пин
   ровно посередине между двумя достаётся ближайшей, и человек с другой стороны его не
   видит, хотя идти ему столько же. Это зеркало того же, что мы сделали для читателя:
   у него набор станций, а у пина была одна */
var SCOPE_MIN=20;
function scopeUnits(){return (SCOPE_MIN*WALK_MPM/WALK_DETOUR)/METERS_PER_UNIT}
function nearStation(p,id){
  if(p.x==null)return p.district_id===id;
  var d=district(id), dx=p.x-d.sx, dy=p.y-d.sy;
  return Math.sqrt(dx*dx+dy*dy)<=scopeUnits();
}
function inScope(p){
  if(isCity())return true;
  for(var i=0;i<ui.stations.length;i++)if(nearStation(p,ui.stations[i]))return true;
  return false;
}
/* карта центрируется по первой станции набора */
function primaryStation(){return ui.stations[0]||ui.districtId}
function setStations(list){
  ui.stations=list.slice();
  if(ui.stations.length)ui.districtId=ui.stations[0];
}
/* счётчик у станции считает по тому же радиусу, что и охват, поэтому один пин может
   считаться у двух соседних станций и сумма по станциям больше общегородской */
function pinsOfDistrict(id,opts){
  opts=opts||{};
  return db.pins.filter(function(p){
    if(!nearStation(p,id))return false;
    if(!opts.any&&p.status!=='active')return false;
    if(hiddenForMe(p))return false;
    if(opts.filtered&&!ui.filters[p.type])return false;
    return true;
  });
}
function pinGlyph(p){return ptype(p).glyph}

/* мировые координаты станций метро текущего вида — метки рисуются маркерами (экранный
   фиксированный размер), а не частью масштабируемого SVG-мира */
function metroPoints(){
  return DISTRICTS.map(function(d){return {id:d.id,wx:d.sx,wy:d.sy,lineColor:d.lineColor}});
}
function renderMarkers(){
  /* Режим прицела выводится, а не хранится, и до сих пор пересчитывался в renderPanel —
     то есть уже после слоя меток. Один общий render() успевал нарисовать метки по старому
     значению: слой ставил маркер черновика («Ваша точка»), а прицел в центре экрана
     появлялся следом — две булавки на одну точку. Считаем здесь, до разметки, и оба слоя
     всегда говорят об одном */
  syncPicking();
  var list=[];
  /* На дальнем зуме отдельные пины сливаются и попасть в нужный невозможно — вместо них
     показываем по одной плашке на станцию со счётчиком. Порог совпадает с приближением,
     на которое карта встаёт при выборе станции: выбрали станцию — сразу видите её пины */
  var far=view.k<view.kFit*2;
  /* город один, поэтому на карте разом видны пины всех станций; чужие приглушаются ниже */
  if(!far)db.pins.forEach(function(p){
    if(p.status!=='active'||hiddenForMe(p)||!ui.filters[p.type])return;
    /* находка без указанного места на карте не живёт: она есть в списках и в оповещении */
    if(p.x==null)return;
    list.push({p:p,wx:p.x,wy:p.y});
  });
  /* Сетка считается в мировых координатах, а не в экранных. Раньше ключ ячейки брался от
     положения пина на экране, и при панораме границы ячеек ехали относительно пинов: два
     пина то попадали в одну ячейку, то расходились по соседним, отчего кластеры мигали.
     Теперь состав зависит только от масштаба. По той же причине пины за краем экрана
     отбрасываются после группировки, а не до неё — иначе у кластера на кромке менялся счёт */
  /* Группируем по расстоянию, а не по решётке. Решётка привязана к нулю мира, и при зуме
     её граница ползла через пару близких пинов: на одних масштабах они в одной ячейке, на
     других в соседних — отсюда мигание. Расстояние монотонно по зуму: приближаясь, пины
     только расходятся, поэтому кластер может распасться, но не собраться обратно.
     От сдвига карты оно не зависит вовсе. Пинов на экране десятки, квадрат по ним дёшев */
  var CL=70, out=[], halos=[], groups=[], taken={};
  var pts=list.map(function(item){return {p:item.p,s:toScreen(item.wx,item.wy)}});
  pts.forEach(function(a,i){
    if(taken[i])return;
    var g=[a]; taken[i]=1;
    for(var j=i+1;j<pts.length;j++){
      if(taken[j])continue;
      var dx=pts[j].s[0]-a.s[0], dy=pts[j].s[1]-a.s[1];
      if(dx*dx+dy*dy<CL*CL){g.push(pts[j]); taken[j]=1}
    }
    groups.push(g);
  });
  groups.forEach(function(arr){
    var vis=false;
    for(var vi=0;vi<arr.length;vi++){
      var vs=arr[vi].s;
      if(vs[0]>=-80&&vs[1]>=-80&&vs[0]<=view.W+80&&vs[1]<=view.Ht+80){vis=true;break}
    }
    if(!vis)return;
    if(arr.length===1){
      var p=arr[0].p, s=arr[0].s, mine=p.author_id===db.currentUserId;
      var sel=ui.panel&&ui.panel.type==='pin'&&ui.panel.id===p.id;
      var dim=!inScope(p);
      var html='<div class="marker'+(sel?' is-sel':'')+(dim?' is-dim':'')+'" style="transform:translate('+s[0].toFixed(1)+'px,'+s[1].toFixed(1)+'px)">';
      /* Круг неопределённости показываем только у открытой карточки: на общей карте он
         отвечает на вопрос, которого там не задают, а соседние пины красит. Рисуется своим
         слоем ниже — иначе даже единственный круг закрыл бы пины вокруг */
      var haloU=sel?((p.type==='need_offer')?46:(p.area_radius?p.area_radius/METERS_PER_UNIT:0)):0;
      if(haloU){
        var rad=Math.max(24,haloU*view.k);
        halos.push('<div class="marker" style="transform:translate('+s[0].toFixed(1)+'px,'+s[1].toFixed(1)+'px)">'+
          '<span class="halo'+(isLF(p)?' halo--find':'')+'" style="width:'+(rad*2).toFixed(0)+'px;height:'+(rad*2).toFixed(0)+'px"></span></div>');
      }
      html+='<button class="pin pin--'+ptype(p).cls+(mine?' pin--mine':'')+'" data-pin="'+p.id+'" title="'+H(p.title)+'" aria-label="'+H(p.title)+'">'+icon(pinGlyph(p))+'</button>';
      if(sel||view.k>view.kFit*2.2)html+='<span class="pin__label">'+H(p.title)+'</span>';
      html+='</div>';
      out.push(html);
    }else{
      var sx=0,sy=0,hasA=false,hasO=false,mine=false;
      /* смешанный кластер у шва не гасим: он наполовину «свой» */
      arr.forEach(function(o){sx+=o.s[0];sy+=o.s[1];if(o.p.type==='activity')hasA=true;else hasO=true;
        if(inScope(o.p))mine=true});
      sx/=arr.length; sy/=arr.length;
      var mix='<span class="cluster__mix">'+(hasA?'<i style="background:var(--act)"></i>':'')+(hasO?'<i style="background:var(--offer)"></i>':'')+'</span>';
      out.push('<div class="marker'+(mine?'':' is-dim')+'" style="transform:translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px)">'+
        '<button class="cluster" data-cluster="'+sx.toFixed(0)+','+sy.toFixed(0)+
          '" data-cluster-ids="'+arr.map(function(o){return o.p.id}).join(',')+
          '" aria-label="'+arr.length+' событий рядом, приблизить">'+
        '<span class="cluster__ring"></span>'+arr.length+mix+'</button></div>');
    }
  });
  /* пока идёт выбор точки перетаскиванием карты (моб.) точку показывает неподвижный
     прицел по центру экрана (#pickCenter) — здесь маркер для неё не нужен */
  /* маркер черновика живёт ровно столько, сколько открыт экран создания: раньше он оставался
     на карте во всех разделах, потому что проверялось только наличие черновика */
  if(ui.draft&&ui.draft.x!=null&&!ui.picking&&ui.panel&&ui.panel.type==='create'){
    var ds=toScreen(ui.draft.x,ui.draft.y);
    /* у вещей и услуг сразу рисуем круг неопределённости: соседи увидят не точку, а примерное
       место, и автор должен видеть это до публикации, а не узнавать после */
    var dhalo='', dhu=0;
    if(ui.draft.type==='need_offer')dhu=46;
    else if(ui.draft.type==='lost_found'&&ui.draft.lfsub==='lost')dhu=(parseInt(ui.draft.radius,10)||400)/METERS_PER_UNIT;
    if(dhu){
      var drad=Math.max(24,dhu*view.k);
      dhalo='<span class="halo'+(ui.draft.type==='lost_found'?' halo--find':'')+'" style="width:'+(drad*2).toFixed(0)+'px;height:'+(drad*2).toFixed(0)+'px"></span>';
    }
    out.push('<div class="marker is-sel is-draft" style="transform:translate('+ds[0].toFixed(1)+'px,'+ds[1].toFixed(1)+'px)">'+dhalo+
      /* пока тип не выбран, маркер выглядит как прицел: брендовый со знаком вопроса,
         иначе он казался бы готовым зелёным пином услуги */
      (ui.draft.type
        ? '<span class="pin pin--'+ptype(ui.draft).cls+'">'+icon(pinGlyph({type:ui.draft.type}))+'</span>'
        : '<span class="pin pin--pick"><b>?</b></span>')+
      '<span class="pin__label">Ваша точка</span></div>');
  }
  metroPoints().forEach(function(mp){
    var s=toScreen(mp.wx,mp.wy);
    if(s[0]<-30||s[1]<-30||s[0]>view.W+30||s[1]>view.Ht+30)return;
    var n=far?pinsOfDistrict(mp.id,{filtered:true}).length:0;
    out.push('<div class="marker" style="transform:translate('+s[0].toFixed(1)+'px,'+s[1].toFixed(1)+'px)">'+
      (n
        ? '<button class="stationbadge" data-station="'+mp.id+'" style="background:'+mp.lineColor+'" aria-label="'+H(district(mp.id).name)+', '+n+'">'+
          '<svg aria-hidden="true" style="color:'+mp.lineColor+'"><use href="#i-metro"/></svg><b>'+n+'</b></button>'
        : '<svg class="metrodot" aria-hidden="true" style="color:'+(mp.lineColor||'var(--ink)')+'"><use href="#i-metro"/></svg>')+
      '</div>');
  });
  markersEl.innerHTML=out.join('');
  if(halosEl)halosEl.innerHTML=halos.join('');
  /* Булавки выезжают из кластера, а не возникают на местах. Слой меток перерисовывается
     каждый кадр движения карты, поэтому вести узел из точки в точку можно только в тишине —
     когда перерисовок больше не будет. Такая тишина наступает после нажатия на кластер:
     zoomAt отрабатывает разом, рисует метки один раз и на этом останавливается.
     Щипок и колесо не анимируем: там кластеры распадаются постепенно, кадр за кадром */

  /* Слой меток перерисовывается целиком, поэтому выбранный пин появляется сразу крупным,
     а прежний исчезает вместе с узлом — переходить не из чего. Проигрываем оба перехода
     руками: новый вырастает из обычного размера, прежний уменьшается до него.
     Тот же приём, что у полосы шагов и тумблера */
  var selNow=(ui.panel&&ui.panel.type==='pin')?ui.panel.id:null;
  if(selNow!==selPrev){
    var nw=selNow&&markersEl.querySelector('.marker.is-sel:not(.is-draft)');
    if(nw){nw.classList.remove('is-sel'); void nw.offsetWidth; nw.classList.add('is-sel')}
    if(selPrev){
      var ob=markersEl.querySelector('[data-pin="'+selPrev+'"]');
      var om=ob&&ob.parentNode;
      if(om&&om.classList.contains('marker')){
        om.classList.add('is-sel'); void om.offsetWidth; om.classList.remove('is-sel');
      }
    }
    selPrev=selNow;
  }
}


/* ============ 6. состояние интерфейса ============ */
var ui={
  panel:null, filters:{activity:true,need_offer:true,lost_found:true},
  /* Охват — набор станций, а не одна. Человек живёт между станциями: до одной три квартала,
     до другой один, и рядом бывает станция чужой ветки. Выбирая одну, он терял соседние.
     Пустой набор означает весь город */
  stations:['d_sokol'], homeOpen:false,
  /* «сейчас» или «было»: летопись — не отдельный экран и не профиль района, а то же
     содержимое списка с другим значением времени. У архива нет автора, поэтому и профиля
     у района быть не может */

  /* первая станция набора: по ней центрируется карта и к ней относят пин без своей точки */
  districtId:'d_sokol', feedSort:'time', draft:null, picking:false,
  profileTab:'active', userTab:'active', typing:false, panelCollapsed:false, searchQuery:'',
  /* вкладка сообщений живёт только в памяти сеанса: вернувшись, человек всегда видит «Все»,
     иначе вчерашний фильтр спрятал бы сегодняшнее сообщение */
  msgTab:'all',
  /* поиск и ветка в списке станций живут только в памяти сеанса: это способ добраться
     до станции, а не настройка — вернувшись, человек должен видеть весь список */
  stQuery:'', stFocus:false, msgQuery:'',
  /* карточка пина на телефоне: свёрнута до корешка или раскрыта */
  pinShut:false, pinFull:false
};

/* Раздел «Сообщения» принимает три вида строк. Личная переписка была всегда; групповая
   появляется у активности; системный канал один на человека и закреплён сверху.
   Вид хранится в самой ветке, чтобы список не гадал по составу участников */
/* Ряд вкладок шире панели, и выбранная легко оказывается за краем — особенно после
   перерисовки, которая сбрасывает горизонтальную прокрутку в начало. Двигаем только
   scrollLeft самого ряда: scrollIntoView потащил бы за собой и вертикаль панели */
function scrollTabIntoView(root){
  var t=(root||document).querySelector('.tabs'); if(!t)return;
  var wrap=t.closest('.tabswrap');
  if(wrap){
    /* растворение следит за прокруткой, а не за фактом «ряд шире экрана»: иначе правый
       край оставался размытым и тогда, когда долистали до конца, а левый не появлялся вовсе */
    var edges=function(){
      wrap.classList.toggle('is-start',t.scrollLeft>1);
      wrap.classList.toggle('is-end',t.scrollLeft+t.clientWidth<t.scrollWidth-1);
    };
    edges();
    /* узел подменяется при каждой перерисовке, поэтому слушатель вешаем на свежий */
    t.addEventListener('scroll',edges);
  }
  var on=t.querySelector('.is-on'); if(!on)return;
  var l=on.offsetLeft, r=l+on.offsetWidth;
  if(l-12<t.scrollLeft)t.scrollLeft=Math.max(0,l-12);
  else if(r+12>t.scrollLeft+t.clientWidth)t.scrollLeft=r+12-t.clientWidth;
}
/* Контейнер ищется от содержимого, а не по имени. Имена #panelBody и #detailBody
   уникальны по отдельности, но обозначают одно и то же в разных колонках — и трижды
   подряд код брал левую, когда работал с правой: переписка уводила в конец список чатов,
   поиск станций дублировал окно, подсветка строки терялась */
function scrollChatToEnd(){
  var sc=$('#chatScroll'); if(!sc)return;
  var body=sc.closest('.panel__body'); if(!body)return;
  body.scrollTop=body.scrollHeight;
}
function threadKind(t){return (t&&t.kind)||'direct'}
function sysThread(create){
  for(var i=0;i<db.threads.length;i++){
    var t=db.threads[i];
    if(t.kind==='system'&&t.users.indexOf(db.currentUserId)>=0)return t;
  }
  if(!create)return null;
  var st={id:uid('thr'),kind:'system',pin_id:null,users:[db.currentUserId],created_at:now(),seen_at:now()};
  db.threads.push(st);
  return st;
}
/* Системное сообщение всегда несёт ровно одну кнопку к объекту, о котором оно говорит.
   Без этого правила канал за месяц превращается в текстовую свалку, которую перестают открывать */
/* Заголовок, пояснение и объект хранятся врозь: название пина берётся из obj при отрисовке,
   поэтому оно всегда актуально, а у удалённого пина строка просто исчезает вместо того,
   чтобы врать вчерашним текстом */
function sysNotify(title,text,act,obj,label,ask){
  var st=sysThread(true);
  /* ask помечает уведомление, у которого есть исход: карточка потом сама показывает,
     чем дело кончилось, вместо того чтобы вечно предлагать подтвердить уже прошедшее */
  db.messages.push({id:uid('msg'),thread_id:st.id,author_id:null,title:title||null,text:text,
    act:act||null,obj:obj||null,label:label||null,ask:ask||null,created_at:now()});
  st.seen_at=Math.min(st.seen_at||0,now()-1);
  save();
}
function threadOf(pinId,otherId){
  for(var i=0;i<db.threads.length;i++){
    var t=db.threads[i];
    /* групповая ветка тоже привязана к пину и содержит обоих — без проверки вида
       «написать автору» открывало бы общий чат участников */
    if(threadKind(t)!=='direct')continue;
    if(t.pin_id===pinId&&t.users.indexOf(otherId)>=0&&t.users.indexOf(db.currentUserId)>=0)return t;
  }
  return null;
}
/* Групповой чат заводится при первом участнике, а не при создании пина: пустой чат
   выглядит грустно. Автор в нём с самого начала */
function groupThread(pinId){
  for(var i=0;i<db.threads.length;i++)
    if(threadKind(db.threads[i])==='group'&&db.threads[i].pin_id===pinId)return db.threads[i];
  return null;
}
/* Общий чат заводится у встреч и у пропаж. У пропажи он и есть механика поиска: «видел
   рыжего у четырнадцатого дома двадцать минут назад» — это точка и время, полезные всем
   ищущим, а не одному хозяину. Из двух таких сообщений складывается направление,
   а в личных переписках второй человек не знает, что видел первый.
   У находки наоборот — только лично: «это моя варежка» есть заявление о собственности,
   и опознание идёт вопросами, ответы на которые знает только хозяин. В общем чате первый
   же ответ прочитают все, и вещь достанется тому, кто быстрее написал */
function groupKind(p){
  if(!p)return false;
  if(isAct(p))return true;
  return p.type==='lost_found'&&p.subtype==='lost';
}
function ensureGroup(p){
  if(!p||!groupKind(p))return null;
  var t=groupThread(p.id);
  if(t)return t;
  t={id:uid('thr'),kind:'group',pin_id:p.id,users:[p.author_id],created_at:now(),seen_at:now()};
  db.threads.push(t);
  return t;
}
/* Состав общего чата не хранится, а выводится из самого события. Раньше у переписки был
   свой массив users, который наполняли по ходу — кого добавили, да кто заговорил, — и он
   расходился со списком участников: карточка показывала «7 из 10», шапка чата «4 участника».
   Теперь источник один, и разойтись нечему. У личных переписок users остаётся: там он
   и есть состав */
/* Чат называется по тому, чему принадлежит: «Чат встречи» и «Чат поиска». Прежнее
   «Чат участников» у пропажи звучало прямо неверно — там не участники, а ищущие */
function groupName(p){return (p&&!isAct(p))?'Чат поиска':'Чат встречи'}
function threadMembers(t){
  if(!t)return [];
  if(threadKind(t)!=='group')return t.users||[];
  var p=pin(t.pin_id);
  if(p&&!isAct(p)){
    /* у пропажи состав — автор и все, кто отозвался: списка участников тут нет,
       и быть не может, поиск не набирают по местам */
    var out=[p.author_id];
    db.responses.forEach(function(r){
      if(r.pin_id===p.id&&out.indexOf(r.user_id)<0)out.push(r.user_id);
    });
    return out;
  }
  return joinedOf(t.pin_id).map(function(r){return r.user_id});
}
/* Писать лично можно тому, кто уже высказался в общем чате: участие в разговоре и есть
   согласие на личный контакт. Молчавшего не потревожат, а нашедший сам решает, когда
   открыться — пока он не написал, его нет. Зато написавшему уже можно ответить лично,
   и «он у меня» не превращается в тупик, если человек ушёл спать */
function spokeInThread(t,userId){
  if(!t)return false;
  for(var i=0;i<db.messages.length;i++)
    if(db.messages[i].thread_id===t.id&&db.messages[i].author_id===userId)return true;
  return false;
}
function inThread(t,userId){return threadMembers(t).indexOf(userId)>=0}
function groupAdd(p,userId){
  var t=ensureGroup(p); if(!t)return null;
  if(t.users.indexOf(userId)<0)t.users.push(userId);
  return t;
}
/* Пополнение состава видно тем, кто уже внутри: иначе в чате вдруг появляется незнакомое
   имя. Это не сообщение — его никто не писал, отвечать на него не нужно, и непрочитанным
   оно не считается. Поэтому и выглядит иначе: плашка по центру, а не пузырёк */
function groupNote(t,text,at){
  if(!t)return;
  db.messages.push({id:uid('msg'),thread_id:t.id,author_id:null,sys:true,text:text,created_at:at||now()});
}
function joinNote(t,userId){
  if(!t)return;
  var u=user(userId);
  /* «присоединилась» требует знать род, а он у нас нигде не записан. «в списке участников»
     обходится без него и повторяет формулировку, которую человек уже видел в подсказке */
  groupNote(t,(userId===db.currentUserId?'Вы':(u?u.name:'Сосед'))+' в списке участников');
}
/* groupRemove больше нет: с тех пор как состав общего чата выводится из самого события,
   снятый отклик убирает человека и из разговора сам. Функция осталась бы притворством —
   правила она уже ни на что не влияла. Написанное вышедшим остаётся: удаление реплик
   сделало бы разговор нечитаемым для тех, кто остался */
/* Автор считается участником наравне со всеми: он на свою встречу идёт. Отдельной записи
   об этом нет и быть не должно — он стоит первым в списке и входит в лимит мест, поэтому
   «0 из 10 участников» в карточке больше не встречается */
function joinedOf(pinId){
  var p=pin(pinId), out=[];
  if(p&&isAct(p))out.push({id:'own_'+pinId,pin_id:pinId,user_id:p.author_id,status:'joined',
    created_at:p.created_at,author:true});
  return out.concat(db.responses.filter(function(r){return r.pin_id===pinId&&r.status!=='interested'}));
}
function pendingOf(pinId){
  return db.responses.filter(function(r){return r.pin_id===pinId&&r.status==='interested'});
}
function ensureThread(pinId,otherId){
  var t=threadOf(pinId,otherId);
  if(t)return t;
  t={id:uid('thr'),pin_id:pinId,users:[db.currentUserId,otherId],created_at:now(),seen_at:now()};
  db.threads.push(t); save(); return t;
}
function messagesOf(threadId){
  return db.messages.filter(function(m){return m.thread_id===threadId})
    .sort(function(a,b){return a.created_at-b.created_at});
}
function lastMessage(threadId){var m=messagesOf(threadId);return m.length?m[m.length-1]:null}
function threadUnread(t){
  var all=messagesOf(t.id), m=null;
  for(var i=all.length-1;i>=0;i--)if(!all[i].sys){m=all[i];break}
  return !!(m&&m.author_id!==db.currentUserId&&m.created_at>(t.seen_at||0));
}
function unreadTotal(){
  return db.threads.filter(function(t){
    return threadKind(t)!=='system'&&threadVisible(t)&&inThread(t,db.currentUserId)&&threadUnread(t);
  }).length;
}
function sysUnread(){
  var st=sysThread(false);
  return !!(st&&threadUnread(st));
}
function otherUser(t){
  if(!t||threadKind(t)==='system')return null;
  var id=t.users[0]===db.currentUserId?t.users[1]:t.users[0];
  return user(id);
}
