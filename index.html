/* ============ 7.5 точка отсчёта расстояния ============ */
function hashStr(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
/* Расстояние считаем от пина до его собственной станции. Это определено для любого пина
   независимо от того, где вы сейчас и какой охват выбран, и одинаково работает в районном
   списке и в общегородском — общей точки отсчёта для города не существует */
function geoOn(){var m=me();return !!(m&&m.geo)}
/* Карта здесь выдуманная, поэтому настоящие координаты браузера к ней не приложить.
   Разрешение мы всё равно спрашиваем — так виден сам сценарий, — а точку берём устойчивую,
   выведенную из идентификатора: она не скачет между запусками и лежит рядом с вашей станцией */
function meRef(){
  var m=me(), d=district((m&&m.district_id)||ui.districtId), k=(m?m.id:'anon');
  return {x:d.sx+(hashStr(k+'gx')%420)-210, y:d.sy+(hashStr(k+'gy')%420)-210};
}
function pinDistUnits(p){
  if(!p||p.x==null)return null;
  var r=geoOn()?meRef():metroRef(p.district_id);
  return Math.sqrt(Math.pow(p.x-r.x,2)+Math.pow(p.y-r.y,2));
}
/* Точка отсчёта подписывается всегда. Без подписи «7 минут пешком» читается как «от меня» —
   это единственная интерпретация, которая приходит человеку в голову, и она была бы ложной */
function distChipHTML(p,u,showStation){
  if(u==null)return '';
  var pd=district(p.district_id);
  var dot='';
  if(geoOn())return icon('walk')+H(walkText(p,u))+' от вас';
  /* стрелка вместо предлога: она короче слова «до» и прямо говорит, что число — путь
     к названной станции, а не расстояние от читателя */
  return icon('walk')+H(walkText(p,u))+(showStation?' → '+stationTag(p.district_id):'');
}
/* Время пешком информативнее метров: человек планирует минутами. Прямую линию умножаем на
   коэффициент обхода — ходят по улицам, а не насквозь, — и делим на скорость шага */
var WALK_DETOUR=1.3, WALK_MPM=83;
function walkMin(m){return Math.max(1,Math.round(m*WALK_DETOUR/WALK_MPM))}
var NICE_MIN=[1,2,3,5,7,10,15,20,30,45,60];
function niceUpMin(m){
  for(var i=0;i<NICE_MIN.length;i++)if(m<=NICE_MIN[i])return NICE_MIN[i]+' мин';
  return 'больше часа';
}
/* пин без точки не участвует в сортировке по близости — уводим его в конец списка,
   иначе он оказался бы первым как «нулевое расстояние» */
function distKey(p){return p._d==null?Infinity:p._d}
/* «Скоро» отвечает на вопрос «во что я ещё успею», поэтому начавшееся не может стоять выше
   предстоящего: раньше ключом был просто старт по возрастанию, и самое давнее начавшееся
   оказывалось первым в списке — с подписью «уже прошло». Три группы: впереди предстоящие
   по возрастанию, под ними идущие сейчас (позже начавшееся выше — в него ещё войдёшь),
   в конце то, у чего старта нет вовсе, по свежести */
function soonKey(p){return isAct(p)?(p.starts_at>=now()?0:1):2}
function bySoon(a,b){
  var ka=soonKey(a), kb=soonKey(b);
  if(ka!==kb)return ka-kb;
  if(ka===0)return a.starts_at-b.starts_at;
  if(ka===1)return b.starts_at-a.starts_at;
  return b.created_at-a.created_at;
}
function walkText(p,u){
  var m=u*METERS_PER_UNIT;
  return (p&&p.type==='need_offer')?'<'+niceUpMin(walkMin(m+FUZZ_M)):'~'+walkMin(m)+' мин';
}

/* ============ 8. лента ============ */
function feedList(){
  var list=db.pins.filter(function(p){
    return p.status==='active'&&!hiddenForMe(p)&&ui.filters[p.type]&&inScope(p);
  });
  list.forEach(function(p){p._d=pinDistUnits(p)});
  /* Тот же набор ключей, что и в городском списке: раньше здесь была своя формула,
     смешивавшая старт встречи с публикацией вещи, и порядок нельзя было объяснить словами */
  if(ui.feedSort==='near')list.sort(function(a,b){return distKey(a)-distKey(b)});
  else if(ui.feedSort==='soon')list.sort(bySoon);
  else list.sort(function(a,b){return b.created_at-a.created_at});
  return list;
}
/* Одна карточка на список района, ленту и поиск: раньше их было две, и они разошлись —
   в поиске пропадали подтип и автор без всякой причины. Строка чипов, заголовок в две
   строки, время внизу. Свои пины помечены брендовой полосой, как и на карте */
/* withDist включают списки района: расстояние считается от точки отсчёта текущего района,
   и в общегородском поиске было бы посчитано не от того места */
/* открыт ли этот пин во второй колонке — строка списка помечается так же, как карточка */
/* Подсветка строки означает «это открыто рядом», а не «отсюда вы пришли». Поэтому она
   живёт только в списках, которые видны одновременно с карточкой — в ленте и летописи, где
   вторая колонка стоит справа, — и держится, пока событие где-то в цепочке: при переходе
   к участникам или в профиль автора карточка никуда не делась, она под ними.
   В профиле подсветки нет вовсе: там список сам лежит в цепочке, рядом с ним ничего
   не открыто, а выделенная строка читалась бы как «эта чем-то особенная» */
/* Из какого события открыт текущий экран: у карточки это она сама, у переписки и списка
   участников — событие, которому они принадлежат. Нужен, чтобы профиль соседа знал,
   по какому поводу ему писать */
function pinCtxOf(pn){
  var n=0;
  while(pn&&n++<8){
    if(pn.type==='pin'||pn.type==='people')return pn.id;
    if(pn.type==='thread'){
      for(var i=0;i<db.threads.length;i++)if(db.threads[i].id===pn.id)return db.threads[i].pin_id;
    }
    pn=pn.prev;
  }
  return null;
}
function pinOpen(id){
  var p=ui.panel, n=0;
  while(p&&n++<8){
    if(p.type==='pin'&&p.id===id)return true;
    if(p.type==='people'&&p.id===id)return true;
    if(p.type==='thread'){var th=null;
      for(var i=0;i<db.threads.length;i++)if(db.threads[i].id===p.id)th=db.threads[i];
      if(th&&th.pin_id===id)return true;
    }
    p=p.prev;
  }
  return false;
}
function feedCard(p,withDist){
  var act=p.type==='activity';
  var pd=district(p.district_id);

  /* при выбранной станции значок и название метро в каждой карточке повторяли бы шапку
     списка — оставляем их только в общегородском охвате, где станция у каждого пина своя */
  var showStation=(isCity()||ui.stations.length>1);
  var closed=(p.status!=='active');
  /* В архиве расстояние молчит: идти уже некуда. Станция остаётся — где это было,
     факт осмысленный */
  var distPart=(withDist&&!closed&&p._d!=null)?distChipHTML(p,p._d,false):'';
  var stPart=(showStation&&!geoOn())?stationTag(p.district_id):'';
  /* «Участники · 8/10» — одна форма на все места и один разделитель: точка уже принята
     в заголовках разделов и снимает склонение. Согласовать число с существительным здесь
     нельзя: слово должно следовать за пределом, а стоит после текущего числа.
     В архиве предел уже ничего не значит — влезать некуда, остаётся факт, сколько было */
  var sub=act
    ? (function(){var n=joinedOf(p.id).length;
        if(closed)return n?'Участники · '+n:'';
        return 'Участники · '+n+(p.participant_limit?'/'+p.participant_limit:'')})()
    : subLabel(p,closed);
  var role=myRole(p);
  /* открытая карточка помечается в списке: во второй колонке она видна одновременно со списком.
     Подсветка держится, пока событие где-то в цепочке панелей: уход с карточки к участникам
     или в профиль автора её не гасит — список слева всё это время стоит рядом */
  var sel=pinOpen(p.id);
  /* Тег категории отсюда убран: он занимал место в плотной строке, а тип теперь говорит
     вертикальная линия слева. Роль остаётся — она про ваше отношение к событию, а не про тип */
  return '<button class="fcard'+(sel?' is-sel':'')+'" data-pin="'+p.id+'">'+

    '<span class="fcard__main">'+
      '<i class="fcard__rule fcard__rule--'+ptype(p).cls+'"></i>'+
      '<span class="fcard__col">'+
        /* Сверху — когда и какого рода событие, снизу — измеримое: сколько человек,
           сколько идти, от какой станции. Первое нужно, чтобы решить читать ли,
           второе — чтобы решить идти ли. Раньше наверху у встречи стояло «Участники 4/8»,
           а это счётчик мест, ему место внизу рядом с расстоянием */
        /* Прежние две строки, поменянные местами: сверху время с повтором по правому краю,
           снизу чипы. Оформление у обеих то же, что было */
        /* В архиве время — дата закрытия, и у всех типов одной формой. Прежде у встреч там
           стояло «уже прошло», а у вещей и находок — время публикации, то есть внутри одного
           списка соседствовали два разных ответа на вопрос «когда» */
        '<span class="fcard__when"><span>'+
          H(closed?('закрыто '+lowerFirst(agoText(p.closed_at||p.created_at)))
            :(act?(isNow(p)?'идёт сейчас':whenText(p.starts_at,p.repeat)):agoText(p.created_at)))+'</span>'+
          ((act&&!closed&&repeatWord(p))?'<span class="fcard__rep">↻ '+H(repeatWord(p))+'</span>':'')+'</span>'+
        '<span class="fcard__t">'+H(p.title)+'</span>'+
        /* Две строки описания: место в строке было, а карточка молчала — по чипам и
           заголовку не всегда понятно, стоит ли открывать */
        (p.description?'<span class="fcard__d">'+H(p.description)+'</span>':'')+
        /* Каждый чип собирается из содержимого и рисуется, только если оно есть: третий
           состоит из двух необязательных частей, и у события без точки в охвате одной
           станции от него оставалась пустая оболочка.
           Состояния здесь нет: карточка списка живёт ровно в двух местах — домашний список,
           где всё живое, и архив, где всё закрытое. Чип «В архиве» там либо молчал бы всегда,
           либо повторял заголовок раздела на каждой строке. В карточке события он остался:
           её открывают откуда угодно, и там состояние — новость */
        '<span class="fcard__m">'+
          (role?'<span class="chip chip--brand">'+icon('user')+H(role)+'</span>':'')+
          (sub?'<span class="chip chip--muted">'+H(sub)+'</span>':'')+
          ((distPart||stPart)?'<span class="chip chip--muted">'+distPart+stPart+'</span>':'')+
        '</span>'+
      '</span>'+
    '</span>'+
  '</button>';
}
/* Домашний экран: одна поверхность вместо трёх — списка района в панели, «Ленты» на телефоне
   и отдельного поиска. Строка поиска закреплена сверху, охват переключается между районом
   и городом. Расстояние и сортировка по близости есть только в районном охвате: у общего
   городского списка нет точки, от которой их честно считать. */
function homeList(){
  var q=(ui.searchQuery||'').trim().toLowerCase();
  var list;
  if(isCity()){
    list=db.pins.filter(function(p){return p.status==='active'&&!hiddenForMe(p)&&ui.filters[p.type]});
    /* расстояние считается от пина до его собственной станции, поэтому оно осмысленно
       и в городском списке — там просто у каждого пина станция своя */
    list.forEach(function(p){p._d=pinDistUnits(p)});
    if(ui.feedSort==='near')list.sort(function(a,b){return distKey(a)-distKey(b)});
    /* «скоро начнётся»: встречи по дате старта, остальное под ними по свежести —
       у вещи старта нет, и притворяться, что есть, нечестно */
    else if(ui.feedSort==='soon')list.sort(bySoon);
    else list.sort(function(a,b){return b.created_at-a.created_at});
  }else{
    list=feedList();
  }
  if(q)list=list.filter(function(p){
    return p.title.toLowerCase().indexOf(q)>=0||p.description.toLowerCase().indexOf(q)>=0;
  });
  return list;
}
/* Летопись живёт отдельным экраном, а не второй половиной переключателя «сейчас / было».
   Переключатель стоял над каждым списком, забирал строку и прятал сортировку, а нужен
   был раз в сто открытий. Охват у летописи тот же, что у списка: выбрана станция —
   её закрытые пины, выбран город — все */
function archiveList(){
  var q=(ui.searchQuery||'').trim().toLowerCase();
  var list=db.pins.filter(function(p){
    if(p.status==='active'||hiddenForMe(p)||!ui.filters[p.type])return false;

  list.forEach(function(p){p._d=pinDistUnits(p)});
  list.sort(function(a,b){return (b.closed_at||b.created_at)-(a.closed_at||a.created_at)});
  return list;
}

/* ============ 9. панель ============ */
/* Вторая колонка: карточка пина, переписка или фильтр. Список при этом остаётся слева,
   поэтому стрелки «назад» здесь нет — есть крестик, он возвращает первую колонку в то
   состояние, из которого вложенное открыли */
function renderDetail(p){
  var el=$('#panelB'), w=$('#work');
  if(w)w.classList.toggle('has-detail',!!p);
  if(!el)return;
  if(!p){el.hidden=true; el.innerHTML=''; return}
  var v=viewFor(p);
  if(!v){el.hidden=true; el.innerHTML=''; return}
  el.hidden=false;
  var head=v.head||('<div class="chathead">'+
    '<button class="iconbtn" data-act="close-detail" aria-label="Закрыть">'+icon('back')+'</button>'+
    '<span class="chathead__txt" style="padding-left:2px"><span class="chathead__n'+(v.fadeTitle?' chathead__n--fade':'')+'">'+(v.title||'')+'</span>'+
    (v.sub?"<span class=\"chathead__p\">"+(v.subHTML||H(v.sub))+"</span>":"")+'</span>'+(v.action||'')+'</div>');
  if(v.overHead&&head)head='<div class="panelhead--over'+(v.overPhoto?' is-photo':'')+'">'+head+'</div>';
  /* вторая колонка помнит прокрутку так же, как первая, но своей картой: тела у колонок
     устроены одинаково, и общая карта путала бы их положения */
  var dKey=p.type+':'+(p.id||'');
  var dOld=el.querySelector('.panel__body');
  if(dOld&&lastDetailKey)detailScroll[lastDetailKey]=dOld.scrollTop;
  el.innerHTML=head+
    (v.top?'<div class="panel__top">'+v.top+'</div>':'')+
    '<div class="panel__body" id="detailBody">'+v.body+'</div>'+
    (v.foot?'<div class="panel__foot">'+v.foot+'</div>':'');
  var dNew=$('#detailBody');
  if(dNew)dNew.scrollTop=detailScroll[dKey]||0;
  lastDetailKey=dKey;
  bindFadeTitle(el,dNew,v.fadeTitle);
  fixHang(el);
  if(v.after)v.after();
}
/* Название в шапке проявляется, когда обложка уехала вверх — порог чуть меньше её высоты.
   Слушатель вешается на свежий узел тела при каждой перерисовке, старый уходит вместе с ним */
function bindFadeTitle(root,bodyEl,on){
  if(!root)return;
  root.classList.remove('is-scrolled');
  if(!on||!bodyEl)return;
  var upd=function(){root.classList.toggle('is-scrolled',bodyEl.scrollTop>96)};
  bodyEl.addEventListener('scroll',upd);
  upd();
}
function sheetScrim(on,home){
  var sc=$('#sheetScrim'); if(!sc)return;
  sc.classList.toggle('is-on',!!on);
  sc.classList.toggle('sheet-scrim--home',!!home);
}
/* Закрытия у нас не было вовсе: панель меняла состояние и исчезала в тот же кадр.
   У смахивания это скрадывалось тем, что палец сам утянул шторку вниз, но на отпускании
   она тоже пропадала, а не доезжала. Теперь уезжает — и только потом меняется состояние.
   Вниз уходит лишь то, что закрывается совсем; возврат на предыдущий экран едет
   горизонтально, и складывать два движения не нужно */
var sheetClosing=false;
function closeSheetAnim(then){
  var pn=$('#panel');
  if(sheetClosing){then();return}
  if(isDesktopPanel()||!pn||pn.hidden||reduceMotion()){then();return}
  sheetClosing=true;
  pn.style.transition='transform .22s ease';
  pn.style.transform='translateY(100%)';
  setTimeout(function(){
    pn.style.transition=''; pn.style.transform='';
    sheetClosing=false; then();
  },220);
}
/* ключ забываем вместе с панелью: он держит позицию прокрутки, и без сброса карточка,
   открытая во второй раз, показывалась с того места, где её оставили в первый */
function closePanel(){
  closeSheetAnim(function(){ui.panel=null;lastPanelKey=null;render()});
}
/* любая команда, меняющая содержимое панели, разворачивает её обратно:
   свернуть панель можно только самой кнопкой сворачивания */
function expandPanel(){
  if(!ui.panelCollapsed)return;
  ui.panelCollapsed=false;
  var w=$('#work'); if(w)w.classList.remove('is-collapsed');
}
function openPanel(p){
  /* уходя с экрана создания, черновик выбрасываем: его маркер иначе остаётся на карте
     во всех разделах, а вернуться к нему всё равно нельзя — «Создать» начинает заново */
  if(ui.draft&&!(p&&(p.type==='create'||p.type==='edit'))){ui.draft=null;ui.pickPaused=false}
  ui.panel=p;expandPanel();render();
}

/* десктоп: панель всегда на виду, по умолчанию (когда ничего не выбрано) в ней список пинов —
   так же, как в Яндекс/Google Картах. На мобильном без изменений: нет выбора — панели нет,
   список показывает отдельный полноэкранный вид «Лента» внутри секции «Карта». */
function isDesktopPanel(){return window.innerWidth>820}
 var lastPanelKey=null;
/* положение прокрутки по ключу экрана: живёт в памяти сессии, у каждой колонки своё —
   #panelBody и #detailBody означают одно и то же в разных колонках, и путать их нельзя */
var panelScroll={}, detailScroll={}, lastDetailKey=null;
/* последнее нарисованное положение каждого тумблера — чтобы было из чего анимировать */
var switchPrev={};
/* Переход между разделами едет вбок, как между папками в телеграме. Панель
   перерисовывается целиком, поэтому вести один узел из состояния в состояние нечего:
   снимаем прежнюю разметку в слой поверх и пускаем оба навстречу. Направление берём
   из порядка вкладок — уходим правее, новое приходит справа */
var NAV_ORDER=['map','create','chats','profile'];
var slideDir=0;
function navIndex(n){var i=NAV_ORDER.indexOf(n);return i<0?0:i}
/* Тот же приём, что и у разделов, но для вкладок внутри раздела: едет только список,
   а полоса вкладок остаётся на месте — иначе уезжает и то, по чему переключают.
   Поэтому снимок кладётся не поверх всей панели, а внутрь обёртки вокруг списка */
function areaSlide(area,dir,oldHTML){
  var wrap=area.parentNode; if(!wrap)return;
  var g=document.createElement('div');
  g.className='swghost'; g.innerHTML=oldHTML;
  var ided=g.querySelectorAll('[id]'), i;
  for(i=0;i<ided.length;i++)ided[i].removeAttribute('id');
  wrap.appendChild(g);
  area.style.transition='none'; area.style.transform='translateX('+(dir*100)+'%)';
  g.style.transition='none'; g.style.transform='translateX(0)';
  void wrap.offsetWidth;
  var E='transform .24s cubic-bezier(.2,.7,.3,1)';
  area.style.transition=E; area.style.transform='';
  g.style.transition=E; g.style.transform='translateX('+(-dir*100)+'%)';
  setTimeout(function(){
    if(g.parentNode)g.parentNode.removeChild(g);
    area.style.transition=''; area.style.transform='';
  },260);
}
/* Блок, меняющий высоту от действия внутри себя, раскрывается движением, а не рывком.
   Панель перерисовывается целиком, поэтому анимировать приходится вокруг перерисовки:
   открытие — после неё, от нулевой высоты к своей; закрытие — до неё, иначе мерить
   будет уже нечего. Высота явная, а не max-height: с неизвестным содержимым тот едет
   рывками — сначала быстро, потом стоит */
function revealOpen(el){
  if(!el||reduceMotion())return;
  var h=el.scrollHeight;
  el.style.overflow='hidden'; el.style.transition='none'; el.style.height='0px';
  void el.offsetHeight;
  el.style.transition='height .22s ease';
  el.style.height=h+'px';
  setTimeout(function(){el.style.height='';el.style.overflow='';el.style.transition=''},240);
}
function revealClose(el,then){
  if(!el||reduceMotion()){then();return}
  el.style.overflow='hidden'; el.style.transition='none'; el.style.height=el.scrollHeight+'px';
  void el.offsetHeight;
  el.style.transition='height .22s ease';
  el.style.height='0px';
  setTimeout(then,220);
}
/* Какие блоки раскрывались в прошлую отрисовку. Появившийся с прошлого раза — раскрываем;
   так не приходится подключать анимацию в каждом месте руками */
var revealSeen={};
function playReveals(root){
  var next={};
  $$('[data-reveal]',root).forEach(function(n){
    var k=n.getAttribute('data-reveal');
    next[k]=1;
    if(!revealSeen[k])revealOpen(n);
  });
  revealSeen=next;
}
/* переключение вкладки: снимок делается до перерисовки, разъезд — сразу после неё */
function tabSwitch(setter,dir){
  var old=$('#swArea'), oldHTML=old?old.innerHTML:null;
  setter();
  render();
  var neu=$('#swArea');
  if(oldHTML&&neu&&!reduceMotion())areaSlide(neu,dir,oldHTML);
}
function panelSlide(el,dir,oldHTML,oldScroll){
  var g=document.createElement('div');
  g.className='panel__ghost';
  g.innerHTML=oldHTML;
  /* у снимка снимаем идентификаторы: на время перехода в документе оказался бы
     второй #panelBody, и всё, что его ищет, находило бы копию */
  var ided=g.querySelectorAll('[id]'), i;
  for(i=0;i<ided.length;i++)ided[i].removeAttribute('id');
  var gb=g.querySelector('.panel__body'); if(gb)gb.scrollTop=oldScroll;
  var kids=[];
  for(i=0;i<el.children.length;i++)kids.push(el.children[i]);
  el.appendChild(g);
  kids.forEach(function(n){n.style.transition='none'; n.style.transform='translateX('+(dir*100)+'%)'});
  g.style.transition='none'; g.style.transform='translateX(0)';
  void el.offsetWidth;
  var E='transform .24s cubic-bezier(.2,.7,.3,1)';
  kids.forEach(function(n){n.style.transition=E; n.style.transform=''});
  g.style.transition=E; g.style.transform='translateX('+(-dir*100)+'%)';
  setTimeout(function(){
    if(g.parentNode)g.parentNode.removeChild(g);
    kids.forEach(function(n){n.style.transition=''; n.style.transform=''});
  },260);
}
/* где вы были в каждой вкладке. Владельца определяем отмоткой цепочки до верхнего экрана:
   вложенное принадлежит той вкладке, из которой открыто */
var tabState={map:null,chats:null,profile:null};
function tabOf(p){
  var top=parentOf(p);
  return top?(TOP_PANELS[top.type]?top.type:'map'):'map';
}
function tabSave(){
  if(ui.panel&&ui.panel.type==='create')return;
  var t=tabOf(ui.panel);
  /* запоминаем не только экран, но и состояние шторки: иначе возврат на карту складывал
     раскрытый список, хотя вы его не складывали */
  if(t!=='create')tabState[t]={panel:ui.panel,homeOpen:ui.homeOpen,pinShut:ui.pinShut,pinFull:ui.pinFull};
}
/* Две колонки включаются, только когда они не съедают больше половины экрана */
function isTwoCol(){return window.innerWidth>=1440}
/* Перечисляем верхнеуровневые экраны, а не вложенные. Список вложенных приходилось
   пополнять руками при каждом новом экране, и забытый тип забирал левую колонку, закрывая
   то, откуда его открыли. Теперь всё, что не пришло из таббара, вложенное по умолчанию */
var TOP_PANELS={create:1,chats:1,profile:1};
function isDetailPanel(p){return !!p&&!TOP_PANELS[p.type]}
/* шаг назад по цепочке «откуда открыли»: им пользуется крестик второй колонки */
function oneUp(p){
  if(!p)return null;
  if(p.type==='pin')return (p.origin&&p.origin.type!=='list')?p.origin:null;
  /* Переписка помнит, откуда её открыли: канал уведомлений — из профиля, разговор с
     автором — из карточки пина. Раньше отсюда всегда возвращались в «Сообщения», и канал,
     открытый из профиля, ставил в левую колонку список чатов */
  if(p.type==='thread'){
    /* Сначала — панель, из которой переписку открыли: категории `from` знают только две
       дороги, и переписка, заведённая из профиля соседа, уходила по ним в карточку события.
       Категории остаются запасным путём для случаев, где панели не было: тост, уведомление */
    if(p.prev)return p.prev;
    if(p.from==='profile')return {type:'profile'};
    if(p.from==='pin'){
      for(var ti=0;ti<db.threads.length;ti++)
        if(db.threads[ti].id===p.id&&db.threads[ti].pin_id)return {type:'pin',id:db.threads[ti].pin_id};
    }
    return {type:'chats'};
  }
  if(p.type==='scope')return p.prev||null;
  if(p.type==='settings')return {type:'profile'};
  return p.prev||null;
}
/* что показывать в первой колонке: отматываем цепочку до списка. Одного шага мало —
   открыв фильтр поверх карточки, мы получали в первой колонке карточку, то есть два
   вложенных экрана рядом и ни одного списка */
/* Цепочка «откуда открыли» бывает длиннее шести шагов — пин, участники, профиль соседа,
   его пин, снова участники. Раньше цикл выходил по счётчику и возвращал вложенный экран,
   и в левой колонке оказывались две карточки рядом. Теперь при недоходе там просто дом:
   запрещаем само состояние, а не ловим каждый путь к нему */
function parentOf(p){
  var g=0;
  while(p&&isDetailPanel(p)&&g++<8)p=oneUp(p);
  return isDetailPanel(p)?null:p;
}
/* пустого состояния больше нет: без выбранного пина панель показывает домашний экран —
   карту со списком. На телефоне он же и есть свёрнутая шторка поиска над таббаром */
function viewFor(p){
  if(!p)return viewHome();
  switch(p.type){
    case 'pin': return viewPin(p.id);
    case 'create': return viewCreate();
    case 'profile': return viewProfile();
    case 'chats': return viewChats();
    case 'thread': return viewThread(p.id);
    case 'scope': return viewScope();

    case 'user': return viewUser(p.id,p.pinctx);
    case 'people': return viewPeople(p.id);
    case 'archive': return viewArchive();
    case 'settings': return viewSettings();
    case 'edit': return viewEdit(p.id);
  }
  return null;
}
function renderPanel(){
  var el=$('#panel');
  var twoCol=isTwoCol()&&isDesktopPanel();
  var detail=(twoCol&&isDetailPanel(ui.panel))?ui.panel:null;
  var main=detail?parentOf(ui.panel):ui.panel;
  renderDetail(detail);
  var v=viewFor(main);
  if(!v){el.hidden=true;el.innerHTML='';sheetScrim(false);lastPanelKey=null;
    var a0=$('#app'); if(a0)a0.classList.remove('is-homeopen'); return}
  /* Шторка анимируется только когда двигается внутри одного и того же экрана: раскрытие,
     складывание, перетаскивание. Смена экрана рисуется сразу на месте — иначе переход
     с профиля на карту проигрывал переезд шторки вниз, хотя ничего не двигалось,
     и это читалось как «что-то обновилось» */
  var key=(main?main.type+':'+(main.id||''):'list')+':'+(ui.draft?ui.draft.step:'')+':'+ui.profileTab;
  var sameScreen=(key===lastPanelKey);
  if(!sameScreen)el.style.transition='none';
  el.hidden=false;
  el.classList.toggle('is-section',!!v.section);
  el.classList.toggle('is-tall',!!v.tall);
  /* шторка-экран: карта для неё фон, поэтому верхний край один и тот же — сто пикселей
     карты сверху. Раньше домашняя стояла жёстко, фильтр вставал по содержимому, а создание
     по-разному на первом шаге и на остальных, и при переходах край прыгал */
  el.classList.toggle('is-screen',!!v.screen&&!isDesktopPanel());
  var homeSheet=!!v.home&&!isDesktopPanel();
  var pinSheet=!isDesktopPanel()&&!!main&&main.type==='pin';
  el.classList.toggle('is-home',homeSheet);
  el.classList.toggle('is-pin',pinSheet);
  el.classList.toggle('is-shut',(homeSheet&&!ui.homeOpen)||(pinSheet&&ui.pinShut));
  el.classList.toggle('is-full',pinSheet&&!ui.pinShut&&!!ui.pinFull);
  /* таббар уходит только в переписке — остальные вложенные экраны у нас шторки
     поверх карты, они не «проваливаются», а наезжают */
  var inChat=!!main&&main.type==='thread'&&!isDesktopPanel();
  el.classList.toggle('is-chat',inChat);
  var apc=$('#app'); if(apc)apc.classList.toggle('is-chat',inChat);
  /* кнопка фильтра над картой прячется ровно тогда, когда она же выехала внутрь шторки */
  var app=$('#app'); if(app)app.classList.toggle('is-homeopen',homeSheet&&ui.homeOpen);
  /* смахивать вниз можно шторки, но не разделы и не создание: там легко потерять
     заполненную форму случайным жестом. У карточки пина свой жест на три положения */
  var swipeable=!isDesktopPanel()&&!v.home&&!v.section&&!pinSheet&&!(main&&main.type==='create');
  el.classList.toggle('is-swipe',swipeable);
  /* затемнение только под мобильными шторками: разделы живут над таббаром и фон не гасят */
  /* на шаге выбора места затемнения нет: под шторкой лежит карта, которую двигают */
  /* у дома затемнение появляется только в развёрнутом виде: свёрнутый — часть карты */
  if(homeSheet)sheetScrim(ui.homeOpen,true);
  /* у свёрнутой карточки затемнения нет: под ней карта, ради которой её и свернули */
  else if(pinSheet)sheetScrim(!ui.pinShut,true);
  else sheetScrim(!v.section&&!isDesktopPanel()&&!ui.picking,false);
  /* переписка приносит собственную шапку (v.head). Остальным видам шапка нужна только на
     мобильном: на десктопе заголовок дублировал то, что и так видно на экране — район в кнопке
     над картой, раздел в меню, название пина в самой карточке */
  var head=v.head||'';
  /* у домашней шторки шапки нет: в свёрнутом виде наружу торчит её верх, и там должна
     быть строка поиска, а не заголовок с крестиком */
  /* Шапка у всех экранов одна: та же высота, содержимое слева, выход — стрелка назад.
     Крестика больше нет: каждый вложенный экран знает, откуда его открыли, и выход из него
     это возврат, а не закрытие. У разделов («Чаты», «Профиль») возвращаться некуда,
     поэтому там только заголовок. На десктопе шапка появляется лишь у экранов с возвратом —
     у разделов она дублировала бы пункт меню */
  var hasBack=!!v.back||(!v.home&&!v.section);
  if(!head&&!v.home&&(hasBack||!isDesktopPanel())){
    /* по центру только на телефоне: на десктопе шапка есть лишь у вложенных экранов
       в узкой колонке, и центрированное название там оторвалось бы от стрелки */
    var ctr=!isDesktopPanel();
    var txt='<span class="chathead__txt"'+(ctr?'':' style="padding-left:'+(hasBack?'2':'8')+'px"')+'>'+
        '<span class="chathead__n'+(v.fadeTitle?' chathead__n--fade':'')+'">'+v.title+'</span>'+
        (v.sub?"<span class=\"chathead__p\">"+(v.subHTML||H(v.sub))+"</span>":"")+
      '</span>';
    var bk=hasBack?'<button class="iconbtn" data-act="back" aria-label="Назад">'+icon('back')+'</button>':'';
    head=ctr
      ? '<div class="chathead chathead--center">'+
          '<span class="chathead__side">'+bk+'</span>'+txt+
          '<span class="chathead__side chathead__side--r">'+(v.action||'')+'</span></div>'
      : '<div class="chathead">'+bk+txt+(v.action||'')+'</div>';
  }
  /* прокрутку тела сохраняем, пока показывается тот же экран: без этого любой выбор внутри
     шага перерисовывал содержимое и список прыгал к началу, как по якорной ссылке */
  if(!sameScreen){void el.offsetWidth; el.style.transition=''}
  var oldBody=$('#panelBody');
  var keepScroll=oldBody?oldBody.scrollTop:0;
  /* Прокрутку помнит не только текущий экран: ушли в переписку, вернулись — список
     начинался сверху, потому что положение возвращалось лишь при совпадении ключа.
     Теперь уходящий ключ своё положение оставляет, приходящий забирает своё */
  if(oldBody&&lastPanelKey)panelScroll[lastPanelKey]=oldBody.scrollTop;
  /* снимок делаем до подмены разметки, иначе снимать будет уже нечего */
  /* на десктопе панель — боковая колонка, а не экран: уезжающее вбок содержимое
     читается так, будто уехала часть интерфейса. Вкладки внутри колонки едут по-прежнему */
  var slideOld=(slideDir&&!isDesktopPanel()&&!reduceMotion()&&el.innerHTML)?el.innerHTML:null;
  var slideWas=slideDir; slideDir=0;
  /* ручка добавляется после сборки шапки: она подсказывает, что шторку можно смахнуть */
  if(swipeable)head='<span class="sheet-grip" data-grip="1" aria-hidden="true"></span>'+head;
  /* у карточки пина ручка лежит внутри плавающей шапки, поверх обложки */
  if(pinSheet)head='<span class="sheet-grip" data-grip="1" aria-hidden="true"></span>'+head;
  /* карточка пина уносит шапку на обложку: там она лежит слоем поверх, а не полосой над */
  if(v.overHead&&head)head='<div class="panelhead--over'+(v.overPhoto?' is-photo':'')+'">'+head+'</div>';
  /* Корешок стоит снаружи плавающей шапки: в свёрнутом виде та скрыта целиком, и всё, что
     внутри неё, скрылось бы вместе с ней. Наружу торчит он, а не обложка — название и
     станция это ровно то, по чему пин узнают, не раскрывая */
  if(pinSheet){
    var pp=pin(main.id), ppd=pp&&district(pp.district_id);
    if(pp)head='<div class="pinpeek"><span class="sheet-grip" data-grip="1" aria-hidden="true"></span>'+
      '<button class="pinpeek__b" data-act="pin-expand">'+
        '<span class="pinpeek__t"><span class="pinpeek__n">'+H(pp.title)+'</span>'+
        '<span class="pinpeek__s">'+stationTag(pp.district_id)+'</span></span>'+icon('chev-up')+'</button></div>'+head;
  }
  el.innerHTML=head+
    (v.top?'<div class="panel__top'+(v.topFlush?' panel__top--flush':'')+'">'+v.top+'</div>':'')+
    '<div class="panel__body" id="panelBody">'+v.body+'</div>'+
    (v.foot?'<div class="panel__foot">'+v.foot+'</div>':'')+
    /* слой поверх содержимого: туда кладут плавающие кнопки, которые должны нависать
       над списком, а не отнимать у него полосу внизу */
    (v.over||'');
  if(slideOld)panelSlide(el,slideWas,slideOld,keepScroll);
  /* Тумблер описан с переходом в CSS, но не анимировался: панель перерисовывается целиком,
     и браузер получает новый узел, уже стоящий в конечном положении. Поэтому рисуем прежнее
     состояние, даём браузеру его увидеть и только потом выставляем текущее — тот же приём,
     что у полосы шагов */
  $$('.switch',el).forEach(function(sw){
    var k=sw.getAttribute('data-act'), on=sw.classList.contains('is-on'), was=switchPrev[k];
    if(was!==undefined&&was!==on){
      sw.classList.toggle('is-on',was);
      void sw.offsetWidth;
      sw.classList.toggle('is-on',on);
    }
    switchPrev[k]=on;
  });
  var newBody=$('#panelBody');
  /* восстанавливаем до v.after(): у переписки свой доводчик, прокручивающий в конец,
     и он должен выигрывать у памяти списка */
  if(newBody)newBody.scrollTop=(key===lastPanelKey)?keepScroll:(panelScroll[key]||0);
  lastPanelKey=key;
  bindFadeTitle(el,newBody,v.fadeTitle);
  fixHang(el);
  playReveals(el);
  if(v.after)v.after();
}

/* ---- карточка пина ---- */
function viewPin(id){
  var p=pin(id);
  if(!p)return {title:'Событие не найдено',body:'<div class="empty">'+icon('pin')+'<b>Событие удалено</b></div>'};
  var au=user(p.author_id), act=p.type==='activity', mine=p.author_id===db.currentUserId;
  var rs=responsesOf(p.id), mr=myResponse(p.id);
  var pd=district(p.district_id);
  var dist=pinDistUnits(p);

  /* Своей кнопки «назад» у обложки больше нет: она появилась в девятой волне, когда у панели
     на десктопе не было шапки, а сейчас дублировала стрелку в шапке шторки */
  /* Состояние ушло с обложки в строку чипов: поверх фотографии плашке нужен жёсткий цвет
     и вторая пара под тёмную тему — расходы ради одного слова, которое к тому же не про
     картинку. Заодно четыре формулировки об одном («Состоялась», «Завершилось», «Закрыто»,
     «В архиве») свелись к одной, а исход переехал в строку фактов, где ему и место:
     чип отвечает «в каком состоянии», факт — «чем закончилось» */
  var closed=(p.status!=='active');
  var cover='<div class="cover cover--'+ptype(p).cls+'">'+
    (p.photos&&p.photos.length?'<img src="'+p.photos[0]+'" alt="">':'<span class="cover__glyph">'+icon(pinGlyph(p))+'</span>')+
  '</div>';

  var metroDot=stationTag(p.district_id);
  /* В архиве расстояние молчит — идти некуда; станция остаётся */
  var geoChip=closed?metroDot:(dist==null?metroDot:distChipHTML(p,dist,true));
  /* Тип и подтип — один чип. Тип называется парой («Услуги и вещи», «Находки и пропажи»),
     а какая сторона — говорил следующий чип: первый ставил вопрос, второй отвечал, и оба
     занимали место. Теперь слово берём у подтипа, а цвет и значок у типа; у встречи подтипа
     нет, там остаётся «Встреча». Везде выходит три чипа: состояние, предмет, место */
  var thing=act?ptype(p).label:(subLabel(p,closed)||ptype(p).label);
  var chips='<div class="metaline">'+
    (closed?'<span class="chip chip--muted">'+icon('archive')+'В архиве</span>':'')+
    '<span class="chip chip--'+ptype(p).cls+'">'+icon(pinGlyph(p))+H(thing)+'</span>'+
    (geoChip?'<span class="chip chip--muted">'+geoChip+'</span>':'')+
  '</div>';

  /* Порядок фактов: когда, где, кто. Число участников ушло из этого списка вниз, к автору:
     участники — люди, а не обстоятельство встречи, и стоять им положено рядом с человеком,
     который её собрал, а не между временем и точкой на карте */
  /* Тело карточки — то, что написал автор. Всё, что сервис говорит или просит лично
     у вас, живёт отдельным слоем: одно место, одно оформление, ниже тела и над кнопками.
     Белое с рамкой, потому что вокруг серые строки содержимого — заливкой отсюда
     не отделиться, она бы слилась со строкой автора и строкой участников */
  var notes=[];
  var facts='';
  if(act){
    /* у закрытого «уже прошло» повторяло бы строку «В архиве с 14 сентября» ниже */
    var rel=isNow(p)?'идёт сейчас':(closed?'':whenRel(p.starts_at)), rep=repeatWord(p);
    var relLine=[rel,rep?'↻ '+rep:''].filter(Boolean).join(' · ');
    facts+='<div class="factrow">'+icon('calendar')+'<div><b>'+H(whenAbs(p.starts_at))+'</b>'+
      (relLine?'<span>'+H(relLine)+'</span>':'')+'</div></div>';
  }else{
    facts+='<div class="factrow">'+icon('clock')+'<div><b>Опубликовано '+H(agoText(p.created_at))+'</b></div></div>';
  }
  /* исход — факт, а не состояние: состояние сказал чип «В архиве» первой строкой */
  if(closed){
    facts+='<div class="factrow">'+icon('archive')+'<div><b>В архиве с '+H(dateFull(p.closed_at||p.created_at))+'</b>'+
      (reasonLabel(p)?'<span>'+H(lowerFirst(reasonLabel(p)))+'</span>':'')+'</div></div>';
  }
  /* расстояние переехало в чип рядом со станцией — там сразу видно, от чего оно считается.
     Здесь остаётся то, что чип сказать не может: что именно означает точка на карте.
     У активности это место встречи, у вещи — приблизительный адрес, у находки — примета
     для опознания, у пропажи — зона поиска. Одна точка, четыре разных смысла */
  var placeTitle, placeNote='';
  if(act){ placeTitle='Точка встречи указана автором'; }
  else if(isLF(p)){
    if(p.x==null){ placeTitle='Место не указано'; placeNote='Автор не знает, где именно'; }
    else if(p.subtype==='lost'){ placeTitle='Зона поиска'+(p.area_radius?' — круг радиусом '+niceUp(p.area_radius):''); placeNote='Где-то здесь потерялось'; }
    else { placeTitle='Найдено здесь'; placeNote='Место помогает узнать свою вещь, приходить сюда не нужно'; }
  }
  else { placeTitle='Точка показана приблизительно'; placeNote='точный адрес — в переписке'; }
  facts+='<div class="factrow">'+icon('pin')+'<div><b>'+H(placeTitle)+'</b>'+
    (placeNote?'<span>'+H(placeNote)+'</span>':'')+'</div></div>';

  /* «без срока» не значит «навсегда»: раз в месяц спрашиваем автора, актуально ли ещё.
     Не подтвердил — пин уходит в архив, откуда возвращается одним нажатием */
  if(mine&&p.status==='active'&&p.term==='open'&&(p.expires_at-now())<7*DAY){
    /* обращения к вам собраны в один блок ниже: в потоке фактов они читались как ещё
       одно свойство события, хотя это разговор сервиса с вами */
    notes.push('<div class="cardnote"><span>Событие уйдёт с карты '+H(dateShort(p.expires_at))+
      ' — ещё актуально?</span>'+
      '<button class="btn btn--line btn--sm" data-act="extend" data-id="'+p.id+'">'+
      icon('check')+'Продлить на месяц</button></div>');
  }

  var photos=(p.photos&&p.photos.length>1)?'<div class="photos">'+p.photos.map(function(src){return '<img src="'+src+'" alt="">'}).join('')+'</div>':'';

  var people='';
  if(act){
    /* Намерение подтверждается не на входе, а перед самой встречей: одобрение автора
       говорит, что автор хочет участника, а не что тот придёт. Не подтвердил — тихо
       выпадает из списка, и место освобождается для другого */
    if(mr&&mr.status!=='interested'&&!mr.confirmed_at&&p.status==='active'&&
       (p.starts_at-now())>CONFIRM_H*HOUR&&(p.starts_at-now())<REMIND_H*HOUR){
      /* Дату отсюда убрали — она стоит строкой выше в той же карточке. Осталось то,
         чего в карточке нет: вопрос и цена молчания */
      notes.push('<div class="cardnote">'+
        '<span><b>Подтвердите участие</b><p>Без ответа место уйдёт другому соседу</p></span>'+
        /* основная кнопка справа — правило проекта, и так же устроены модальные окна */
        '<span class="row">'+
          '<button class="btn btn--line btn--sm" data-act="confirm-no" data-id="'+mr.id+'">Не смогу</button>'+
          '<button class="btn btn--primary btn--sm" data-act="confirm-go" data-id="'+mr.id+'">'+icon('check')+'Иду</button>'+
        '</span></div>');
    }
    var pend=pendingOf(p.id);
    if(mine&&pend.length){
      /* Заявки — не справка, а список дел: он требует действия, значит должен быть на виду,
         и он может расти без предела, значит не может лежать в карточке целиком. Поэтому
         первые три с кнопками, по времени подачи — кто ждёт дольше, того решают раньше, —
         а хвост одной строкой на экран участников, где заявки идут первой группой */
      var shown=pend.slice(0,3), rest=pend.length-shown.length;
      people+='<div class="cardpend"><div class="eyebrow" style="margin-bottom:8px">Заявки · '+pend.length+'</div><div class="people">'+
        shown.map(function(r){
          var u=user(r.user_id);
          return '<div class="person">'+
            '<button class="person__who" data-act="user" data-id="'+H(r.user_id)+'">'+
              avatarHTML(u,'avatar--s')+
              '<span class="person__n">'+H(u?u.name:'Сосед')+'</span>'+icon('chev-right')+
            '</button>'+
            '<span class="row" style="margin-left:auto;gap:8px">'+
              '<button class="btn btn--ghost btn--sm" data-act="accept" data-id="'+r.id+'">Принять</button>'+
              '<button class="iconbtn iconbtn--34" data-act="decline" data-id="'+r.id+'" aria-label="Отклонить">'+icon('close')+'</button>'+
            '</span></div>';
        }).join('')+'</div>'+
        (rest?'<button class="linkbtn" style="margin-top:12px" data-act="people" data-id="'+p.id+'">'+
          'Ещё '+rest+' '+plural(rest,'заявка','заявки','заявок')+'</button>':'')+
      '</div>';
    }
  }

  var author='<button class="author" data-act="user" data-id="'+H(p.author_id)+'">'+avatarHTML(au)+
    '<div class="author__body"><div class="author__n">'+H(au?au.name:'Сосед')+'</div>'+
    /* станция отсюда убрана — она стоит чипом строкой выше; вместо неё то, чего больше нигде
       нет, и что для разговора с незнакомцем важнее всего: как давно человек здесь.
       На своём пине вместо даты стоит принадлежность: про себя эта дата бесполезна */
    '<div class="author__s">'+H(mine?'это вы':joinedText(au))+'</div></div>'+
    icon('chev-right')+
  '</button>';

  /* Участники переехали на свой экран: тридцать человек в карточке пролистать нельзя,
     а число мест видно и отсюда. Вход — вся строка целиком, шеврон только это подсказывает */
  var partBtn='';
  if(act){
    var n=joinedOf(p.id).length, lim=p.participant_limit;
    var full=lim&&n>=lim&&!(mr&&mr.status!=='interested');
    /* На активности по заявкам список — круг уже собравшихся, и посторонним он не нужен:
       до решения автора вы им не стали. Число мест при этом видно всем, иначе не понять,
       есть ли смысл подавать заявку */
    /* Закрытое событие список не показывает посторонним: полный список чужих контактов
       публично мы не показываем нигде — в профиле участие соседа не видно вовсе, — а через
       летопись в закрытое событие заходит любой. До встречи список нужен для координации,
       после неё круг сужается до тех, кто в нём был, и автора: они и так знакомы лично */
    var seeList=(!p.approval||mine||(mr&&mr.status!=='interested'))
      &&(!closed||mine||(mr&&mr.status!=='interested'));
    /* «1 из 8 участник» — число и существительное согласовать нельзя: слово должно
       следовать за восьмёркой, а стоит после единицы. Поэтому подпись отделена от числа
       точкой, как на кнопке летописи, и склонение перестаёт существовать */
    var pt=seeList?'button':'div';
    partBtn='<'+pt+' class="author'+(seeList?'':' author--flat')+'"'+
      (seeList?' data-act="people" data-id="'+p.id+'"':'')+'>'+
      '<div class="author__body"><div class="author__n">'+
        (closed?'Участники · '+n:'Участники · '+n+(lim?'/'+lim:''))+'</div>'+
        /* в архиве предел уже ничего не значит: влезать некуда, дорожка и подпись про места
           говорили бы о несуществующем выборе */
        (closed?''
          :(lim?'<div class="progress" style="margin-top:6px"><i style="width:'+Math.min(100,n/lim*100)+'%"></i></div>'
              :'<div class="author__s">без ограничения по числу мест</div>'))+
        /* «мест больше нет» сказано здесь, а не погашенной кнопкой внизу: заблокированная
           кнопка сообщает ровно то же, но выглядит поломкой и занимает место разговора */
        ((full&&!closed)?'<div class="author__s" style="margin-top:6px">мест больше нет</div>':'')+
      '</div>'+(seeList?icon('chev-right'):'')+
    '</'+pt+'>';
  }
  /* Итог передач: отметки ставятся по одной в переписках, а увидеть их разом можно только
     здесь — иначе автору пришлось бы листать все разговоры, чтобы вспомнить, чем кончилось.
     Строкой со списком, а не перечислением через запятую: раздал книги десятерым — и строка
     разъезжалась на три этажа. Тот же приём, что у встречи выше */
  if(mine&&!act){
    var done=db.responses.filter(function(r){return r.pin_id===p.id&&r.settled_at});
    var talking=db.responses.filter(function(r){return r.pin_id===p.id&&!r.settled_at}).length;
    if(done.length||talking)partBtn='<button class="author" data-act="people" data-id="'+p.id+'">'+
      '<div class="author__body"><div class="author__n">'+
        (done.length?(p.type==='lost_found'?'Вернули · ':'Передано · ')+done.length
                    :'Откликнулись · '+talking)+'</div>'+
        (done.length&&talking?'<div class="author__s">ещё пишут: '+talking+'</div>':'')+
      '</div>'+icon('chev-right')+
    '</button>';
  }
  var body=cover+'<div class="pincard">'+chips+
    '<h2>'+H(p.title)+'</h2><p>'+H(p.description)+'</p>'+photos+facts+author+partBtn+people+
    (notes.length?'<div class="cardnotes">'+notes.join('')+'</div>':'')+
  '</div>';

  var foot='';
  if(p.status==='active'){
    var gt=groupThread(p.id);
    var groupBtn=gt?'<button class="btn btn--line" data-act="open-group" data-id="'+p.id+'">'+icon('chat')+groupName(p)+'</button>':'';
    if(mine){
      /* автор в общем чате с самого начала, поэтому кнопка нужна и ему */
      foot=groupBtn+'<div class="row">'+
        '<button class="btn btn--ghost" data-act="close-pin" data-id="'+p.id+'">'+icon('check')+'Завершить'+'</button>'+
        '<button class="btn btn--line" data-act="delete-pin" data-id="'+p.id+'">'+icon('trash')+'Удалить</button></div>';
    }else if(act){
      if(mr&&mr.status==='interested'){
        /* заявка ещё не принята: участником человек не стал и в общий чат не попал */
        foot='<button class="btn btn--ghost" data-act="leave" data-id="'+p.id+'">'+icon('clock')+'Заявка отправлена — отозвать</button>';
      }else if(mr){
        /* участник уже внутри, и главное для него — не выйти, а договориться. Поэтому
           сверху разговор, а отказ ниже и контуром: он нужен редко и промахиваться по нему
           не должно быть легко. Общий чат снимает нужду писать автору лично — вопрос
           «во сколько и что взять» один на всех */
        /* «Не пойду» уехала в меню: внизу карточки она соседствовала с разговором, то есть
           отказ стоял ровно там, куда тянется рука за чатом. Нужен он редко, а промах дорог */
        foot=gt?'<button class="btn btn--primary" data-act="open-group" data-id="'+p.id+'">'+icon('chat')+groupName(p)+'</button>'
               :'<button class="btn btn--primary" data-act="write" data-id="'+p.id+'">'+icon('chat')+'Написать автору</button>';
      }else if(full){
        /* мест нет — но разговор остаётся: кто-то отпишется, или автор возьмёт сверх счёта */
        foot='<button class="btn btn--primary" data-act="write" data-id="'+p.id+'">'+icon('chat')+'Написать автору</button>';
      }else{
        foot='<button class="btn btn--primary" data-act="join" data-id="'+p.id+'">'+
          icon('people')+(p.approval?'Подать заявку':'Участвую')+'</button>';
      }
    }else{
      var t=threadOf(p.id,p.author_id);
      foot=mr||t
        ? '<button class="btn btn--brand" data-act="write" data-id="'+p.id+'">'+icon('chat')+'Открыть переписку</button>'
        : '<button class="btn btn--brand" data-act="respond" data-id="'+p.id+'">'+icon('chat')+
          (groupKind(p)&&!isAct(p)?'Помочь с поиском':'Откликнуться')+'</button>';
    }
  }else{
    foot='<div class="demo-note" style="margin:0">'+icon('archive')+'<span>Событие в архиве района: он больше не показывается на карте, но остаётся в профиле автора и в истории</span></div>'+
      (mine?'<button class="btn btn--line" data-act="reopen" data-id="'+p.id+'">Вернуть на карту</button>':'');
  }
  /* В шапке было «Услуга или вещь · Сокольники» — оба слова дословно повторяли чипы строкой
     ниже. Теперь там название самого пина, и проявляется оно только при прокрутке, когда
     заголовок карточки уехал вверх: в покое шапка пустая, кроме стрелки и меню */
  return {title:H(p.title),fadeTitle:true,overHead:true,overPhoto:!!(p.photos&&p.photos.length),body:body,foot:foot,
    action:'<button class="iconbtn chathead__act" data-act="pin-menu" data-id="'+p.id+'" aria-label="Ещё">'+icon('dots')+'</button>'};
}


/* ---- участники активности ---- */
/* Отдельный экран, а не список внутри карточки: тридцать человек в карточке не пролистать,
   а карточка из-за них уезжала вниз на два экрана. Автор стоит первым — он такой же
   участник, и без него в списке не хватало того, к кому все и пришли */
function viewPeople(id){
  var p=pin(id);
  if(!p)return {title:'Участники',back:true,body:'<div class="empty">'+icon('people')+'<b>Событие удалено</b></div>'};
  var jn=joinedOf(p.id), lim=p.participant_limit, n=jn.length;
  var mine=p.author_id===db.currentUserId;
  /* Число уехало в шапку чипом: строка сводки повторяла заголовок экрана, а полоса
     заполнения нужна на карточке, где решают, идти ли, — здесь решение уже позади */
  function row(r){
    var u=user(r.user_id), tags='';
    if(r.author)tags+='<span class="tag">автор</span>';
    if(r.user_id===db.currentUserId)tags+='<span class="tag">вы</span>';
    /* дата вместо глагола: «получил» и «получила» требуют знать род, которого мы не знаем */
    if(r.settled_at)tags+='<span class="tag">'+H(dateFull(r.settled_at))+'</span>';
    return '<button class="person" data-act="user" data-id="'+H(r.user_id)+'">'+avatarHTML(u,'avatar--s')+
      '<span class="person__n">'+H(u?u.name:'Сосед')+'</span>'+
      (tags?'<span class="person__tags">'+tags+'</span>':'')+
    '</button>';
  }
  function block(list){return '<div class="peoplelist"><div class="people">'+list.map(row).join('')+'</div></div>'}
  function group(ttl,list){
    return list.length?'<div class="eyebrow" style="padding:24px 16px 0">'+ttl+' · '+list.length+'</div>'+block(list):'';
  }
  /* У вещи и находки участников нет — есть отклики, и они делятся тем же приёмом, что
     участники встречи: кому уже передали и кто ещё пишет */
  if(!isAct(p)){
    var rs2=responsesOf(p.id);
    var got=rs2.filter(function(r){return r.settled_at});
    var talk=rs2.filter(function(r){return !r.settled_at});
    return {title:'Отклики',sub:p.title,back:true,
      body:group(p.type==='lost_found'?'Вернули':'Передано',got)+group('Ещё пишут',talk),
      action:'<span class="tag tag--solid chathead__act">'+rs2.length+'</span>'};
  }
  /* Автору два списка — но только когда подтверждение уже спрашивают. До этого срока
     не ответил никто по определению, и деление показало бы беду там, где ничего не случилось.
     Автор считается подтвердившим: он на свою встречу идёт */
  var asking=isAct(p)&&p.status==='active'&&(p.starts_at-now())<REMIND_H*HOUR;
  var body;
  if(mine&&asking){
    var yes=jn.filter(function(r){return r.author||r.confirmed_at});
    var no=jn.filter(function(r){return !r.author&&!r.confirmed_at});
    body=group('Подтвердили',yes)+group('Не ответили',no);
  }else body=block(jn);
  /* Заявки идут первой группой: в карточке их видно три, а решать остальные приходят сюда.
     Кнопки те же, что в карточке, — иначе экран оказался бы витриной без действия */
  if(mine&&p.approval){
    var pend2=pendingOf(p.id);
    if(pend2.length)body='<div class="eyebrow" style="padding:24px 16px 0">Заявки · '+pend2.length+'</div>'+
      '<div class="peoplelist"><div class="people">'+pend2.map(function(r){
        var u2=user(r.user_id);
        return '<div class="person">'+
          '<button class="person__who" data-act="user" data-id="'+H(r.user_id)+'">'+
            avatarHTML(u2,'avatar--s')+'<span class="person__n">'+H(u2?u2.name:'Сосед')+'</span>'+icon('chev-right')+
          '</button>'+
          '<span class="row" style="margin-left:auto;gap:8px">'+
            '<button class="btn btn--ghost btn--sm" data-act="accept" data-id="'+r.id+'">Принять</button>'+
            '<button class="iconbtn iconbtn--34" data-act="decline" data-id="'+r.id+'" aria-label="Отклонить">'+icon('close')+'</button>'+
          '</span></div>';
      }).join('')+'</div></div>'+body;
  }
  return {title:'Участники',sub:p.title,back:true,body:body,
    action:'<span class="tag tag--solid chathead__act">'+n+(p.status==='active'&&lim?'/'+lim:'')+'</span>'};
}

/* ---- создание пина ---- */
/* Событий у одной станции много, и если сажать их всех в её центр, на карте они склеятся
   в один кластер и встанут друг на друге. Разбрасываем по кругу 60–250 метров — тем же
   приёмом, каким разложен демо-набор. Зерно храним в черновике, чтобы точка не прыгала
   при каждой перерисовке */
function scatterNear(did,seed){
  var dd=district(did);
  var a=(hashStr(seed+'a')%3600)/3600*Math.PI*2;
  var r=(60+hashStr(seed+'r')%190)/METERS_PER_UNIT;
  return {x:dd.sx+Math.cos(a)*r, y:dd.sy+Math.sin(a)*r};
}
function newDraft(){
  stepAnimAt=null;
  var t=new Date(now()+DAY);
  /* шаг 1 — место, шаг 2 — тип, шаг 3 — поля. Место первым: район и расстояние берутся
     из точки, а не из подписи над картой */
  /* Точку берём сразу, под прицелом: раньше она появлялась только от первого движения
     карты, и поле станции до тех пор честно писало «Не выбрана», хотя прицел уже
     стоял над вполне определённым местом */
  var c=toWorld(viewCX(),pickCenterY());
  var cx=Math.max(20,Math.min(WORLD_W-20,c[0])), cy=Math.max(20,Math.min(WORLD_H-20,c[1]));
  return {step:1,type:null,title:'',description:'',photos:[],
    date:t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate()),time:'19:00',
    limit:'',approval:false,subtype:'give_away',lfsub:'found',radius:400,noPlace:false,
    repeat:'none',term:'30d',x:cx,y:cy,district_id:districtOf(cx,cy)};
}
/* Возвращает, чего не хватает, — словами. Раньше проверка просто гасила кнопку, и человек
   упирался в неё без объяснений: на находке требовалась фотография, а поле было подписано
   «Фотографии» без всякой пометки. Погашенная кнопка обязана говорить, чего от вас ждут */
function draftMissing(){
  var d=ui.draft; if(!d)return 'Черновик потерялся';
  if(!d.type)return 'Выберите, что публикуете';
  /* у находки и пропажи место необязательно: человек, поднявший зонт по дороге, целиться
     в карту не станет */
  if(d.x==null&&!(d.type==='lost_found'&&d.noPlace))return 'Укажите место на карте';
  if(!d.title||d.title.trim().length<3)return 'Напишите заголовок';
  if(d.type==='activity'&&(!d.date||!d.time))return 'Поставьте дату и время';
  /* Фотография обязательна только у находки: там весь механизм в том, чтобы хозяин узнал
     свою вещь. У пропажи требовать её жестоко — снимка потерянного зонта или ключей почти
     ни у кого нет, а это самый срочный случай */
  if(d.type==='lost_found'&&d.lfsub==='found'&&!d.photos.length)
    return 'Добавьте фотографию — по ней вещь и узнают';
  return null;
}
function draftValid(){return !draftMissing()}
/* «180 м до м. Сокольники · Сокольники» — и расстояние, и район считаются от самой точки */
/* «~180 м до м. Сокольники» — без названия района: у станционных районов оно совпадает
   с названием станции и читалось бы дважды */
function draftMetroText(){
  var d=ui.draft; if(!d||d.x==null)return '';
  var did=d.district_id||ui.districtId, r=metroRef(did);
  var u=Math.sqrt(Math.pow(d.x-r.x,2)+Math.pow(d.y-r.y,2));
  return (d.type==='need_offer'?approxDistText(u):distText(u))+' '+(r.metro?'до м. '+r.name:'до центра района');
}
/* после перехода на станции название района совпадает с названием станции, поэтому
   приписка «· Сокольники» к строке «до м. Сокольники» была чистым дублем */
function draftPlaceText(){return draftMetroText()}
/* то же самое разметкой: вместо «м.» — цветной значок станции. Текстовый вариант остаётся
   для заметки на шаге «Условия», где строка встроена в предложение */
function draftMetroHTML(){
  var d=ui.draft; if(!d||d.x==null)return '';
  var did=d.district_id||ui.districtId, r=metroRef(did), pd=district(did);
  var u=Math.sqrt(Math.pow(d.x-r.x,2)+Math.pow(d.y-r.y,2));
  return stationTag(did)+' '+H(d.type==='need_offer'?approxDistText(u):distText(u));
}
/* на каком шаге полосу прогресса показывали в прошлый раз — чтобы анимация заливки
   играла только при смене шага, а не на каждое действие внутри него */
var stepAnimAt=null;
/* Шаги: место → условия → описание. Раньше на «типе» было одно касание, а на «деталях»
   восемь полей; теперь строгие поля, вытекающие из типа, живут вместе с самим типом,
   а последний шаг — только то, что человек пишет соседям своими словами, и он одинаков
   для активностей и для вещей */
function step2Valid(){
  var d=ui.draft; if(!d||!d.type)return false;
  if(d.type==='activity'&&(!d.date||!d.time))return false;
  return true;
}
/* Срок жизни находки короткий намеренно: человек вернул вещь из рук в руки и о сервисе
   больше не думает — это нормальное поведение, и продукт не должен на него рассчитывать */
var LF_DAYS=14;
/* Оповещение по району — единственная механика, где сервис пишет тому, кто ни на что
   не подписывался. Поэтому лимит на автора в неделю и выключатель в настройках */
var LF_WEEK_LIMIT=3;
function lfThisWeek(userId){
  var t=now();
  return db.pins.filter(function(p){
    return p.type==='lost_found'&&p.author_id===userId&&(t-p.created_at)<7*DAY;
  }).length;
}
function req(){return '<b class="req" aria-hidden="true">*</b>'}
/* Группы полей вынесены отдельно: их показывает и мастер создания, и экран редактирования.
   Держать две копии этой разметки нельзя — ровно так когда-то разошлись две карточки
   списка, и в одной из них молча пропали подтип и автор */
function fldBasic(d,act){
  /* Фотография обязательна только у находки — там весь механизм в том, чтобы хозяин узнал
     свою вещь. И раз обязательна, значит идёт первой: поля выстраиваются так, чтобы человек
     прошёл обязательное подряд, а необязательное осталось после. Иначе получается
     «обязательное — пропускаемое — снова обязательное», и конец требований не угадать */
  var need=(d.type==='lost_found'&&d.lfsub==='found');
  var photos='<div class="field"><label>Фотографии'+(need?req():'')+'</label>'+
      (d.photos.length?'<div class="thumbs">'+d.photos.map(function(src,i){
        return '<div class="thumb"><img src="'+src+'" alt=""><button data-act="rmphoto" data-i="'+i+'" aria-label="Удалить фото">'+icon('close')+'</button></div>';
      }).join('')+'</div>':'')+
      /* пустая зона крупная и зовущая, с первой фотографией сжимается в строку:
         миниатюры над ней уже занимают это место */
      (d.photos.length<3?'<button class="uploader'+(d.photos.length?' uploader--compact':'')+'" data-act="addphoto">'+
        icon('camera')+(d.photos.length?'Добавить ещё':'Добавить фото')+'</button>':'')+
      '<span class="hint">'+(need
        ? 'Без фотографии находку не опознают — она здесь обязательна'
        : 'До трёх штук, хранятся в вашем браузере')+'</span></div>';
  var main='<div class="field"><label for="f-title">Заголовок'+req()+'</label>'+
      '<input class="input" id="f-title" data-field="title" maxlength="80" value="'+H(d.title)+'" placeholder="'+(act?'Футбол 5×5 у прудов':'Отдам детский стульчик')+'">'+
      '<span class="hint">Коротко и по делу — это единственное, что видно на карте</span></div>'+
    '<div class="field"><label for="f-desc">Описание</label>'+
      '<textarea class="textarea" id="f-desc" data-field="description" maxlength="600" placeholder="'+(act?'Что делаем, где собираемся, что взять с собой':'Состояние, размер, когда удобно забрать')+'">'+H(d.description)+'</textarea></div>';
  return need?(photos+main):(main+photos);
}
function fldActivity(d){
  return '<div class="grid2">'+
      '<div class="field"><label for="f-date">Дата'+req()+'</label><input class="input" type="date" id="f-date" data-field="date" value="'+H(d.date)+'"></div>'+
      '<div class="field"><label for="f-time">Время'+req()+'</label><input class="input" type="time" id="f-time" data-field="time" value="'+H(d.time)+'"></div>'+
    '</div>'+
    /* выпадающий список вместо четырёх радиокнопок: на телефоне это системный
       барабан выбора. Пояснения вариантов убраны — они пересказывали сами варианты */
    '<div class="field"><label for="f-repeat">Повтор встречи</label>'+
      '<div class="selectwrap"><select class="select" id="f-repeat" data-field="repeat">'+
        Object.keys(REPEATS).map(function(k){
          return '<option value="'+k+'"'+(d.repeat===k?' selected':'')+'>'+H(REPEATS[k].label)+'</option>';
        }).join('')+
      '</select>'+icon('chev-down','selectwrap__chev')+'</div>'+
      (d.repeat!=='none'?'<span class="hint">Отклики относятся к ближайшей дате: после неё список участников обнуляется</span>':'')+
    '</div>'+
    '<div class="field"><label for="f-limit">Сколько человек нужно</label>'+
      '<input class="input" type="number" min="0" max="99" id="f-limit" data-field="limit" value="'+H(d.limit)+'" placeholder="без ограничения">'+
      '<span class="hint">Оставьте пустым, если мест не считаете</span></div>'+
    /* по умолчанию выключено: одобрение подтверждает, что автор хочет участника,
       а не что тот придёт, зато превращает каждую встречу в закрытый клуб, а автора
       из соседа в вахтёра. Нужно там, где отбор осмыслен: мало мест, свой инвентарь */
    '<div class="switchrow"><span class="switchrow__txt">'+
      '<b>Принимать по заявкам</b>'+
      '<span>Соседи будут проситься, а вы решать — обычно это лишнее</span>'+
    '</span><button class="switch'+(d.approval?' is-on':'')+'" data-act="toggle-approval" role="switch" aria-checked="'+(d.approval?'true':'false')+'" aria-label="Принимать по заявкам"><i></i></button></div>';
}
function fldOffer(d){
  return '<div class="field"><label>Что это</label><div class="opts">'+
      Object.keys(SUBTYPES).map(function(k){
        return '<button class="radio'+(d.subtype===k?' is-on':'')+'" data-subtype="'+k+'">'+
          '<span class="radio__dot"></span><span>'+H(SUBTYPES[k].label)+'<small>'+H(SUBTYPES[k].hint)+'</small></span></button>';
      }).join('')+'</div></div>'+
    '<div class="field"><label>Сколько держать на карте</label><div class="opts">'+
      [['30d','30 дней','Разовое предложение, потом уйдёт в архив'],
       ['open','Без срока','Раз в месяц спросим, актуально ли — одно нажатие продлевает']].map(function(o){
        return '<button class="radio'+(d.term===o[0]?' is-on':'')+'" data-draft="term" data-val="'+o[0]+'">'+
          '<span class="radio__dot"></span><span>'+o[1]+'<small>'+o[2]+'</small></span></button>';
      }).join('')+'</div></div>';
}
function fldLF(d){
  /* Две взаимоисключающие строки с подсказками занимали полэкрана ради одного выбора.
     Сегментед-контрол говорит то же самое одной дорожкой, а подсказка остаётся одна —
     про выбранный вариант. Формулировки безличные: «нашёл» выдало бы род */
  return '<div class="field"><label>Что случилось</label>'+
      '<div class="segctl">'+Object.keys(LF_SUBTYPES).map(function(k){
        return '<button class="'+(d.lfsub===k?'is-on':'')+'" data-draft="lfsub" data-val="'+k+'">'+
          H(LF_SUBTYPES[k].seg)+'</button>';
      }).join('')+'</div>'+
      '<span class="hint">'+H(LF_SUBTYPES[d.lfsub].hint)+'</span></div>'+
    /* у пропажи место — не точка, а область поиска: человек редко знает, где именно
       выронил. Ползунок, а не щипок по карте: щипок занят зумом */
    (d.lfsub==='lost'
      ? '<div class="field"><label for="f-rad">Где примерно потеряли</label>'+
          '<input class="input" type="range" id="f-rad" min="100" max="2000" step="100" data-field="radius" value="'+H(d.radius)+'">'+
          '<span class="hint" id="radHint">Круг радиусом '+H(niceUp(+d.radius))+'. Если шли маршрутом, ставьте по самому дальнему месту — круг покажет всю зону поиска</span></div>'
      : '');
}
function viewCreate(){
  var d=ui.draft, body='', foot='', act=d.type==='activity';
  var STEP_NAMES=['Место','Условия','Описание'];
  /* Отрезки выходят в том состоянии, в каком были на прошлом шаге, а after() выставляет
     состояние текущего: браузер видит разницу ровно в одном отрезке и анимирует только его */
  var filled=(stepAnimAt===null)?0:stepAnimAt;
  var steps='<div class="stepbar">'+[1,2,3].map(function(i){
    return '<button class="stepseg'+(i<=filled?' is-on':'')+(i===d.step?' is-now':'')+'"'+
      ' data-act="step" data-step="'+i+'"'+(i>=d.step?' disabled':'')+'>'+
      '<span class="stepseg__t">'+i+'. '+STEP_NAMES[i-1]+'</span><i></i></button>';
  }).join('')+'</div>';

  if(d.step===1){
    /* Два способа указать место. Карта точна, но требует прицелиться — а человек, который
       отдаёт лампу, часто не хочет называть подъезд и согласен на «рядом со станцией».
       Список станций уже написан для фильтра, поэтому здесь он тот же */
    /* Не два режима, а одно значение с двумя входами. Поле всегда показывает станцию
       текущей точки: двигаете карту — меняется оно, открываете его и выбираете станцию —
       переезжает точка. Переключатель «На карте / По станции» врал, будто это разные
       способы, между которыми надо выбрать заранее */
    /* Одно значение с двумя входами, а не два режима: строка показывает станцию текущей
       точки, а открытая — ищет по станциям. Карта пишет в неё, она двигает карту */
    var curSt=d.district_id||ui.districtId;
    var pq=(d.stQ||'').trim().toLowerCase();
    body+='<div class="pad stack">'+
      '<div class="field"><label>Станция</label>'+
        '<div class="searchfield">'+
          (d.stOpen?icon('search','searchfield__ic')
                   :'<i class="searchfield__dot" style="background:'+district(curSt).lineColor+'"></i>')+
          '<input class="input" id="placeStInput" data-place-open="1" autocomplete="off" placeholder="Найти станцию" value="'+
            H(d.stOpen?(d.stQ||''):district(curSt).name)+'">'+
        '</div>'+
        '<span class="hint">Подведите карту под прицел или выберите станцию</span>'+
      '</div></div>';
    if(d.stOpen){
      var plist=DISTRICTS.filter(function(x){
        return !pq||x.name.toLowerCase().indexOf(pq)>=0||x.sub.toLowerCase().indexOf(pq)>=0;
      });
      body+='<div data-reveal="placelist">'+
        (plist.length?plist.map(function(x){
          return '<button class="districtrow'+((d.placeSt===x.id)?' is-on':'')+'" data-place-st="'+x.id+'">'+
            '<svg class="metro" aria-hidden="true" style="color:'+x.lineColor+'"><use href="#i-metro"/></svg>'+
            '<span style="flex:1;min-width:0"><b>'+H(x.name)+'</b><span>'+H(x.sub)+'</span></span>'+
          '</button>';
        }).join('')
         :'<div class="empty">'+icon('search')+'<b>Станция не нашлась</b></div>')+
        /* точка у станции приблизительная по сути, и об этом надо сказать до публикации.
           У встречи это важнее всех: участникам нужен адрес, а его тут не будет */
        (d.placeSt?'<div class="pad"><div class="demo-note" style="margin:0">'+icon('info')+'<span>'+
          (act?'Точка встанет рядом со станцией — точное место встречи напишите в описании'
              :'Точка встанет рядом со станцией, примерно')+'</span></div></div>':'')+
      '</div>';
    }
    foot='<button class="btn btn--primary" data-act="step" data-step="2"'+(d.x==null?' disabled':'')+'>Место выбрано'+icon('chev-right')+'</button>';
  }

  if(d.step===2){
    body+='<div class="pad stack">'+
      '<div class="opts">'+
      '<button class="typecard typecard--act'+(act?' is-on':'')+'" data-type="activity">'+
        '<span class="typecard__ic">'+icon('people')+'</span>'+
        '<span><b>Встреча</b><span>Соберите соседей на пробежку, футбол или уборку во дворе</span></span></button>'+
      '<button class="typecard typecard--offer'+(d.type==='need_offer'?' is-on':'')+'" data-type="need_offer">'+
        '<span class="typecard__ic">'+icon('box')+'</span>'+
        '<span><b>Услуга или вещь</b><span>Отдайте ненужное, попросите помощь или предложите то, что умеете</span></span></button>'+
      '<button class="typecard typecard--find'+(d.type==='lost_found'?' is-on':'')+'" data-type="lost_found">'+
        '<span class="typecard__ic">'+icon('search')+'</span>'+
        '<span><b>Находка или пропажа</b><span>Верните находку хозяину или попросите помощь в поисках</span></span></button>'+
      '</div>'+
      (!d.type?'':(d.type==='lost_found'
        ? fldLF(d)+
          '<div class="field"><label>Место</label>'+
            '<button class="radio'+(d.noPlace?'':' is-on')+'" data-draft="noPlace" data-val="">'+
              '<span class="radio__dot"></span><span>'+H(d.lfsub==='lost'?'Указано на карте':'Найдено здесь')+
              '<small>'+H(draftPlaceText()||'точка выбрана на первом шаге')+'</small></span></button>'+
            '<button class="radio'+(d.noPlace?' is-on':'')+'" data-draft="noPlace" data-val="1">'+
              '<span class="radio__dot"></span><span>Место не знаю<small>Событие не появится на карте, но будет в списках и оповещении</small></span></button>'+
          '</div>'+
          /* Осталась одна строка о том, что произойдёт прямо сейчас. Объяснение «почему так»
             отсюда убрано — ему место в онбординге, а согласие на рассылку соседям человек
             даёт в этот момент, и оно должно быть перед глазами */
          '<div class="demo-note" style="margin:0">'+icon('shield')+'<span>'+
            (d.lfsub==='lost'
              ? 'Оповещение уйдёт соседям станций, которые задевает зона поиска'
              : 'Появится в сообщениях у соседей ближайшей станции')+'</span></div>'
        : (act
        ? fldActivity(d)
        : fldOffer(d)+
          '<div class="demo-note" style="margin:0">'+icon('shield')+'<span>Место покажем кругом ~70 м, точный адрес — в переписке</span></div>')))+
    '</div>';
    foot='<button class="btn btn--primary" data-act="step" data-step="3"'+(step2Valid()?'':' disabled')+'>Дальше'+icon('chev-right')+'</button>';
  }

  if(d.step===3){
    body+='<div class="pad stack">'+fldBasic(d,act)+'</div>';
    var miss=draftMissing();
    foot='<div class="hint" id="draftMiss" style="text-align:center"'+(miss?'':' hidden')+'>'+H(miss||'')+'</div>'+
      '<button class="btn btn--primary" data-act="publish"'+(miss?' disabled':'')+'>'+icon('check')+'Опубликовать</button>';
  }
  /* Выход и возврат больше не делят одно место. Раньше на первом шаге стоял крестик,
     дальше он подменялся стрелкой — и бросить создание со второго шага было нечем,
     приходилось сперва отшагать обратно. Теперь крестик справа всегда, стрелка слева
     появляется там, где есть куда шагнуть */
  var nav=(d.step>1)
    ? '<button class="iconbtn" data-act="step" data-step="'+(d.step-1)+'" aria-label="Назад">'+icon('back')+'</button>'
    : '';
  /* Полоса шагов закреплена: она отвечает на «где я в этой форме», а уезжала с прокруткой
     вместе с первым полем. Заодно анимация перехода — заливается ровно один отрезок —
     перестала пропадать: раньше её не видел тот, кто пролистал форму вниз */
  /* На первом шаге высота по содержимому: точку выбирают, подводя карту под прицел,
     и поднятая шторка закрывает и прицел, и окрестности. Правило «один верхний край»
     распространяется на шторки, для которых карта — фон; здесь она рабочая поверхность */
  return {title:'Новое событие',body:body,foot:foot,tall:d.step>1,top:steps,topFlush:true,
    head:'<div class="chathead chathead--center">'+
      '<span class="chathead__side">'+nav+'</span>'+
      '<span class="chathead__txt"><span class="chathead__n">Новое событие</span></span>'+
      '<span class="chathead__side chathead__side--r">'+
        '<button class="iconbtn" data-act="create-close" aria-label="Закрыть">'+icon('close')+'</button>'+
      '</span></div>',
    after:function(){
    var bar=$('.stepbar'); if(!bar)return;
    var seg=bar.querySelectorAll('.stepseg'), i;
    void bar.offsetWidth;   /* даём браузеру увидеть исходное состояние отрезков */
    for(i=0;i<seg.length;i++)seg[i].classList.toggle('is-on',(i+1)<=d.step);
    stepAnimAt=d.step;
  }};
}
/* ---- редактирование опубликованного пина ---- */
/* Мастер спрашивает по одному шагу, потому что человек ещё не решил, что публикует.
   При правке решать нечего — он пришёл поменять одно поле и должен видеть все сразу,
   поэтому здесь один экран с прокруткой и кнопка «Сохранить». Черновик тот же самый,
   ui.draft, — значит и обработчики ввода те же, и расходиться этим двум формам негде */
function draftFromPin(p){
  var t=new Date(p.starts_at||now());
  return {step:3,editId:p.id,type:p.type,title:p.title,description:p.description,
    photos:(p.photos||[]).slice(),
    date:t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate()),
    time:pad2(t.getHours())+':'+pad2(t.getMinutes()),
    limit:p.participant_limit||'',approval:!!p.approval,
    subtype:p.subtype||'give_away',lfsub:p.subtype||'found',
    radius:p.area_radius||400,noPlace:p.x==null,
    repeat:p.repeat||'none',term:p.term||'30d',
    x:p.x,y:p.y,district_id:p.district_id};
}
function editValid(){
  var d=ui.draft; if(!d||!d.editId)return false;
  if(!d.title||d.title.trim().length<3)return false;
  if(d.type==='activity'&&(!d.date||!d.time))return false;
  return true;
}
function viewEdit(id){
  var p=pin(id), d=ui.draft;
  if(!p||!d)return {title:'Редактирование',back:true,
    body:'<div class="empty">'+icon('pin')+'<b>Событие удалено</b></div>'};
  var act=p.type==='activity';
  /* Тип и место сюда не вынесены намеренно: тип меняет смысл половины остальных полей,
     а место выбирают прицелом на карте — это отдельный режим, а не строка в форме */
  var body='<div class="pad stack">'+fldBasic(d,act)+
    (act?fldActivity(d):(p.type==='lost_found'?fldLF(d):fldOffer(d)))+
    '<span class="hint">Тип и место события изменить нельзя</span>'+
  '</div>';
  return {title:'Редактирование',sub:p.title,back:true,body:body,
    foot:'<button class="btn btn--primary" data-act="save-pin"'+(editValid()?'':' disabled')+'>'+
      icon('check')+'Сохранить</button>'};
}
function savePin(){
  var d=ui.draft; if(!editValid())return;
  var p=pin(d.editId); if(!p)return;
  p.title=d.title.trim(); p.description=d.description.trim(); p.photos=d.photos.slice();
  if(p.type==='activity'){
    p.starts_at=draftStart(); p.expires_at=p.starts_at+3*HOUR;
    p.repeat=d.repeat||'none';
    p.participant_limit=Math.max(0,parseInt(d.limit,10)||0);
    p.approval=!!d.approval;
  }else if(p.type==='lost_found'){
    p.subtype=d.lfsub;
    if(d.lfsub==='lost')p.area_radius=Math.max(100,parseInt(d.radius,10)||400);
    else delete p.area_radius;
  }else{
    p.subtype=d.subtype; p.category=SUBTYPES[d.subtype].cat; p.term=d.term||'30d';
  }
  save(); ui.draft=null;
  openPanel({type:'pin',id:p.id});
  toast('Изменения сохранены');
}
function draftStart(){
  var d=ui.draft;
  var ts=new Date((d.date||'')+'T'+(d.time||'12:00')).getTime();
  return isNaN(ts)?now()+DAY:ts;
}

/* ---- профиль ---- */
/* Вкладки режут по состоянию, а роль пишется на самой строке. Прежде было три вкладки,
   которые делили события сразу по двум основаниям: «Активные» и «Архив» — по состоянию,
   но только свои, а «Отклики» — по роли и сразу во всех состояниях. Отсюда две дыры:
   архива участия не существовало вовсе (прошедшая встреча навсегда оставалась в «Откликах»
   вперемешку с будущими), а «Отклики» смешивали поданную заявку, завтрашнюю встречу
   и то, что было месяц назад.
   Вопрос к профилю почти всегда временной — «что у меня сейчас», — а кто вы в этом
   событии, отвечает метка на строке. Такие метки в проекте уже есть, они стоят
   в списке участников */
/* Раздача книг уходит несколькими партиями: писало пятнадцать человек, встретились
   с пятью. Значит записывать нужно не «событие закрылось», а «мы встретились, и вы
   забрали» — а это факт пары, не события. Объект под него уже есть: отклик. Автор
   отмечает его в той переписке, где договорились, и событие уходит в архив к этому
   человеку. Неотмеченный отклик в чужой архив не попадает: мы не знаем, досталось ли */
function responseOf(pinId,userId){
  for(var i=0;i<db.responses.length;i++)
    if(db.responses[i].pin_id===pinId&&db.responses[i].user_id===userId)return db.responses[i];
  return null;
}
/* Роль в событии — одно значение, один текст и один источник на все места. Раньше карточка
   списка считала авторство сама и писала «Ваш пин» чипом, а профиль звал эту функцию
   и рисовал тегом «автор»: один факт, два независимых счёта и пять разных грамматик.
   Оформление остаётся разным осознанно — в общем списке роль надо заметить среди чужого,
   в своём профиле различить между собой, — а слова одни.
   Формы без рода (правило рядом, в statLine) и в прошедшем времени, когда событие закрыто:
   «участвую» про августовскую встречу — неправда. Авторство не истекает, у него одна форма */
/* Закончилось ли это дело лично для меня. Отметка передачи закрывает участие получателя,
   но не событие: событием распоряжается автор */
function doneForMe(p,m){
  m=m||me();
  if(!p||!m)return false;
  if(p.status!=='active')return true;
  if(p.author_id===m.id)return false;
  var r=responseOf(p.id,m.id);
  return !!(r&&r.settled_at);
}
function myRole(p,m){
  m=m||me();
  if(!p||!m)return '';
  var past=(p.status!=='active');
  if(p.author_id===m.id)return 'Вы автор';
  var r=responseOf(p.id,m.id);
  if(!r)return '';
  if(isAct(p)){
    if(r.status==='interested')return past?'Вы подавали заявку':'Вы подали заявку';
    return past?'Вы участвовали':'Вы участвуете';
  }
  if(r.settled_at)return p.type==='lost_found'?'Вам вернули':'Вы получили';
  return '';   /* просто написал — это ещё не участие */
}
function viewProfile(){
  var m=me();
  /* и свои события, и те, где вы участник: список один, роль — свойство строки */
  var seen={}, my=[];
  db.pins.forEach(function(p){
    if(seen[p.id])return;
    if(p.author_id===m.id||myRole(p,m)){seen[p.id]=1; my.push(p)}
  });
  my.sort(function(a,b){return (b.starts_at||b.created_at)-(a.starts_at||a.created_at)});
  /* Режем по состоянию моего участия, а не события: у встречи это одно и то же, а у вещи
     расходится — мне её отдали, а раздача идёт дальше. Закрыть чужое событие человек
     не вправе, и без этого его «Сейчас» копил бы чужие законченные дела */
  var active=my.filter(function(p){return !doneForMe(p,m)});
  var archive=my.filter(function(p){return doneForMe(p,m)});

  /* Колокол — глобальный вход, ему место в углу экрана; шестерня настраивает профиль,
     ей место рядом с профилем. На десктопе у разделов шапки нет — её убрали, чтобы
     заголовок не дублировал пункт меню, — поэтому там колокол встаёт рядом с шестернёй */
  var sn=sysUnreadCount();
  /* в шапке колокол прижимается к правому краю тем же классом, что и меню карточки пина */
  function bellHTML(cls){
    return '<button class="iconbtn iconbtn--20 bellbtn'+(cls?' '+cls:'')+'" data-act="open-sys" aria-label="Уведомления" title="Уведомления">'+
      icon('bell')+(sn?'<span class="bellbtn__n">'+(sn>99?'99+':sn)+'</span>':'')+'</button>';
  }
  var bell=bellHTML('');
  var head='<div class="pad profhead">'+
    avatarHTML(m,'avatar--l')+
    '<div style="flex:1;min-width:0"><div style="font-size:var(--f-h40);line-height:var(--l-h40);font-weight:600">'+H(m.name)+'</div>'+
    '<div style="font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-3)">'+H(m.phone||'без телефона')+'</div></div>'+
    '<span class="headacts">'+(isDesktopPanel()?bell:'')+
      '<button class="iconbtn iconbtn--20" data-act="settings" aria-label="Настройки" title="Настройки">'+icon('gear')+'</button>'+
    '</span></div>';

  var tabs='<div class="tabs">'+
    /* архив последним: в него заходят реже всего, а стоял он между двумя живыми вкладками */
    [['active','Сейчас',active.length],['archive','Архив',archive.length]]
