    .map(function(t){return '<button data-tab="'+t[0]+'" class="'+(ui.profileTab===t[0]?'is-on':'')+'">'+t[1]+' '+t[2]+'</button>'}).join('')+
  '</div>';

  /* Роль ушла со строки в заголовок группы: в своём профиле она есть у каждой строки
     и потому почти ничего не различает — двенадцать раз «Вы автор» подряд читаются как
     фон, а место занимают на каждой строке, из-за чего время не помещалось.
     Ось деления не меняется: вкладки по-прежнему режут по состоянию, роль — группировка
     внутри состояния, а не третья вкладка, как было до 3.4 */
  function rows(list){
    return list.map(function(p){
      return '<button class="listrow listrow--chat" data-pin="'+p.id+'">'+
        pinCover(p)+
        '<span class="listrow__body"><span class="listrow__t">'+H(p.title)+'</span>'+
        '<span class="listrow__s">'+H(rowFact(p))+'</span></span>'+
        '<span class="listrow__r">'+icon('chev-right')+'</span></button>';
    }).join('');
  }
  function rowsFor(list,past){
    if(!list.length)return '<div class="empty">'+icon('pin')+'<b>Пока пусто</b><p>События, которые вы создадите, появятся здесь</p></div>';
    var own=list.filter(function(p){return p.author_id===m.id});
    var join=list.filter(function(p){return p.author_id!==m.id});
    /* Между группами крупный разделитель — тот же, которым разведены группы в настройках
       и в фильтре. Заголовку после него хватает 16: полоса добавляет свои 8, и суммарный
       отступ сходится с первым заголовком, у которого полосы над ним нет */
    function group(ttl,l,after){
      return l.length?'<div class="eyebrow" style="padding:'+(after?16:24)+'px 16px 0">'+ttl+' · '+l.length+'</div>'+rows(l):'';
    }
    var gap=(own.length&&join.length)?'<div class="divider divider--lg"></div>':'';
    return group('Ваши события',own)+gap+group(past?'Участвовали':'Участвуете',join,!!gap);
  }

  /* старое значение вкладки переживает обновление: «resp» больше не существует */
  if(ui.profileTab!=='archive')ui.profileTab='active';
  var body=head+tabs+'<div class="swrap"><div id="swArea">'+
    rowsFor(ui.profileTab==='archive'?archive:active,ui.profileTab==='archive')+'</div></div>';

  return {title:'Профиль',body:body,section:true,
    action:isDesktopPanel()?'':bellHTML('chathead__act'),
    after:function(){scrollTabIntoView($('#panel'))}};
}

/* ---- профиль соседа ---- */
/* Счётчики считаются из причин закрытия и отдельного ввода не требуют. Оценок и отзывов
   здесь нет сознательно: оценка уместна там, где была сделка, а сосед, бесплатно отдавший
   шкаф, не может быть осмысленно оценён на четыре из пяти. Факт сообщает больше звёзд
   и не даёт отыграться */
/* Кроме счётчиков собираем свежесть и размах: число говорит «сколько», но молчит про
   «когда», а профиль незнакомого соседа читают именно ради этого — четыре встречи прошлым
   летом и четыре за месяц выглядят одинаково. `last` — когда в последний раз что-то
   состоялось, `crowd` — сколько человек в среднем собирали его встречи */
function userStats(id){
  var st={met:0,given:0,returned:0,joined:0,got:0,last:0,crowd:0};
  var seats=0;
  function mark(ts){if(ts&&ts>st.last)st.last=ts}
  db.pins.forEach(function(p){
    if(p.author_id!==id||p.close_reason!=='done')return;
    if(isAct(p)){st.met++; seats+=joinedOf(p.id).length}
    else if(p.type==='need_offer')st.given++;
    else if(p.type==='lost_found')st.returned++;
    mark(p.closed_at||p.created_at);
  });
  db.responses.forEach(function(r){
    var p=pin(r.pin_id); if(!p||r.user_id!==id)return;
    if(isAct(p)){
      if(r.status!=='interested'&&p.close_reason==='done'){st.joined++; mark(p.closed_at||p.starts_at)}
    }else if(r.settled_at){st.got++; mark(r.settled_at)}
  });
  if(st.met)st.crowd=Math.round(seats/st.met);
  return st;
}
/* Формулировки безличные не для красоты: «провёл» и «сходила» требуют знать род человека,
   а мы его не знаем и по имени угадывать не станем */
function statLine(st){
  var out=[];
  if(st.met)out.push('проведено встреч: '+st.met);
  if(st.joined)out.push('участие во встречах: '+st.joined);
  if(st.given)out.push('отдано вещей: '+st.given);
  if(st.returned)out.push('возвращено находок: '+st.returned);
  if(st.got)out.push('получено от соседей: '+st.got);
  return out;
}
/* С кем реально что-то состоялось, а не с кем переписывался: написать можно любому и ничем
   это не кончится, а совместная закрытая встреча или переданная вещь — состоявшийся
   контакт, и накрутить его публикациями нельзя */
function metPeople(id){
  var out={};
  db.pins.forEach(function(p){
    if(p.close_reason!=='done')return;
    var side=joinedOf(p.id).map(function(r){return r.user_id});
    if(!isAct(p)){
      side=[p.author_id];
      db.responses.forEach(function(r){if(r.pin_id===p.id&&r.settled_at)side.push(r.user_id)});
    }
    if(side.indexOf(id)<0)return;
    side.forEach(function(u){if(u!==id)out[u]=1});
  });
  return Object.keys(out);
}
/* Полный список чужих контактов публично не показываем — это раскрытие социального графа,
   а приложение знает, у какой станции человек живёт. Лица только у общих: про них вы
   и так знаете, нового не раскрывается. Остальные — числом */
/* Композиция из одного элемента ничего не сообщает — это просто цветная черта во всю
   ширину с числом, которое и так написано рядом. Поэтому полоса появляется от двух типов */
function typeBar(parts){
  var live=parts.filter(function(x){return x[1]>0});
  if(live.length<2)return '';
  return '<div class="statbar">'+live.map(function(x){
      return '<i style="flex:'+x[1]+';background:var(--'+x[0]+')"></i>';
    }).join('')+'</div>'+
    '<div class="statlegend">'+live.map(function(x){
      return '<span><i style="background:var(--'+x[0]+')"></i>'+H(x[2])+' '+x[1]+'</span>';
    }).join('')+'</div>';
}
function statBar(st){
  return typeBar([['act',st.met+st.joined,'Встречи'],['offer',st.given+st.got,'Вещи'],['find',st.returned,'Находки']]);
}
function viewUser(id,pinctx){
  var u=user(id);
  if(!u)return {title:'Сосед',back:true,body:'<div class="empty">'+icon('user')+'<b>Профиль не найден</b></div>'};
  var st=userStats(id), lines=statLine(st), self=(id===db.currentUserId);
  var mineP=db.pins.filter(function(p){return p.author_id===id&&!hiddenForMe(p)});
  var act=mineP.filter(function(p){return p.status==='active'});
  var past=mineP.filter(function(p){return p.status!=='active'});

  var head='<div class="pad" style="display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)">'+
    avatarHTML(u,'avatar--l')+
    '<div style="flex:1;min-width:0"><div style="font-size:var(--f-h40);line-height:var(--l-h40);font-weight:600">'+
      H(u.name)+'</div>'+
    /* про себя дата присоединения бесполезна, поэтому на своём профиле под именем
       стоит принадлежность, а не она */
    '<div style="font-size:var(--f-s10);line-height:var(--l-s10);color:var(--ink-3)">'+
      H(self?'это вы':joinedText(u))+'</div></div>'+
    /* Кнопка появляется только там, где есть событие, по которому писать: имя в чате
       и список участников её приносят, лента и летопись — нет. Без неё профиль соседа
       стал бы тупиком, ведь имя в переписке теперь ведёт сюда, а не в личку */
    ((!self&&pinctx&&pin(pinctx))
      ? '<button class="iconbtn iconbtn--20" data-act="dm" data-id="'+H(id)+'" data-pin="'+H(pinctx)+
        '" aria-label="Написать" title="Написать">'+icon('chat')+'</button>' : '')+
    '</div>';

  /* Полоса состава отвечает на «чем именно человек занят» за полсекунды — организатор
     встреч перед вами или раздающий вещи. Текстовые строки ниже говорят про роль */
  var met=metPeople(id);
  /* свой круг считается один раз, а не заново на каждого проверяемого соседа */
  var mine2=self?null:metPeople(db.currentUserId);
  var mutual=self?[]:met.filter(function(u){return mine2.indexOf(u)>=0});
  var bar=statBar(st);
  var facts='<div class="pad stack">';
  if(bar)facts+='<div><div class="eyebrow" style="margin-bottom:8px">Чем занимается в районе</div>'+bar+'</div>';
  if(met.length){
    /* Настоящее время вместо «пересёкся»: рода у него нет, а угадывать род по имени
       мы не станем — то же правило, что в statLine.
       Имена вперёд, число в хвост, тем же приёмом, что у станций: «50 общих с вами»
       и три имени расходились между собой, стоило кругу стать больше трёх. Если в хвосте
       остался ровно один, называем его — «и ещё 1» не экономит ничего, а имя полезнее */
    var mn=mutual.map(function(u){var uu=user(u);return uu?uu.name:'сосед'});
    var shown=mn.length>4?mn.slice(0,3):mn, restN=mn.length-shown.length;
    facts+='<div class="factrow">'+icon('people')+'<div><b>'+
      (self?'Вы пересекаетесь с ':'Пересекается с ')+met.length+' '+plural(met.length,'соседом','соседями','соседями')+'</b>'+
      (mn.length?'<span>Общие соседи: '+H(shown.join(', '))+(restN?' и ещё '+restN:'')+'</span>':'')+
    '</div></div>';
  }
  if(lines.length){
    /* Подпись — про свежесть, а не про количество: счётчик уже сказал «сколько»,
       а «когда» не сказал никто. Формулировка относительная — «восемнадцатое это чего?» */
    var fresh=st.last?('последнее — '+lowerFirst(agoText(st.last))
      +(st.crowd>1?', собирается по '+st.crowd+' '+plural(st.crowd,'соседу','соседа','соседей'):'')):'';
    /* свежесть впереди остальных счётчиков: она отвечает на вопрос, которого у них нет */
    var subline=[fresh].concat(lines.slice(1)).filter(Boolean).join(' · ');
    facts+='<div class="factrow">'+icon('check')+'<div><b>'+H(lines[0].charAt(0).toUpperCase()+lines[0].slice(1))+'</b>'+
      (subline?'<span>'+H(subline.charAt(0).toUpperCase()+subline.slice(1))+'</span>':'')+'</div></div>';
  }else{
    facts+='<div class="factrow">'+icon('clock')+'<div><b>Пока без истории</b>'+
      '<span>Счётчики появятся, когда закроется первое событие</span></div></div>';
  }
  facts+='</div>';

  function rows(list){
    return list.map(function(p){
      return '<button class="listrow listrow--chat" data-pin="'+p.id+'">'+pinCover(p)+
        '<span class="listrow__body"><span class="listrow__t">'+H(p.title)+'</span>'+
        '<span class="listrow__s">'+H(rowFact(p))+'</span></span>'+
        '<span class="listrow__r">'+icon('chev-right')+'</span></button>';
    }).join('');
  }
  /* Пустой раздел не показываем вовсе: в профиль ведёт и список участников, а туда попадает
     тот, кто участвует, но сам ничего не создавал — у него пусты оба раздела. Заголовок над
     пустотой в таком профиле выглядел бы поломкой, хотя человек просто ещё не публиковал */
  /* Профиль соседа устроен как свой: то же деление вкладками по состоянию. Двумя секциями
     подряд «Завершено» было видно только прокруткой, и два профиля про разных людей
     читались как два разных решения одной задачи. Групп по роли здесь нет и не будет:
     участие соседа публично не показываем, в его профиле только опубликованное им */
  if(ui.userTab!=='archive')ui.userTab='active';
  var uTabs='<div class="tabs">'+
    [['active','Сейчас',act.length],['archive','Архив',past.length]]
    .map(function(t){return '<button data-usertab="'+t[0]+'" class="'+(ui.userTab===t[0]?'is-on':'')+'">'+t[1]+' '+t[2]+'</button>'}).join('')+
  '</div>';
  var uList=(ui.userTab==='archive')?past:act;
  var body=head+facts+
    ((act.length||past.length)
      ? '<div class="divider divider--lg"></div>'+uTabs+
        (uList.length?rows(uList)
          :'<div class="empty">'+icon('archive')+'<b>'+(ui.userTab==='archive'?'В архиве пусто':'Сейчас ничего нет')+'</b></div>')
      : '<div class="empty">'+icon('pin')+'<b>Пока ничего не публиковал</b>'+
        '<p>Здесь появятся события, которые сосед создаст</p></div>');
  /* Имя стоит в теле экрана крупно, поэтому в шапке оно дублировалось. Как и в карточке
     пина, оно проявляется только при прокрутке — в покое там одна стрелка */
  return {title:H(u.name),fadeTitle:true,back:true,body:body};
}

/* ---- настройки профиля ---- */
/* спрятаны под шестерню в шапке профиля: сам профиль стал коротким, а настройки живут
   отдельным экраном с такой же узкой шапкой «назад», как у переписки */
function alertsOn(){var m=me();return !m||m.lost_alerts!==false}
/* Три положения, а не выключатель: если телефон в тёмном режиме, приложение уже тёмное,
   и тумблер «Тёмная тема» стоял бы в «выкл», говоря неправду. CSS к трём состояниям
   готова с самого начала — голый :root светлый, media-запрос тёмный по системе,
   [data-theme] перебивает и то и другое */
/* Источник — состояние приложения, а хранилище и атрибут его следствия. Раньше контрол
   читал только хранилище: если запись не проходила — в артефакте это бывает, там и база
   не всегда сохраняется, — тема менялась, а сегментед продолжал показывать «Системная» */
var themeCur=null;
function themeMode(){
  if(themeCur)return themeCur;
  var a=document.documentElement.getAttribute('data-theme');
  if(a==='dark'||a==='light')return a;
  try{var t=localStorage.getItem('raion_theme'); if(t==='dark'||t==='light')return t}catch(e){}
  return 'auto';
}
function setTheme(m){
  themeCur=(m==='auto')?null:m;
  try{
    if(m==='auto')localStorage.removeItem('raion_theme');
    else localStorage.setItem('raion_theme',m);
  }catch(e){}
  if(m==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',m);
}
function viewSettings(){
  var tm=themeMode();
  var theme='<div class="field"><label>Тема оформления</label><div class="segctl">'+
    [['auto','Системная'],['light','Светлая'],['dark','Тёмная']].map(function(o){
      return '<button data-theme-set="'+o[0]+'" class="'+(tm===o[0]?'is-on':'')+'">'+o[1]+'</button>';
    }).join('')+'</div></div>';
  var body='<div class="pad stack">'+theme+'</div><div class="divider divider--lg"></div>'+
    '<div class="pad stack">'+
    '<div class="switchrow"><span class="switchrow__txt">'+
      '<b>Считать расстояние от меня</b>'+
      '<span>Выключено — считаем от станции до события, включено — от вас</span>'+
    '</span><button class="switch'+(geoOn()?' is-on':'')+'" data-act="toggle-geo" role="switch" aria-checked="'+(geoOn()?'true':'false')+'" aria-label="Считать расстояние от меня"><i></i></button></div>'+
    '<div class="divider"></div>'+
    '<div class="switchrow"><span class="switchrow__txt">'+
      '<b>Оповещения о пропажах</b>'+
      '<span>Соседи иногда теряют ключи и животных. Находки приходят тихо, строкой в сообщениях, а пропажи — сразу.</span>'+
    '</span><button class="switch'+(alertsOn()?' is-on':'')+'" data-act="toggle-alerts" role="switch" aria-checked="'+(alertsOn()?'true':'false')+'" aria-label="Оповещения о пропажах"><i></i></button></div>'+
  '</div>'+
  '<div class="divider divider--lg"></div>'+
  '<div class="pad stack">'+
    '<button class="btn btn--line" data-act="open-scope">'+icon('filter')+'Фильтры'+'</button>'+
    '<button class="btn btn--line" data-act="rename">'+icon('user')+'Изменить имя'+'</button>'+
  '</div>'+
  '<div class="divider divider--lg"></div>'+
  '<div class="pad stack">'+
    '<button class="btn btn--danger" data-act="reset">'+icon('reset')+'Сбросить прототип'+'</button>'+
    '<span class="hint">Сброс удалит ваш профиль, события и переписку из браузера и вернёт демо-данные</span>'+
  '</div>';
  return {title:'Настройки',section:true,back:true,body:body};
}

/* миниатюра пина для строк списка: фотография, иначе цветная подложка по категории.
   Одна на чаты и профиль, чтобы строки не расходились */
function pinCover(p,small){
  var act=p&&p.type==='activity';
  var cls='listrow__cover'+(small?' listrow__cover--s':'');
  return (p&&p.photos&&p.photos.length)
    ? '<img class="'+cls+'" src="'+p.photos[0]+'" alt="">'
    : '<span class="'+cls+' listrow__cover--'+(p?ptype(p).cls:'muted')+'">'+icon(p?pinGlyph(p):'pin')+'</span>';
}
/* ---- сообщения ---- */
/* Раздел назывался «Чаты», пока внутри были только переписки. Теперь тут три вида строк,
   и «Сообщения» — честнее. Вкладки делят разговоры по типу пина, системный канал
   закреплён сверху и живёт только во «Всех»: он не про пин, а про сервис */
var MSG_TABS=[{k:'all',label:'Все'},{k:'activity',label:'Встречи'},
              {k:'need_offer',label:'Услуги и вещи'},{k:'lost_found',label:'Находки'}];
function threadPinType(t){var p=pin(t.pin_id);return p?p.type:null}
/* Переписка уходит из списка через неделю после закрытия пина: разговор о передаче
   доигрывается уже после закрытия, и она не должна исчезать из-под пальца собеседника.
   Дальше она доступна через профиль: архив -> объявление -> переписка */
function threadVisible(t){
  if(threadKind(t)==='system')return true;
  var p=pin(t.pin_id);
  if(!p||p.status==='active')return true;
  return !(p.closed_at&&(now()-p.closed_at)>7*DAY);
}
/* Уведомления ушли из «Сообщений» в профиль: на них никто не отвечает, а деля счётчик
   с живыми людьми, они делали его двусмысленным. Теперь число на «Сообщениях» значит
   ровно одно — вам написал человек */
function threadsFor(tab){
  /* Совпадения по тексту собираем одним проходом по сообщениям, а не сканируя их заново
     для каждой переписки: было произведение «переписки × сообщения» на каждую букву */
  var q=(ui.msgQuery||'').trim().toLowerCase(), hit=null;
  if(q){
    hit={};
    for(var mi=0;mi<db.messages.length;mi++){
      var mm=db.messages[mi];
      if((mm.text||'').toLowerCase().indexOf(q)>=0)hit[mm.thread_id]=1;
    }
  }
  return db.threads.filter(function(t){
    if(!threadVisible(t)||threadKind(t)==='system')return false;
    /* право видеть переписку — это членство в ней. У общего чата членство выводится
       из состава события, поэтому вышедший из встречи выходит и из разговора сам,
       без отдельной уборки */
    if(!inThread(t,db.currentUserId))return false;
    if(tab!=='all'&&threadPinType(t)!==tab)return false;
    /* Ищем сразу по трём полям: набрав «кот», находите и чат поиска кота, и переписку,
       где его упомянули */
    if(!q)return true;
    if(hit[t.id])return true;
    var p=pin(t.pin_id), ou=otherUser(t);
    if(p&&p.title.toLowerCase().indexOf(q)>=0)return true;
    if(ou&&ou.name.toLowerCase().indexOf(q)>=0)return true;
    return false;
  }).sort(function(a,b){
    var la=lastMessage(a.id),lb=lastMessage(b.id);
    return (lb?lb.created_at:b.created_at)-(la?la.created_at:a.created_at);
  });
}
/* сколько уведомлений пришло после вашего последнего захода в канал */
function sysUnreadCount(){
  var st=sysThread(false); if(!st)return 0;
  var seen=st.seen_at||0;
  return messagesOf(st.id).filter(function(m){return m.created_at>seen}).length;
}
function tabUnread(tab){
  return threadsFor(tab).filter(function(t){return threadKind(t)!=='system'&&threadUnread(t)}).length;
}
function threadRow(t){
  var m=lastMessage(t.id), unread=threadUnread(t), kind=threadKind(t);
  /* Слева лицо собеседника, а не цветной квадрат: разговор ведут с человеком, и узнают
     строку по нему. Тип пина при этом не теряется — его несёт вертикальная линия, та же,
     что в карточках списка. На вкладке одного типа она становится прозрачной, но место
     под неё остаётся: иначе строки прыгали бы при переключении */
  var title, sub, cover, p=pin(t.pin_id);
  if(kind==='system'){
    title='Район'; sub='Уведомления';
    cover='<span class="listrow__cover" style="background:var(--brand-soft);color:var(--brand-icon)">'+icon('bell')+'</span>';
  }else{
    var u=otherUser(t);
    /* Слева картинка события, а не лицо: строка про пин, и узнают её по нему. Особенно
       в общем чате, где заголовок «Чат участников» и ничьё отдельное лицо не подходит.
       Тип при этом несёт вертикальная линия — у пина с фотографией цвет иначе пропадает.
       Но у одной находки чатов бывает несколько — по одному на соседа плюс общий, — и все
       они получали одну и ту же фотографию. Поэтому в личной переписке поверх обложки
       встаёт лицо собеседника; у общего чата его нет, и это отсутствие и есть признак */
    title=(kind==='group')?groupName(pin(t.pin_id)):(u?u.name:'Сосед');
    sub=p?p.title:'Событие удалено';
    cover='<span class="listrow__pic">'+((p&&p.photos&&p.photos.length)
      ? '<img class="listrow__cover listrow__cover--lg" src="'+p.photos[0]+'" alt="">'
      : '<span class="listrow__cover listrow__cover--lg listrow__cover--'+(p?ptype(p).cls:'muted')+'">'+icon(p?pinGlyph(p):'pin')+'</span>')+
      ((kind!=='group'&&u)?avatarHTML(u,'avatar--s listrow__face'):'')+
    '</span>';
  }
  /* У уведомления пояснение само по себе бессмысленно («ищет Дима С., ваша станция»),
     поэтому в списке показываем заголовок с названием пина — то, из чего понятно, о чём речь */
  var prev='Нет сообщений';
  if(m&&kind==='system'&&m.title){
    var mp=m.obj?pin(m.obj):null;
    prev=m.title+(mp?' · '+mp.title:'');
  }else if(m){
    prev=(m.author_id===db.currentUserId?'Вы: ':'')+m.text;
  }
  /* Время и точка стоят в одной строке с именем, а не отдельным столбцом справа: столбец
     резервировал ширину на всю высоту строки, и название пина с текстом обрывались на той
     же вертикали, хотя под временем было пусто */
  var open=!!(ui.panel&&ui.panel.type==='thread'&&ui.panel.id===t.id);
  return '<button class="listrow listrow--chat'+(open?' is-sel':'')+'" data-thread="'+t.id+'">'+
    '<i class="listrow__rule'+((p&&ui.msgTab==='all')?' listrow__rule--'+ptype(p).cls:'')+'"></i>'+cover+
    '<span class="listrow__body">'+
      '<span class="listrow__top">'+
        '<span class="listrow__t">'+H(title)+'</span>'+
        '<span class="listrow__time">'+H(m?listTime(m.created_at):'')+'</span>'+
        (unread?'<span class="unread"></span>':'')+
      '</span>'+
      (kind==='system'?'':'<span class="listrow__pin">'+H(sub)+'</span>')+
      '<span class="listrow__msg">'+H(prev)+'</span>'+
    '</span></button>';
}
function viewChats(){
  /* счётчик на каждой вкладке обязателен: без цифры вкладка перестаёт быть линзой
     и становится тайником, где непрочитанное лежит незамеченным */
  /* Кружок в цвет типа: вкладки здесь — линза по типам, а у типов цвет уже есть. У «Все»
     кружка нет: три микроточки рядом с числом непрочитанных превращаются в рябь.
     Цвет не гаснет на неактивной вкладке — он обозначает тип, а не состояние: за состояние
     отвечают подчёркивание и насыщенность */
  var tabs='<div class="tabs">'+MSG_TABS.map(function(t){
    var n=tabUnread(t.k), pt=PIN_TYPES[t.k];
    /* подчёркивание красится типом, как и счётчик: у «Все» типа нет, там остаётся тёмное */
    return '<button data-msgtab="'+t.k+'" class="'+(ui.msgTab===t.k?'is-on':'')+(pt?' tab--'+pt.cls:'')+'">'+
      H(t.label)+(n?'<span class="tag'+(pt?' tag--'+pt.cls:'')+'">'+n+'</span>':'')+'</button>';
  }).join('')+'</div>';
  /* Поиск и вкладки уехали в закреплённую зону панели — ту же, где на карте живёт строка
     поиска. Прокручиваться они перестали сами, без липкости и без щелей, на которые мы
     напоролись в фильтрах. Заголовок раздела убран: его место заняло поле, а контекст
     и так горит на вкладке внизу */
  var mq=(ui.msgQuery||'').trim();
  /* Первые две полосы те же, что на карте: поле поиска в поле 16 с разделителем под ним,
     под ним ряд высотой с шапку. Раньше здесь разделителя не было вовсе, а поля были 12 —
     при переключении экранов полосы разъезжались на несколько пикселей */
  var top='<div class="searchzone"><div class="searchfield">'+icon('search','searchfield__ic')+
      '<input class="input" id="msgSearch" placeholder="Поиск по сообщениям" value="'+H(mq)+'" autocomplete="off">'+
    '</div></div><div class="tabswrap">'+tabs+'</div>';
  var list=threadsFor(ui.msgTab);
  var body='<div class="swrap"><div id="swArea">'+(list.length
    ? list.map(threadRow).join('')
    : '<div class="empty">'+icon(mq?'search':'chat')+'<b>'+(mq?'Ничего не нашлось':'Здесь пусто')+'</b>'+
      '<p>'+(mq?'Попробуйте другое слово'
               :'Переписка открывается, когда вы откликаетесь на событие или пишете его автору')+'</p></div>')+
  '</div></div>';
  return {title:'Сообщения',top:top,topFlush:true,body:body,section:true,after:function(){scrollTabIntoView($('#panel'))}};
}

/* Уведомление с вопросом переживает свой ответ: через день оно всё ещё висит в канале и без
   этого предлагало бы подтвердить то, что давно прошло. Исход не хранится — он выводится
   из самого отклика: подтверждён, снят или всё ещё ждёт ответа */
/* Итог и действие — разное, поэтому и живут врозь: итог плашкой в строке времени справа,
   действие кнопкой ниже. Кнопка рядом с временем читалась бы как приписка к нему */
function sysStatus(m,op){
  if(m.ask!=='confirm')return '';
  if(m.obj&&!op)return '<span class="chip chip--plate">Событие удалено</span>';
  if(!op)return '';
  var r=myResponse(op.id);
  if(r&&r.confirmed_at)return '<span class="chip chip--plate">'+icon('check')+'Подтверждено</span>';
  if(!r)return '<span class="chip chip--plate">Участие отменено</span>';
  return '';
}
function sysBtn(m,op){
  /* пин исчез — вести некуда, и кнопка, которая ничего не делает, хуже её отсутствия */
  if(m.obj&&!op)return '';
  if(sysStatus(m,op))return '';
  /* Напоминание на то и напоминание, чтобы на него можно было ответить, не уходя никуда.
     Раньше оно предлагало только «Открыть» и отправляло искать те же две кнопки в карточке */
  if(m.ask==='confirm'&&op){
    var cr=myResponse(op.id);
    if(cr)return '<span class="row">'+
      '<button class="btn btn--line btn--sm" data-act="confirm-no" data-id="'+H(cr.id)+'">Не смогу</button>'+
      '<button class="btn btn--primary btn--sm" data-act="confirm-go" data-id="'+H(cr.id)+'">'+icon('check')+'Иду</button>'+
    '</span>';
  }
  /* «Открыть» и «Посмотреть» убраны: карточка ведёт в событие целиком, и кнопка говорила бы
     ровно то же второй раз. Кнопки остались только у действий, которых переход не заменяет */
  return '';
}
function viewThread(id){
  var t=null;
  for(var i=0;i<db.threads.length;i++)if(db.threads[i].id===id)t=db.threads[i];
  if(!t)return {title:'Чат',back:true,body:'<div class="empty">'+icon('chat')+'<b>Переписка не найдена</b></div>',
    head:'<div class="chathead"><button class="iconbtn" data-act="back" aria-label="Назад">'+icon('back')+'</button></div>'};
  var u=otherUser(t), p=pin(t.pin_id), msgs=messagesOf(t.id);
  /* Прежнюю отметку о прочтении снимаем до того, как поставить новую: иначе новых
     сообщений не бывает никогда — экран сам себя объявляет прочитанным при отрисовке */
  var prevSeen=(t.seen_at===undefined)?Infinity:(t.seen_at||0);
  if(t.seen_at!==undefined){t.seen_at=now();save();}

  if(threadKind(t)==='system'){
    var shead='<div class="chathead">'+
      '<button class="iconbtn" data-act="back" aria-label="Назад">'+icon('back')+'</button>'+
      '<span class="chathead__txt" style="padding-left:2px">'+
        '<span class="chathead__n">Район</span><span class="chathead__p">Уведомления</span></span></div>';
    /* Порядок теперь такой же, как в переписке: старые сверху, новые внизу, экран открыт
       на последнем. Канал шёл наоборот и был единственным местом в приложении, где время
       течёт вверх */
    /* Новые сверху: уведомления — крупные карточки, а не реплики разговора, и листать до
       них вниз незачем. Отдельной метки «Новые» тоже нет — непрочитанное отмечено обводкой */
    var sday=null;
    var sbody=msgs.length
      ? '<div class="pad stack" id="chatScroll">'+msgs.slice().reverse().map(function(m){
          var out='', dl=dayLabel(m.created_at);
          if(dl!==sday){sday=dl; out+='<div class="daysep">'+H(dl)+'</div>'}
          var op=m.obj?pin(m.obj):null, st=sysStatus(m,op);
          /* Уведомление называет событие — название и есть вход в него. Прежде туда вела
             только кнопка, а она исчезает, как только на напоминание ответили: карточка
             оставалась тупиком. Делегирование кликов сначала ищет data-act, поэтому кнопки
             действия («Иду», «Не смогу») клик в переход не проваливают */
          return out+'<div class="sysmsg'+(m.created_at>prevSeen?' is-new':'')+(op?' sysmsg--go':'')+'"'+
            (op?' data-pin="'+H(op.id)+'"':'')+'>'+
            /* у старых сообщений заголовка нет — они остаются одним абзацем, как были */
            (m.title
              ? ((op||m.title)?'<div class="sysmsg__head">'+
                  (op?'<span class="chip chip--'+ptype(op).cls+'">'+icon(pinGlyph(op))+H(m.title)+'</span>':'')+
                  (op?'<span class="sysmsg__go">'+icon('chev-right')+'</span>':'')+'</div>':'')+
                '<div class="sysmsg__t">'+H(op?op.title:m.title)+'</div>'+
                '<div class="sysmsg__x">'+H(m.text)+'</div>'
              : '<div class="sysmsg__x">'+H(m.text)+'</div>')+
            '<div class="sysmsg__foot"><span class="sysmsg__d">'+H(hhmm(m.created_at))+'</span>'+st+'</div>'+
            sysBtn(m,op)+
          '</div>';
        }).join('')+'</div>'
      : '<div class="empty">'+icon('bell')+'<b>Пока тихо</b><p>Сюда придут напоминания о ваших событиях и оповещения о пропажах по соседству</p></div>';
    return {title:'Район',head:shead,section:true,body:sbody};
  }

  /* шапка как строка в списке чатов: фото пина, имя соседа, название пина. Кликабельна целиком —
     ведёт на карточку пина, поэтому отдельная строка-контекст под шапкой больше не нужна */
  var isGroup=threadKind(t)==='group';
  var tcover=(p&&p.photos&&p.photos.length)
    ? '<img class="listrow__cover listrow__cover--s" src="'+p.photos[0]+'" alt="">'
    : '<span class="listrow__cover listrow__cover--s listrow__cover--'+(p?ptype(p).cls:'muted')+'">'+icon(p?pinGlyph(p):'pin')+'</span>';
  /* Заголовок называет то, куда ведёт нажатие. У общего чата шапка открывает карточку
     события — значит вверху название события, а «чат участников» уходит второй строкой.
     У личной переписки нажатие теперь ведёт в профиль соседа, поэтому там наверху имя
     и правило соблюдено тем же способом */
  var mem=threadMembers(t).length;
  /* Заголовок называет то, куда ведёт нажатие, и ведёт оно всегда в событие: разговор
     идёт про него, и именно оно нужно под рукой — адрес, срок, что за вещь. Профиль
     собеседника открывается из самого разговора, по имени над сообщением */
  var tname=p?p.title:'Событие удалено';
  var tsub=isGroup
    ? (groupName(p)+', '+mem+' '+plural(mem,'участник','участника','участников'))
    : (u?u.name:'Сосед');
  var hmain=(p?' data-pin="'+p.id+'"':'');
  var head='<div class="chathead">'+
      '<button class="iconbtn" data-act="back" aria-label="Назад">'+icon('back')+'</button>'+
      '<button class="chathead__main"'+hmain+'>'+tcover+
        '<span class="chathead__txt">'+
          '<span class="chathead__n">'+H(tname)+'</span>'+
          '<span class="chathead__p">'+H(tsub)+'</span>'+
        '</span></button>'+
    '</div>';

  /* День назван разделителем, поэтому в самом пузырьке остаётся только время: раньше
     у каждого вчерашнего сообщения дата повторялась заново */
  var cday=null, prevAuthor=null;
  var chat=msgs.length?'<div class="chat" id="chatScroll">'+msgs.map(function(m,mi){
      var out=m.author_id===db.currentUserId;
      /* Имя стоит над первым сообщением серии подряд от одного человека — и в общем чате,
         и в личном. Раньше в общем оно повторялось над каждым пузырьком, а в личном
         его не было вовсе, и войти в профиль было неоткуда. Нажатие на имя — единственный
         вход в профиль: по самому пузырьку вести нельзя, это текст, его выделяют */
      var newRun=(m.author_id!==prevAuthor);
      if(!m.sys)prevAuthor=m.author_id;
      var au=(!out&&newRun&&!m.sys)?user(m.author_id):null;
      var sep='', dl=dayLabel(m.created_at);
      if(dl!==cday){cday=dl; sep='<div class="daysep">'+H(dl)+'</div>'}
      if(m.sys){prevAuthor=null; return sep+'<div class="chatnote">'+H(m.text)+'</div>'}
      if(sep)prevAuthor=m.author_id;
      return sep+'<div class="msg msg--'+(out?'out':'in')+'">'+
        (au?'<button class="msg__a" data-act="user" data-id="'+H(au.id)+'" data-pinctx="'+H(t.pin_id)+'">'+H(au.name)+'</button>':'')+
        H(m.text)+'<span class="msg__t">'+H(hhmm(m.created_at))+'</span></div>';
    }).join('')+(ui.typing===t.id?'<div class="typing"><i></i><i></i><i></i></div>':'')+'</div>'
    :'<div class="empty">'+icon('chat')+'<b>Напишите первым</b><p>'+
      (isGroup?'Здесь все участники: спросите про время, место или что взять с собой':'Договоритесь, когда и где удобно встретиться')+'</p></div>';

  /* Отмечает автор и только в личной переписке: у встречи для этого есть список
     участников, а у вещи и находки — вот этот разговор */
  var settle='';
  if(p&&!isAct(p)&&p.author_id===db.currentUserId&&!isGroup&&u){
    var sr=responseOf(p.id,u.id);
    /* Блок показывается только не-встречам, а текст говорил «встреча состоялась» — то есть
       врал всегда. И обещал архив обоим, хотя отметка закрыть событие не может: раздача
       уходит партиями, и решает тут автор. У соседа событие правда уходит в архив — его
       участие закончилось, а закрыть чужое событие он не вправе */
    var lf=(p.type==='lost_found');
    settle=(sr&&sr.settled_at)
      ? '<div class="cardnote"><span>'+(lf?'Отмечено: находка вернулась':'Отмечено: вещь передана')+'</span></div>'
      : '<div class="cardnote"><span><b>Договорились?</b><p>'+
          (lf?'Отметьте, когда вернёте — у соседа событие уйдёт в архив'
             :'Отметьте, когда передадите — у соседа событие уйдёт в архив')+'</p></span>'+
        '<button class="btn btn--line btn--sm" data-act="settle" data-id="'+H(u.id)+'" data-pin="'+H(p.id)+'">'+
          icon('check')+(lf?'Возвращено':'Передано')+'</button></div>';
    settle='<div class="pad" style="padding-bottom:0">'+settle+'</div>';
  }
  var foot='<div class="composer">'+
    '<textarea class="textarea" id="msgInput" rows="1" placeholder="'+(isGroup?'Сообщение участникам':'Сообщение соседу')+'" aria-label="Сообщение"></textarea>'+
    '<button class="iconbtn" data-act="send" aria-label="Отправить">'+icon('send')+'</button></div>';

  return {title:H(tname),head:head,section:true,body:settle+chat,foot:foot,after:function(){
    scrollChatToEnd();
  }};
}

/* ---- фильтры ---- */
/* Категории и станции — одно и то же по сути: и то и другое сужает список. Поэтому один экран
   вместо двух: сверху три взаимоисключающих варианта категорий (раньше это были два тумблера
   с правилом «хотя бы один включён» — правило исчезло само), ниже список станций */
/* Пока типов было два, три состояния двух тумблеров умещались в сегментед-контрол
   «Активности / Услуги и вещи / Все». С третьим типом таких состояний становится семь,
   и перечислять их бессмысленно — категории снова стали независимыми переключателями */
/* Обычный чекбокс: каждая категория сама по себе, снять можно все. Прежде тут стояли два
   особых правила — первый клик при всех включённых означал «только эту», а снятие последней
   возвращало все. Оба убраны: сузиться до одной теперь стоит двух нажатий вместо одного,
   зато переключатель делает ровно то, что нарисовано. А снятые до единой категории больше
   не откатываются молча — вместо пустой карты человек увидит объяснение */
function toggleCat(k){
  if(!PIN_TYPES[k])return;
  ui.filters[k]=!ui.filters[k];
}
function anyCat(){for(var t in PIN_TYPES)if(ui.filters[t])return true; return false}
function allCat(){for(var t in PIN_TYPES)if(!ui.filters[t])return false; return true}
/* сброс возвращает экран «Что показывать» в исходное: все категории, весь город, пустой поиск */
function resetFilters(){
  for(var t in PIN_TYPES)ui.filters[t]=true;
  setStations([]); ui.stQuery='';
}
function filtersDirty(){return !allCat()||!isCity()||!!(ui.stQuery||'').trim()}
/* кружки категорий: залитый — показывается, контурный — выключена */
function catDotsHTML(){
  var out='';
  for(var k in PIN_TYPES){
    var c='var(--'+PIN_TYPES[k].cls+')';
    out+='<i style="border-color:'+c+(ui.filters[k]?';background:'+c:'')+'"></i>';
  }
  return '<span class="catdots">'+out+'</span>';
}
/* Точка в цвет линии вместо значка метро: в мелком элементе кружок с буквой превращается
   в грязь, а цвет линии читается и в шесть пикселей. Полный значок остаётся там, где
   станция сама по себе предмет разговора — в списке станций и на карте */
function lineDot(id){
  return '<i class="linedot" style="background:'+district(id).lineColor+'"></i>';
}
/* точка и название неразлучны, поэтому и в разметке одним блоком */
function stationTag(id){
  return '<span class="stn">'+lineDot(id)+H(district(id).name)+'</span>';
}
/* Несколько станций пишем как «Добрынинская и ещё 3»: первая названа, чтобы человек узнал
   свою, остальные — точками в цвет их линий */
function scopeName(){
  if(isCity())return 'Весь город';
  if(ui.stations.length===1)return district(ui.stations[0]).name;
  return district(ui.stations[0]).name+' и ещё '+(ui.stations.length-1);
}
/* то же название, но с кружком линии, когда станция одна: в подзаголовке раздела она
   стояла голым текстом, хотя в чипах и на кнопке охвата давно ходит с кружком */
function scopeSubHTML(){
  if(isCity()||ui.stations.length!==1)return '';
  return stationTag(ui.stations[0]);
}
/* Одна станция — точка и название. Две — название первой и «и ещё 1» с точкой второй.
   Три и больше — число станций и точки, по одной на линию: при большом выборе названия
   всё равно не помещались, а цвета линий обрезались на краю кнопки */
function lineDotsHTML(ids){
  var seen={}, out='';
  ids.forEach(function(id){
    var c=district(id).lineColor;
    if(seen[c])return;
    seen[c]=1; out+='<i class="linedot" style="background:'+c+'"></i>';
  });
  return out;
}
function scopeStHTML(){
  if(isCity())return 'Весь город';
  var n=ui.stations.length;
  if(n===1)return '<span class="stn">'+lineDot(ui.stations[0])+H(district(ui.stations[0]).name)+'</span>';
  if(n===2)return '<span class="stn">'+lineDot(ui.stations[0])+H(district(ui.stations[0]).name)+'</span>'+
    '<span class="scopebtn__more">и ещё 1</span>'+lineDotsHTML(ui.stations.slice(1));
  return '<span class="scopebtn__more">'+n+' '+plural(n,'станция','станции','станций')+'</span>'+lineDotsHTML(ui.stations);
}
function scopeBtnHTML(){
  var n=homeList().length;
  return catDotsHTML()+
    '<b>'+n+' '+plural(n,'событие','события','событий')+'</b>'+
    '<span class="scopebtn__st">'+scopeStHTML()+'</span>'+
    icon('chev-down');
}

function viewScope(){
  /* Категории — ряд чипов над списком станций. Строками они были того же вида, что и станции,
     и на экране получалось двенадцать одинаковых строк, где первые три означают совсем другое.
     Чип — вещь заведомо иного рода: он переключается, а не открывается */
  var chips='';
  for(var k in PIN_TYPES){
    var t=PIN_TYPES[k], on=ui.filters[k], c='var(--'+t.cls+')';
    chips+='<button class="'+(on?'is-on':'')+'" data-cat="'+k+'">'+
      '<i style="border-color:'+c+(on?';background:'+c:'')+'"></i>'+H(t.label)+'</button>';
  }
  /* Подписей «что показывать» и «где искать» нет: первая дословно повторяла заголовок экрана,
     вторая объясняла очевидное — контрол и список станций и так разного вида */
  var seg='<div class="pad"><div class="segctl segctl--cat">'+chips+'</div></div><div class="divider divider--lg"></div>';
  /* В пресете девять станций, но в Москве их за две сотни, и список без поиска и разбора
     по веткам там нечитаем. Строим управление сейчас, пока набор мал: с ним ничего не
     меняется, а с большим оно понадобится сразу */
  /* Станции выбирают набором: человек живёт между ними, и одна станция теряла соседние.
     Выбранные стоят чипами сверху — их видно и снимать удобно, — а ниже поиск и список
     с галками. В пресете девять станций, в Москве их за две сотни, и поиск там обязателен */
  var q=(ui.stQuery||'').trim().toLowerCase();
  /* Галки нет: выбранное говорят и чипы сверху, и заливка строки — третий знак лишний.
     Строка ведёт себя как карточка списка, теми же заливкой и расходящимися линиями */
  function row(d){
    var n=pinsOfDistrict(d.id,{filtered:1}).length, on=ui.stations.indexOf(d.id)>=0;
    return '<button class="districtrow'+(on?' is-on':'')+'" data-station-toggle="'+d.id+'">'+
      '<svg class="metro" aria-hidden="true" style="color:'+d.lineColor+'"><use href="#i-metro"/></svg>'+
      '<span style="flex:1;min-width:0"><b>'+H(d.name)+'</b><span>'+H(d.sub)+'</span></span>'+
      /* число тегом: слово повторялось в каждой из девяти строк подряд, а смысл
         держится колонкой — все числа в одном месте на экране «Фильтры» */
      '<span class="cnt"><span class="tag">'+n+'</span></span></button>';
  }
  /* Поле поиска стоит над чипами: иначе оно ездило вниз, когда чипы переносились на новую
     строку. «Весь город» — не чип, а текстовая кнопка: рядом с выбранными станциями он
     неизбежно читался как ещё одна выбранная */
  var picked=ui.stations.length
    ? '<div class="stchips">'+ui.stations.map(function(id){
        return '<button class="chip stchip" data-station-toggle="'+id+'">'+stationTag(id)+icon('close')+'</button>';
      }).join('')+'</div>'+
      '<div class="stclear"><button class="linkbtn" data-scope="city">Показать весь город</button></div>'
    : '<div class="stclear"><span class="hint">Показан весь город — выберите станции ниже</span></div>';
  var tools='<div class="stools"><div class="searchfield" style="flex:1">'+
    icon('search','searchfield__ic')+
    '<input class="input" id="stInput" placeholder="Найти станцию" value="'+H(ui.stQuery||'')+'" autocomplete="off">'+
    (q?'<button class="searchfield__clear" data-act="st-clear" type="button" aria-label="Очистить">'+icon('close')+'</button>':'')+
  '</div></div>';
  var list=DISTRICTS.filter(function(d){
    return !q||d.name.toLowerCase().indexOf(q)>=0||d.sub.toLowerCase().indexOf(q)>=0;
  });
  /* На десктопе фильтр стоит второй колонкой, и как убывает число событий видно в списке
     слева. На телефоне списка рядом нет, прогрессии не видно — поэтому внизу плавает
     кнопка с числом. Она не «применить»: фильтры применяются сразу, каждым нажатием.
     Она называет результат и закрывает экран — и этим снимает вопрос, который вызывала
     одинокая стрелка «назад»: засчитано или нет */
  var nres=homeList().length;
  var done=isDesktopPanel()?'':'<div class="stdone"><button class="btn btn--primary" data-act="scope-done">'+
    'Показать '+nres+' '+plural(nres,'событие','события','событий')+'</button></div>';
  /* Всё, что выше списка станций, собрано в одну приклеенную шапку и стоит первым
     в прокрутке. Пока над ней лежали чипы категорий, её место в потоке не совпадало
     с местом, куда её прижимает, — а сдвигаю я относительно первого, вижу во втором.
     Между ними и открывалась щель: то станции уезжали под шапку, то шапка наезжала
     на первую строку. Совпадают они только когда приклеенный элемент первый */
  /* Приклеен только поиск. Чипы выбранных станций не могут быть липкими по своей природе —
     у них нет потолка высоты: девять станций давали четыре ряда, и приклеенная шапка
     съедала экран, оставляя от списка одну строку. Поле поиска остаётся над чипами,
     как и стояло: ниже их оно ездило бы вниз при каждом переносе строки */
  var body=seg+'<div class="feedhead">'+tools+'</div>'+picked+
    (list.length?list.map(row).join('')
      :'<div class="empty">'+icon('search')+'<b>Станция не нашлась</b></div>')+
    (isDesktopPanel()?'':'<div class="stdone__gap"></div>');
  /* сброс гаснет, когда сбрасывать нечего: все категории, весь город, пустой поиск */
  var act=filtersDirty()
    ? '<button class="iconbtn chathead__act" data-act="filters-reset" aria-label="Сбросить фильтры" title="Сбросить фильтры">'+icon('reset')+'</button>'
    : '';
  return {title:'Фильтры',body:body,back:true,screen:true,action:act,after:function(){
    var i=$('#stInput'); if(i&&ui.stFocus){i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  },foot:null,over:done};
}
